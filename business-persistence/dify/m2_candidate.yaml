    - id: start_1
      type: custom
      data:
        title: M2 六步验收输入
        type: start
        variables:
        - variable: actor_ref
          label: Actor Ref（一次性引导脚本已创建的 User.external_ref，必须是该 Workspace 的成员）
          type: text-input
          required: true
          max_length: 128
          options: []
        - variable: workspace_id
          label: Workspace ID（一次性引导脚本已创建）
          type: text-input
          required: true
          max_length: 128
          options: []
        - variable: account_id
          label: Account ID（一次性引导脚本已创建）
          type: text-input
          required: true
          max_length: 128
          options: []
        - variable: idempotency_prefix
          label: 本次运行标识（用于幂等键前缀，换一次真实测试请换一个值）
          type: text-input
          required: true
          max_length: 128
          options: []
        - variable: task_note
          label: 首次任务原始诉求（自然语言，作为快照 payload）
          type: paragraph
          required: true
          max_length: 4096
          options: []
        - variable: content_ref
          label: 候选内容引用（例如一个占位 s3:// 路径或文本）
          type: text-input
          required: true
          max_length: 1024
          options: []
        - variable: platform
          label: 发布平台标识
          type: text-input
          required: true
          max_length: 64
          options: []
        - variable: published_at
          label: 发布时间（ISO8601，例如 2026-08-25T00:00:00Z）
          type: text-input
          required: true
          max_length: 64
          options: []
        - variable: feedback_note
          label: 反馈原始观测（自然语言）
          type: paragraph
          required: true
          max_length: 4096
          options: []
        selected: false
      position:
        x: 80
        y: 260
      positionAbsolute:
        x: 80
        y: 260
      height: 88
      width: 242
      selected: false
      sourcePosition: right
      targetPosition: left
