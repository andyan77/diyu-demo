app:
  description: 'M2 业务持久化候选（技术验证）。直接调用 M2 business-persistence API 完成 Execution Prompt v1.1 SS5.12 六步验收：首次任务->保存状态->再次进入->登记发布实例->导入反馈->下一周期读取。不含
    M1 自然语言编译或路由；workspace/account 需先由一次性引导脚本创建。task_id: DIYU-V1-M2-BUSINESS-PERSISTENCE-VERSION-FEEDBACK-001。'
  icon: 🗄️
  icon_background: '#E0F2FE'
  icon_type: emoji
  mode: workflow
  name: M2 候选 - 业务持久化六步验收 (DO NOT USE FOR PRODUCTION)
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables: []
  rag_pipeline_variables: []
  features:
    file_upload:
      enabled: false
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
