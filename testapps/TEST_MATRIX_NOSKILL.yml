            - 不得输出任何推理过程标记。


            【输出合同】

            必须包含以下章节，缺一不可：

            - 第一部分

            - 第二部分

            - 账号责任

            - 唯一使命


            【顶层状态】

            正文首行按整行声明本次输出状态，取值只能是：正常完成时不声明停机状态；仅当输入不足以完成任务时，在正文开头整行声明 `INPUT_INSUFFICIENT`。

            '
