            【任务】

            为序里集这个女装零售品牌的四个内容账号定下分工与责任边界，产出一份账号矩阵。


            【硬性边界】

            - 只能使用下方冻结夹具中逐字给出的事实；夹具没有的商品、库存、价格、面料、顾客或经营事实一律不得补写。

