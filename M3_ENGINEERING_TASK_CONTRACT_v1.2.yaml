authorization_gate: >-
  This contract and its Execution Prompt are planning deliverables. Engineering
  may begin only when Founder explicitly instructs an execution window to execute
  this exact Prompt/contract version and hash. Mere file delivery, reading or
  transfer does not authorize repository, Dify, database or external-system writes.

what: >-
  Compile the frozen M3 semantic package into one independent, runnable Account
  Content Operator capability in a task-specific branch, worktree and Dify
  candidate/test App. Establish the M2 minimum projection and candidate-update
  seams, Content Brief-consumable content tasks, Runtime fidelity, longitudinal
  behavior, controlled same-model A/B, independent review, rollback and remote
  task-branch evidence, followed by Founder Dify product acceptance.

why: >-
  Give one account an evidence-bound continuous operating capability that can
  decide cycle mix, cadence, capacity, experiments, feedback response and
  justified non-change without becoming a scheduler, topic picker, positioning
  authority, creative director, production system or universal operating brain.

boundary:
  authorized_only_after_exact_founder_execution_instruction:
    - create or recover one independent M3 task branch and worktree
    - implement P0-required Skill, minimal conditional references, adapters, DSL, tests, fixtures, documentation and evidence
    - create or recover exactly one task-id-specific Dify candidate/test App in the currently authorized development/test workspace
    - run the actual candidate Workflow with the verified model/provider/parameters
    - record task-scoped Manifest, Attempts, Checkpoints, failures, rollback and acceptance evidence
    - commit and push only the remote M3 task branch and verify its full hash
    - invoke one implementation-independent, context-isolated, read-only Reviewer
  never_authorized_by_this_contract:
    - modify, republish, disable or switch traffic to any production Dify object
    - modify any non-task Dify App, credential, knowledge base or run record
    - merge or direct-push main, create or merge a PR, force, amend, reset, squash or rewrite history
    - publish to a real social platform, buy traffic, transact, contact leads, run store activity or perform other real business action
    - redesign or migrate M2, change its data/feedback/version/permission ownership, or build a second truth store
    - implement M1, M2, M4 or M5, or rewrite the six existing professional Skills
    - reopen external multi-model research or re-fuse the frozen unique professional semantics
    - claim production readiness, M5 gain or real business lift from simulation or M3 module evidence
  protected_assets:
    - Matrix long-term positioning authority and accepted/provisional account-anchor identity
    - Campaign goals, valid interval, constraints and overlay authority
    - M2 raw observation, feedback, provenance, persistence, version, permission and recovery authority
    - Content Brief, Creative Tournament, Creative Script, Production Director and Publishing and Packaging responsibilities
    - all production systems, user assets, credentials, other tasks and pre-existing unknown files

acceptance:
  product_semantics:
    - M3 remains one continuous operating capability, not four physical Workflows or a universal brain
    - current effective or explicit provisional positioning/persona/minimum recoverable anchor can be consumed without a hidden Matrix gate
    - long-term value, launch, follower growth, traffic, GMV, leads, store visits and mixed goals remain non-interchangeable
    - each content task has one primary job and limited secondary contributions
    - three capacity values, stable delivery, controlled exploration, finite experiments and justified non-change are operational
    - quality floor, lawful dramatization/derivative creation, market evidence, CTA permissions and cycle-strategy candidates follow the unified baseline
    - M2 saves raw observations/feedback; M3 outputs only diagnosis, plan, content-task and review-update candidates
    - Campaign expiry restores the still-valid cycle baseline unless a new accepted judgment replaces it
    - output is directly consumable by Content Brief without taking over hook, narrative, script, filming or packaging
    - NO_CONTENT_TASK is reasoned, scoped, reversible and cannot evade work or professional judgment
  runtime_and_evidence:
    - actual Git, Dify object/version, Workflow graph, provider, exact model, parameters and final candidate are bound and reproducible
    - DeepSeek V4 Flash is the main Runtime and M3 module A/B model
    - Qwen is an independent semantic verifier, not default fallback or substitute for main acceptance
    - formal criteria and hashes precede results; exploration and holdout identities remain separate
    - dynamic evidence has observation time and retest triggers; changes invalidate only the dependency impact set
    - M3-AC-00 through M3-AC-20 all PASS with CURRENT evidence bound to the final candidate
  module_ab:
    baseline_a: competent general account-operations baseline, not intentionally weakened
    candidate_b: frozen M3 candidate and only necessary attachments
    controls: same DeepSeek model/provider, parameters, permissions, budgets, input facts, objective, platform, capacity and candidate opportunity
    hard_gate: B is not materially weaker in objective fidelity, facts, permissions, risk or current-task necessary conditions
    gain_gate: independent blind review identifies overall gain in relevant operating judgment, cycle mix, capacity tradeoff, experiment, feedback or content-task quality
    no_gain: M3_PROFESSIONAL_GAIN_NOT_VERIFIED_AND_MODULE_AB_NOT_PASSED
    hard_gate_regression: FAIL
  evidence_layers:
    - technical candidate completion
    - M3 module professional gain
    - Founder Dify product acceptance
    - M5 finished-content integration gain
    - real business result and causal lift
  founder_gate: Founder explicitly ACCEPTS or RETURNS after the technical candidate and natural-language Dify scenario package are complete

p0_deliverables:
  - one independent M3 Account Content Operator Skill and minimal conditional references
  - stable M2 projection/update and Content Brief content-task interfaces
  - actual candidate Dify Workflow and exact Runtime bindings
  - positive, negative, boundary, counterfactual, ablation, regression, longitudinal and holdout evidence
  - independent review, rollback package, remote task branch and Founder Dify acceptance package

