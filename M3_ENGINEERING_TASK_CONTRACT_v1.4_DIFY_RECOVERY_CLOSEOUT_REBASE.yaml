authorization_gate: >-
  This contract and its paired recovery Execution Prompt become executable only
  when Founder explicitly authorizes their exact filenames and SHA-256 hashes.
  The authorization includes one bounded Docker Desktop restart that will stop
  all current containers, but no volume deletion, pruning, reset, reinstall or
  unrelated Dify recovery.

what: >-
  Recover a current, persistent, task-specific M3 v1.5.2 Dify candidate from the
  host-mount failure; close AC-00 and AC-20 using current runtime, rollback,
  Founder PASS and remote evidence; and finish the existing M3 engineering task
  without any new model call, Founder test run, main merge or M5 work.

why: >-
  Repository artifacts and Founder-accepted outputs are already preserved, but
  the currently mounted Dify database contains zero Apps. M3 cannot be called a
  runnable closed module until a persistent live candidate is restored and bound
  without falsifying historical App identity or test provenance.

