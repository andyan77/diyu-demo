        code: "\nimport hashlib\n\nSLOT_TYPE = {\"matrix\": \"MATRIX\", \"campaign\": \"CAMPAIGN\", \"content_brief\": \"CONTENT_BRIEF\"}\nDOWNSTREAM = {\"matrix\": [\"campaign\", \"content_brief\"],\n              \"campaign\": [\"content_brief\"], \"content_brief\": []}\nUPSTREAM = {\"matrix\": None, \"campaign\": \"matrix\", \"content_brief\": \"campaign\"}\nSLOT_CN = {\"matrix\": \"账号矩阵\", \"campaign\": \"Campaign 决策包\", \"content_brief\": \"Content Brief\"}\n\n\ndef summarize(text, n=280):\n    lines = [l.strip() for l in text.split(chr(10)) if l.strip()]\n    head = []\n    total = 0\n    for l in lines:\n        if total + len(l) > n:\n            break\n        head.append(l)\n        total += len(l)\n    return (\" / \".join(head))[:n]\n\n\ndef main(slot, final_output, final_present, skill_name, skill_sha, model_used,\n         fixture_bundle_sha, snapshot_json, precheck_report, judge, run_id):\n    slot = slot if slot in SLOT_TYPE else \"matrix\"\n    text = final_output if isinstance(final_output, str) else \"\"\n    try:\n        snap = json.loads(snapshot_json) if isinstance(snapshot_json, str) else dict(snapshot_json)\n    except Exception:\n        snap = {}\n    snap.setdefault(\"artifacts\", {\"matrix\": None, \"campaign\": None, \"content_brief\": None})\n    for s in (\"matrix\", \"campaign\", \"content_brief\"):\n        snap[\"artifacts\"].setdefault(s, None)\n\n    try:\n        pre = json.loads(precheck_report) if isinstance(precheck_report, str) else dict(precheck_report or {})\n    except Exception:\n        pre = {}\n    pre_ok = bool(pre.get(\"precheck_ok\"))\n    is_stop = bool(pre.get(\"is_stop_status\"))\n\n    if isinstance(judge, str):\n        try:\n            judge = json.loads(judge) if judge.strip() else {}\n        except Exception:\n            judge = {}\n    if not isinstance(judge, dict):\n        judge = {}\n    # Fail closed: a missing or malformed Judge verdict is NOT a pass.\n    def yes(v):\n        if isinstance(v, bool):\n            return v\n        return isinstance(v, str) and v.strip().lower() in (\"yes\", \"true\", \"y\")\n\n    def no(v):\n        if isinstance(v, bool):\n            return not v\n        return isinstance(v, str) and v.strip().lower() in (\"no\", \"false\", \"n\")\n\n    judge_present = (all(k in judge for k in (\"contract_ok\", \"upstream_drift\", \"fact_overreach\"))\n                     and (yes(judge[\"contract_ok\"]) or no(judge[\"contract_ok\"]))\n                     and (yes(judge[\"upstream_drift\"]) or no(judge[\"upstream_drift\"]))\n                     and (yes(judge[\"fact_overreach\"]) or no(judge[\"fact_overreach\"])))\n    judge_ok = (judge_present and yes(judge.get(\"contract_ok\"))\n                and no(judge.get(\"upstream_drift\"))\n                and no(judge.get(\"fact_overreach\")))\n\n    # The Judge is only consulted when the deterministic contract already passed\n    # and the output is a real artifact (section 18: no ceremonial Judge calls on\n    # states the deterministic contract has already decided).\n    judge_required = pre_ok and not is_stop\n    reasons = []\n    if not pre_ok:\n        reasons.extend(pre.get(\"failures\") or [\"PRECHECK_FAILED\"])\n    if is_stop:\n        reasons.append(\"SKILL_STOP_STATUS:\" + str(pre.get(\"status_token\") or \"\"))\n    if judge_required and not judge_present:\n        reasons.append(\"JUDGE_VERDICT_MISSING\")\n    elif judge_required and not judge_ok:\n        # Use the same yes()/no() readers as the verdict itself. Comparing a\n        # string enum against `is True` mislabels every failure as a contract\n        # miss, which tells the founder the wrong reason.\n        if not yes(judge.get(\"contract_ok\")):\n            reasons.append(\"JUDGE_CONTRACT_NOT_MET\")\n        if yes(judge.get(\"upstream_drift\")):\n            reasons.append(\"JUDGE_UPSTREAM_DRIFT\")\n        if yes(judge.get(\"fact_overreach\")):\n            reasons.append(\"JUDGE_FACT_OVERREACH\")\n\n    digest = \"sha256:\" + hashlib.sha256(text.encode(\"utf-8\")).hexdigest()\n    prev = snap[\"artifacts\"].get(slot) or {}\n    revision = int(prev.get(\"revision\") or 0) + 1\n    up_slot = UPSTREAM[slot]\n    up_art = snap[\"artifacts\"].get(up_slot) if up_slot else None\n\n    status = \"VALIDATED\" if (pre_ok and not is_stop and judge_ok) else \"FAILED\"\n    artifact = {\n        \"artifact_id\": \"art_%s_%03d\" % (slot, revision),\n        \"artifact_type\": SLOT_TYPE[slot],\n        \"revision\": revision,\n        \"status\": status,\n        \"content_hash\": digest,\n        \"parent_artifact_id\": (up_art or {}).get(\"artifact_id\"),\n        \"parent_hash\": (up_art or {}).get(\"content_hash\"),\n        \"skill_name\": skill_name,\n        \"skill_sha\": skill_sha,\n        \"run_id\": run_id,\n        \"accepted_turn_id\": None,\n        \"summary\": summarize(text),\n        \"ref\": \"conversation.%s_artifact\" % slot,\n        \"status_token\": pre.get(\"status_token\") or \"\",\n        \"model_used\": model_used,\n        \"fixture_bundle_sha\": fixture_bundle_sha,\n    }\n    snap[\"artifacts\"][slot] = artifact\n    snap[\"last_result_ref\"] = slot\n    snap[\"candidate_skill\"] = \"NONE\"\n\n    if status == \"VALIDATED\":\n        # Section 15: a fresh upstream artifact invalidates every downstream one.\n        staled = []\n        for d in DOWNSTREAM[slot]:\n            art = snap[\"artifacts\"].get(d)\n            if isinstance(art, dict) and art.get(\"status\") in (\"VALIDATED\", \"USER_ACCEPTED\"):\n                art[\"status\"] = \"STALE\"\n                staled.append(d)\n        snap[\"phase\"] = \"COMPLETED\"\n        snap[\"last_error\"] = None\n        completed = True\n        msg = (\"已完成一次 \" + SLOT_CN[slot] + \" 生成，结果已保存，状态为 VALIDATED（已通过确定性合同检查与轻量 Judge），\"\n               \"但还没有被你接受。你可以说「接受」把它定为已接受产物，也可以直接说「接受并继续」进入下一步。\")\n        if staled:\n            msg += (\" 因为上游产物已更新，下列已有产物被标记为 STALE，不能继续作为下游依据：\"\n                    + \"、\".join(SLOT_CN[d] for d in staled) + \"。\")\n    else:\n        snap[\"phase\"] = \"FAILED\"\n        snap[\"last_error\"] = \"ARTIFACT_REJECTED:\" + \",\".join(reasons[:6])\n        completed = False\n        msg = (\"本次 \" + SLOT_CN[slot] + \" 运行没有通过输出校验，结果没有被保存为可用产物，本轮任务未完成。\"\n               \"未通过原因：\" + \"、\".join(reasons[:6]) + \"。\")\n        if is_stop:\n            msg = (\"本次 \" + SLOT_CN[slot] + \" 运行按 Skill 合同停机，输出的是停机状态（\"\n                   + str(pre.get(\"status_token\")) + \"），不是可用产物，因此没有保存为产物，本轮任务未完成。\")\n\n    return {\n        \"snapshot_json\": json.dumps(snap, ensure_ascii=False),\n        \"artifact_value\": text,\n        \"artifact_status\": status,\n        \"completed\": \"true\" if completed else \"false\",\n        \"user_message\": msg,\n        \"finalize_report\": json.dumps({\n            \"slot\": slot, \"status\": status, \"reasons\": reasons,\n            \"precheck_ok\": pre_ok, \"judge_present\": judge_present, \"judge_ok\": judge_ok,\n            \"judge\": judge, \"content_hash\": digest, \"chars\": len(text),\n            \"run_id\": run_id, \"revision\": revision,\n            \"artifact_status_after\": {s: (snap[\"artifacts\"].get(s) or {}).get(\"status\")\n                                      for s in (\"matrix\", \"campaign\", \"content_brief\")},\n        }, ensure_ascii=False),\n    }\n"
        code_language: python3
        desc: Judge 未运行时 judge 为 None，按 Fail Closed 处理
        outputs:
