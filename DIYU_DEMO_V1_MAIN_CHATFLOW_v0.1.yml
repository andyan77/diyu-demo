    - data:
        code: "\nMAX_SAVE_BYTES = 200 * 1024      # dify_config.MAX_VARIABLE_SIZE\n\nSPEC = {\n    \"matrix\": {\n        \"ok_statuses\": [],\n        \"stop_statuses\": [\"INPUT_INSUFFICIENT\"],\n        \"required_sections\": [\"第一部分\", \"第二部分\", \"账号责任\", \"唯一使命\"],\n        \"cn\": \"账号矩阵\",\n    },\n    \"campaign\": {\n        \"ok_statuses\": [\"READY_WITH_CONDITIONS\", \"READY\"],\n        \"stop_statuses\": [\"INPUT_INSUFFICIENT\", \"INPUT_CONFLICT_REQUIRES_FOUNDER\"],\n        \"required_sections\": [\"运行结论\", \"内容目标\", \"参战账号\", \"内容排序\", \"用户行动\"],\n        \"cn\": \"Campaign 决策包\",\n    },\n    \"content_brief\": {\n        \"ok_statuses\": [\"READY_WITH_CONDITIONS\", \"READY\"],\n        \"stop_statuses\": [\"INPUT_INSUFFICIENT\", \"INPUT_CONFLICT_REQUIRES_FOUNDER\"],\n        \"required_sections\": [\"Content Brief Pack\", \"运行结论\", \"内容单元索引\", \"brief_id\"],\n        \"cn\": \"Content Brief\",\n    },\n}\n\nEXPECTED = {\"matrix\": {\"skill_sha\": \"7a6afa3cf1a7b2e4793bd2b3dde6edddf20f75a5b8ed9f7aeb6a456d06acd838\", \"fixture_bundle_sha\": \"7f9f0730f02149133178b14917b9e7a197ba7947539a230dc75bc66a8e289c91\", \"skill_name\": \"Matrix Architect v0.1.2\"}, \"campaign\": {\"skill_sha\": \"c7ef284e40e7c4cd0d4081632fca7df17bd1a80fbd3f3b5267be4aea1040a0fb\", \"fixture_bundle_sha\": \"8b4dbab71e4ee19f912c4eb48c57f149b139ffb051cf9ecc5f3c80ce1fd5b3da\", \"skill_name\": \"Campaign Orchestrator v0.1\"}, \"content_brief\": {\"skill_sha\": \"a0268a211a235b5b4df5e517f085db1f3b4948ae5add3346f2c15a426b63395f\", \"fixture_bundle_sha\": \"8ad330625089bd04fce7186c7d497bf656f29ad5dcecb88269c7ad68aa6f6277\", \"skill_name\": \"Content Brief Architect v0.1\"}}\n\n\ndef norm_lines(text, n=40):\n    out = []\n    for raw in text.split(chr(10))[:n]:\n        l = raw.strip().strip(\"`\").strip(\"#\").strip(\"*\").strip(\"-\").strip()\n        if l:\n            out.append(l)\n    return out\n\n\ndef top_status(text, spec):\n    \"\"\"Read the DECLARED top-level status, not a mention of one.\n\n    Every Skill declares a stop status as a standalone line (Matrix section 0,\n    Campaign section 2, Content Brief section 3). A substring scan misreads prose\n    such as \"因此不进入 INPUT_INSUFFICIENT\" — a statement that the Skill did NOT\n    stop — as a stop declaration, which would discard a perfectly good artifact.\n    \"\"\"\n    lines = norm_lines(text, 40)\n    for l in lines[:6]:\n        for st in spec[\"stop_statuses\"]:\n            if l in (st, st + \"：\", st + \":\"):\n                return st, True\n    for l in lines[:25]:\n        if \"状态\" in l:\n            # a declared status line, e.g. \"顶层状态：READY_WITH_CONDITIONS\"\n            for st in spec[\"stop_statuses\"]:\n                if st in l:\n                    return st, True\n            for st in spec[\"ok_statuses\"]:\n                if st in l:\n                    return st, False\n    for l in lines[:25]:\n        for st in spec[\"ok_statuses\"]:\n            if l == st:\n                return st, False\n    return \"\", False\n\n\ndef salient_cjk(text, min_count):\n    \"\"\"2—3 char CJK tokens occurring at least min_count times.\n\n    Used ASYMMETRICALLY: salient tokens are mined from the UPSTREAM (recurrence\n    is what makes a name a locked decision), and the downstream is only tested\n    for PRESENCE. A legitimate downstream may name a locked account once, so\n    requiring recurrence on both sides would flag correct inheritance as drift.\n    \"\"\"\n    out = {}\n    buf = \"\"\n    for ch in text:\n        if \"一\" <= ch <= \"鿿\":\n            buf += ch\n        else:\n            buf = \"\"\n            continue\n        for n in (2, 3):\n            if len(buf) >= n:\n                tok = buf[-n:]\n                out[tok] = out.get(tok, 0) + 1\n    return set(t for t, c in out.items() if c >= min_count)\n\n\ndef main(slot, final_output, final_present, skill_name, skill_sha, model_used,\n         fixture_bundle_sha, upstream_text):\n    slot = slot if slot in SPEC else \"matrix\"\n    spec = SPEC[slot]\n    exp = EXPECTED.get(slot, {})\n    text = final_output if isinstance(final_output, str) else \"\"\n    up = upstream_text if isinstance(upstream_text, str) else \"\"\n    fails = []\n\n    # 1 Final present\n    if str(final_present).lower() != \"true\" or not text.strip():\n        fails.append(\"NO_FINAL\")\n    if text.strip() == \"MODEL_OUTPUT_NO_FINAL\":\n        fails.append(\"NO_FINAL\")\n\n    # 2 no reasoning leakage on a user-visible artifact\n    think = text.count(\"<think>\") + text.count(\"</think>\")\n    if think:\n        fails.append(\"THINK_LEAK:%d\" % think)\n\n    # 3 identity: the Skill and the frozen fixture bundle actually used\n    if exp.get(\"skill_sha\") and skill_sha != exp[\"skill_sha\"]:\n        fails.append(\"SKILL_SHA_MISMATCH\")\n    if exp.get(\"fixture_bundle_sha\") and fixture_bundle_sha != exp[\"fixture_bundle_sha\"]:\n        fails.append(\"FIXTURE_BUNDLE_SHA_MISMATCH\")\n    if exp.get(\"skill_name\") and skill_name != exp[\"skill_name\"]:\n        fails.append(\"SKILL_NAME_MISMATCH\")\n\n    # 4 top-level status legality + required sections\n    status, is_stop = top_status(text, spec)\n    missing = []\n    if not fails:\n        if is_stop:\n            status_ok = True\n        elif spec[\"ok_statuses\"]:\n            status_ok = bool(status)\n            if not status_ok:\n                fails.append(\"ILLEGAL_TOP_STATUS\")\n        else:\n            status_ok = True\n            status = \"MATRIX_OUTPUT\"\n        if not is_stop:\n            missing = [s for s in spec[\"required_sections\"] if s not in text]\n            if missing:\n                fails.append(\"MISSING_SECTIONS:\" + \",\".join(missing))\n\n    # 5 saveable into a conversation variable\n    size = len(text.encode(\"utf-8\"))\n    if size > MAX_SAVE_BYTES:\n        fails.append(\"TOO_LARGE:%d>%d\" % (size, MAX_SAVE_BYTES))\n\n    # 6 upstream inheritance. Zero overlap with a non-empty upstream is\n    #    unambiguous drift; partial overlap is reported, not judged here.\n    overlap = 1.0\n    up_tokens = 0\n    if up.strip() and not is_stop and not fails:\n        ut = salient_cjk(up, 3)\n        up_tokens = len(ut)\n        # Below 5 recurring upstream tokens there is not enough signal to call\n        # drift at all, so no verdict is issued — only the measured overlap.\n        if ut:\n            carried = len([t for t in ut if t in text])\n            overlap = carried * 1.0 / len(ut)\n            # Below 5 salient upstream tokens there is not enough signal to\n            # call drift at all, so only the measured overlap is reported.\n            if len(ut) >= 5 and carried == 0:\n                fails.append(\"UPSTREAM_DRIFT:ZERO_OVERLAP\")\n\n    report = {\n        \"slot\": slot, \"precheck_ok\": not fails, \"failures\": fails,\n        \"status_token\": status, \"is_stop_status\": is_stop,\n        \"missing_sections\": missing, \"chars\": len(text), \"bytes\": size,\n        \"think_markers\": think, \"skill_name\": skill_name, \"skill_sha\": skill_sha,\n        \"fixture_bundle_sha\": fixture_bundle_sha, \"model_used\": model_used,\n        \"upstream_overlap\": round(overlap, 3), \"upstream_tokens\": up_tokens,\n    }\n    return {\n        \"precheck_ok\": \"true\" if not fails else \"false\",\n        \"is_stop_status\": \"true\" if is_stop else \"false\",\n        \"status_token\": status,\n        \"precheck_report\": json.dumps(report, ensure_ascii=False),\n    }\n"
        code_language: python3
