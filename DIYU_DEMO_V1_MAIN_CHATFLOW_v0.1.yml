            - **替补：** 第二门店当班负责人。


            第二门店当班负责人：


            - 只作为本次 Demo 的后台运营角色；

            - 不新增姓名；

            - 不建立 IP 账号；

            - 不进入 Matrix；

            - 不因承担替补或门店容量确认而获得内容发布身份。


