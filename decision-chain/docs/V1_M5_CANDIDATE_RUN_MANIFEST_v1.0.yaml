# 冻结的含义：以下每一项在正式运行期间不可变。任一项发生变化 ⇒ 依赖它的验收项
# 一并置 STALE，定向复验后才能恢复；不在下游打补丁（宪法 A3）。
freeze_semantics:
  changing_any_binding_after_freeze: "本次正式运行降级为探索，受影响验收项置 STALE"
