# ---------------------------------------------------------------- 7. 运行序列
# 序列在冻结时固定。每个用例的期望判据必须早于结果（宪法 A2 判据先于结果）。
run_sequence:
  - phase: "P1 完整主故事"
    cases: ["FULL-01", "FULL-02"]
    covers: ["M5-AC-02"]
  - phase: "P2 合法短入口"
    cases: ["DE-01", "DE-02", "DE-03", "DE-04", "DE-05",
            "DE-06", "DE-07", "DE-08", "DE-09", "DE-10"]
    catalog_id: "M5-DIRECT-ENTRY-CATALOG-v1.0"
    catalog_semantics: "本次正式验收的有限库存，不把数量冻结为永久产品语义"
    covers: ["M5-AC-03"]
  - phase: "P3 十九维覆盖回填"
    note: "案例可一对多；N/A 必须在运行前冻结，失败后不得追溯填写"
    covers: ["M5-AC-04"]
  - phase: "P4 两级 A/B"
    cases: ["AB-M3-01", "AB-FINAL-01"]
    covers: ["M5-AC-05", "M5-AC-06"]
    blocking_note: "模型自评无效；实现者知道映射的评分无效。执行侧只产出盲评包，不产出分数。"
  - phase: "P5 留出与高风险探针"
    cases: ["HOLDOUT-01..06", "RISK-FACT-01", "RISK-PERM-CTA-01", "RISK-F10-01",
            "RISK-PUBLISH-ID-01", "RISK-RECOVERY-01",
            "RISK-M4-027", "RISK-M4-030", "RISK-M4-031", "RISK-M4-032", "RISK-M4-033"]
    covers: ["M5-AC-07"]
  - phase: "P6 不退化与受影响回归"
    cases: ["REG-M1", "REG-M2", "REG-M3", "REG-M4", "REG-SKILLS"]
    covers: ["M5-AC-08"]
  - phase: "P7 一次上下文隔离的只读开放审查"
    covers: ["M5-AC-08"]
    constraint: "候选冻结之后进行，只读"

