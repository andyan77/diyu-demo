# 东西」钉死成可复算的绑定。冻结之后再改任何一项绑定，本次运行只能记探索，
# 不产生正式 PASS（Task Contract two_gate_rule.gate_2_candidate）。
#
# 冻结前的全部运行一律是**诊断**，见 decision-chain/evidence/m5/M5_NODE3_DIAGNOSTIC_FINDINGS_v1.0.md。

