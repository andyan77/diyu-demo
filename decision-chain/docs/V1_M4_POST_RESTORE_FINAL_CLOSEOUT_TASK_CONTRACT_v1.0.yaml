authority_change:
  summary: >
    Founder has accepted the M4 product delivery, accepted the disclosed historical
    technical residuals as a one-time delivery risk, required the empty user-delivery
    defect to be fixed, and then narrowed the remaining objective to restoring and
    verifying the final Dify applications so M4 can hand off to M5. Historical technical
    FAIL and NOT_VERIFIED results remain unchanged and are not converted into PASS.
  scope: THIS_M4_DELIVERY_ONLY
  does_not_generalize: true

WHAT:
  primary_observable_change: >
    Bind the restored live Dify applications and existing real Runtime evidence to a
    successor formal M4 closeout receipt; preserve historical technical results;
    close the M4 task as DONE under this Founder-authorized final-delivery contract;
    and open only the M5 integration handoff.
  supporting:
    - verify that the eight restored M4 applications are the frozen M4 candidate identities and remain runnable
    - verify that empty user delivery and think leakage are absent in the bound restore evidence
    - verify six-Skill source, professional prompt, and Runtime parameter fidelity
    - verify that evaluation-only fault-injection objects are not routable from the official chain
    - verify the M4-to-M5 handoff map is complete and bound to current application identities
    - append an authoritative successor receipt and task-ledger state without rewriting history

WHY: >
  The final M4 applications and professional chain have already been restored and accepted
  by Founder, but the last formal M4 receipt still says BLOCKED and next_stage_allowed=false.
  Restore evidence and the handoff map alone cannot upgrade a formal task state. A successor
  closeout must bind the restored target system and Founder disposition to the same task_id.

BOUNDARY:
  authorized_scope:
    read:
      - current M4 task branch, remote task branch, origin/main, task ledger, prior receipts, attempts, and evidence
      - current local Docker Dify development/test environment using read-only queries and application/runtime inspection
      - restored application graphs, published bindings, model parameters, Runtime run records, and container/mount health
      - Founder-authorized planning Prompt and canonical Task Contract
    write:
      - a new versioned post-restore M4 Task Contract in decision-chain/docs
      - a new versioned successor M4 final closeout receipt in decision-chain/docs
      - append-only updates to the existing M4 task ledger and required canonical project ledgers
      - a minimal post-restore evidence index only if needed to bind already-existing raw evidence
      - Git commit and push to codex/v1-m4-capability-seams-runtime-integration-001
    execute:
      - deterministic hash, graph, binding, Git, mount, database-count, and evidence-integrity checks
      - read-only Dify API/database inspection
      - at most one targeted real Runtime replay for an affected capability only if exact binding reuse cannot establish current evidence
    network:
      - fetch and push the existing M4 task branch
      - read-only Dify service calls needed for verification
      - a targeted Dify Runtime call only under the execute condition above
  allowed_delta:
    - formalize the Founder-authorized acceptance change as a versioned successor contract
    - bind commit c77a7e5d424f8b2db6ff436a662d12699596b0cc and its restore evidence to the live target system
    - append the new task disposition and M5 handoff permission
    - correct the old environment-incident description without deleting the historical record
  protected_assets:
    - six source Skills and all professional methods, judgments, responsibility boundaries, and differences
    - six injected professional Workflow prompts
    - skill_llm model, provider, thinking, reasoning, top_p, temperature, and max_tokens parameters
    - all official M4 application graphs and IDs except no application mutation is authorized by this contract
    - the nine pre-existing protected Dify applications and their recorded identities and graphs
    - M1, M2, M3, M5 assets and responsibilities
    - PRE, MIXED, FINAL semantics
    - legal equivalent inputs, direct entries, conditional invocation, Return, and local fallback semantics
    - all previous contracts, receipts, attempts, Reviewer results, failures, and raw evidence
    - origin/main, production Dify, real publishing platforms, databases, and user data
  non_goals:
    - change code, DSL, Skill, Workflow, prompt, model, model parameter, provider, database schema, or application graph
    - rebuild M4 or recreate any of the eight final applications
    - rerun all historical acceptance criteria or all 31 tests
    - reopen blind evaluation, Founder product review, or professional-content adjudication
    - rewrite historical FAIL or NOT_VERIFIED as technical PASS
    - delete or overwrite historical BLOCKED receipts
    - merge origin/main, create a PR, force-push, amend, squash, or rewrite Git history
    - start M5 engineering execution
    - claim production readiness, a real operating loop, business uplift, or causal improvement
  non_promises:
    - DONE under this contract does not mean every historical technical criterion passed
    - M5 handoff readiness does not mean M5 engineering has started or passed
    - restored development/test applications do not establish production readiness
    - engineering closure does not establish real-operation or business-uplift evidence

P0:
  deliverables:
    - canonical successor Task Contract with a new hash and explicit authority change
    - current baseline and binding verification record
    - successor formal M4 final closeout receipt
    - append-only M4 task-ledger terminal-state update
    - remote task-branch commit with local and remote hashes equal
  acceptance_criteria:
    M4-PCR-01: same task_id is preserved and REBASE_TASK is used with the previous BLOCKED state retained as history
    M4-PCR-02: local and remote M4 task branch are bound to the final closeout commit and the worktree is clean
    M4-PCR-03: the live Dify bind mount points to the preserved host database and target-system identities are current
    M4-PCR-04: all eight official M4 applications retain the recorded IDs, are published/runnable, and their current graphs match the restored frozen candidate evidence
    M4-PCR-05: existing restore evidence binds six real capability runs, Capability Seam routing, and Founder Canvas end-to-end behavior to the current application graphs
    M4-PCR-06: bound restore evidence has empty_user_delivery_count=0 and think_leak_count=0
    M4-PCR-07: six source Skills, six injected professional prompts, and six skill_llm model/parameter bindings have zero unauthorized change
    M4-PCR-08: evaluation-only fault-injection objects are not routable from Founder Canvas, Capability Seam, or the six official capability applications
    M4-PCR-09: V1_M4_M5_HANDOFF_MAP_v0.1.yaml matches current application and workflow identities and contains the required upstream/downstream and input/output contracts
    M4-PCR-10: historical technical results and old BLOCKED receipts remain byte-preserved; Founder one-time risk acceptance is recorded separately from technical results
    M4-PCR-11: the successor receipt and ledger derive the terminal state consistently; when M4-PCR-01..10 and M4-PCR-12 pass, they record task_final_status=DONE, next_stage_allowed=true:M5_INTEGRATION_HANDOFF, and m5_engineering_execution_started=false
    M4-PCR-12: no code, DSL, Skill, professional prompt, model parameter, official M4 graph, nine protected-application graph, database schema, main branch, PR, production, or real publishing side effect occurs

P1:
  enabled: false
  deliverables: []
  acceptance_criteria: []
  permitted_next_stage: NONE

allowed_final_states:
  - DONE
  - BLOCKED
  - FAILED
  - INVALID

acceptance_oracles:
  - this canonical Task Contract and its SHA-256
  - current Git object identities and remote refs
  - live Dify application, workflow, graph, model, parameter, run, database, mount, and container evidence
  - decision-chain/evidence/m4/restore/M4_RESTORE_SMOKE.json
  - decision-chain/evidence/m4/restore/M4_RESTORE_CANVAS_E2E.json
  - decision-chain/evidence/m4/restore/M4_RESTORE_INJECTION_ISOLATION.json
  - decision-chain/docs/V1_M4_M5_HANDOFF_MAP_v0.1.yaml
  - deterministic comparison with the frozen M4 candidate and protected assets
  - Founder authority change recorded in this contract

evidence_reuse_policy:
  default: EXACT_BINDING_ONLY
  final_full_run_required: false
  dynamic_evidence_requires_refresh: true
  rules:
    - reuse existing real Runtime runs only when current graph, application, workflow, model, parameters, and input bindings match exactly
    - refresh dynamic environment, mount, application, publication, graph, and remote Git identities at closeout time
    - if an exact binding mismatch is found, mark only direct and transitive dependents STALE and run at most one targeted affected replay
    - do not rerun unaffected capabilities or select samples until a desired output appears
    - preserve every new attempt and any worse result

verification_authority:
  executor_self_check:
    - all M4-PCR criteria
  deterministic_checkers:
    - Git and SHA-256 comparison
    - Dify graph, application, workflow, model, parameter, mount, database-count, and routing comparison
    - protected-path and historical-byte-preservation comparison
  independent_reviewer: one context-isolated read-only closing reviewer
  founder_authority_scope:
    - product acceptance
    - one-time risk acceptance for disclosed historical technical residuals
    - final delivery scope and M5 handoff permission

review_contract:
  required: true
  authority: one context-isolated read-only closing reviewer
  scope:
    - verify the successor receipt accurately binds the current restored state
    - verify no historical technical result was rewritten as PASS
    - verify no protected asset or unauthorized system was changed
    - verify DONE and M5 handoff statements do not exceed this contract
  budget: HIGH
  closure_rule: >
    The reviewer may block only with criterion_id plus evidence and affected scope,
    or with a proven security, permission, protected-asset, or data-integrity violation.
    Naming, formatting, preferred HOW, new standards, and requests to rerun unaffected
    historical tests are non-blocking. No second open review is allowed.

completion_checks:
  artifact_persisted: REQUIRED
  target_environment_run: REQUIRED
  fixed_configuration_run: REQUIRED
  positive_tests: REQUIRED
  negative_tests: REQUIRED_FOR_NON_ROUTABILITY_AND_NO_EMPTY_OR_THINK_LEAK_BINDINGS
  regression_tests: REQUIRED_AFFECTED_SCOPE_ONLY
  raw_evidence_preserved: REQUIRED
  git_closure: REQUIRED
  remote_closure: REQUIRED

retry_policy:
  transient_retry_allowed: true
  maximum_authorized_attempts: ONE_TARGETED_REPLAY_PER_AFFECTED_BINDING_MAXIMUM
  blind_resampling_allowed: false
  all_attempts_must_be_preserved: true

remote_target: origin/codex/v1-m4-capability-seams-runtime-integration-001
next_stage_default: false
next_stage_on_done: M5_INTEGRATION_HANDOFF_ONLY
m5_engineering_execution_authorized: false
