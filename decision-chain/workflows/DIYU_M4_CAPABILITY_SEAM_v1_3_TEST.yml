        retry_config:
          max_retries: 1
          retry_enabled: true
          retry_interval: 2000
        selected: false
        title: 调用 DIYU M4 v1.3 TEST · Creative Script (CS-1 + Script)
        tool_configurations: {}
        tool_label: diyu_m4_creative_script
        tool_name: diyu_m4_creative_script
        tool_node_version: '2'
        tool_parameters:
          capability_call:
            type: mixed
            value: '{{#1788000000001.capability_call#}}'
          entry:
            type: mixed
            value: '{{#entry_resolver.entry_resolved#}}'
