        selected: false
        title: 调用 DIYU M4 v1.3 TEST · Matrix Architect
        tool_configurations: {}
        tool_label: diyu_m4_matrix
        tool_name: diyu_m4_matrix
        tool_node_version: '2'
        tool_parameters:
