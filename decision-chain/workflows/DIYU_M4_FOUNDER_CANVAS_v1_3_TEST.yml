          \        \"entry_used\": entry,\n        \"equivalence_basis\": equivalence_basis,\n        \"capabilities_skipped\"\
          : skipped,\n        \"returns_json\": seam_returns_json or \"[]\",\n        \"seam_trace_json\": seam_trace_json\
