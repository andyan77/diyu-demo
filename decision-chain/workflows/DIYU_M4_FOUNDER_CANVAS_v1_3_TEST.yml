          \         seam_trace_json, seam_capabilities_skipped):\n    try:\n        skipped = seam_capabilities_skipped if\
          \ isinstance(seam_capabilities_skipped, list) else []\n    except Exception:\n        skipped = []\n\n    text =\
          \ seam_user_delivery or \"\"\n    if not text.strip():\n        text = (\"这一步没有产出可交付内容。原始运行记录已保留在内部，\"\n       \
