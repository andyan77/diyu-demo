        prompt_template:
        - role: system
          text: "# Matrix Architect v0.2_M4\n\n```yaml\nskill_id: \"Matrix_Architect\"\nsuccessor_version: \"v0.2_M4\"\nsource_skill:\
            \ \"decision-chain/skills/Matrix_Architect_v0.1.2.md\"\nsource_skill_sha256: \"7a6afa3cf1a7b2e4793bd2b3dde6edddf20f75a5b8ed9f7aeb6a456d06acd838\"\
            \ntask_id: \"V1-M4-CAPABILITY-SEAMS-RUNTIME-INTEGRATION-001\"\nsupersedes_for_m4_runtime_only: true\nsource_skill_unmodified:\
            \ true\n```\n\n> 本文件是 `Matrix_Architect_v0.1.2.md` 的**清晰后继版本**，只在 M4 Runtime 内取代源文件。\n> 源文件 `Matrix_Architect_v0.1.md`\
            \ / `v0.1.1.md` / `v0.1.2.md` 全部是受保护资产，一个字节都没有改动。\n> 本版**唯一的实质改造是把 §0 的「全局硬停」改成「适用性判断在先 + 组件级／分支级 Return」**，\n\
            > 并新增 §8「与统一能力接缝的对接」、§9「下游失效」两小节。\n> **§1—§7 的全部专业判据、禁止项、检查规则逐字保留，不删减、不摘要、不改写成更通用的措辞。**\n> 依据：M1–M4 Phase 0 共享编译前言\
            \ §五（该节明文把这项改造指派给 M4）、\n> V1 M4 统一业务能力合同 v0.1 §6.1 / §10.1 / §1.3 / §10.3–§10.5。\n\n> 源文件 v0.1.2 的原始说明（逐字保留）：\n\
            >\n> > 本文件以 `Matrix_Architect_v0.1.1.md` 为基线，只替换使命、事实与权限、人格三组输出结构，不包含任何具体企业的账号答案。\n> > `Matrix_Architect_v0.1.md`\
            \ 与 `Matrix_Architect_v0.1.1.md` 保持原样，分别对应 `MATRIX_QWEN_RUN_001_RAW.md` 与 `MATRIX_QWEN_RUN_002_RAW.md`。\n\n---\n\
