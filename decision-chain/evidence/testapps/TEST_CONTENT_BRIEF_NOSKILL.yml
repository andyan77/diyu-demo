            - 不得输出任何推理过程标记。


            【输出合同】

            必须包含以下章节，缺一不可：

            - Content Brief Pack

            - 运行结论

            - 内容单元索引

            - brief_id


            【顶层状态】

            正文首行按整行声明本次输出状态，取值只能是：`READY` / `READY_WITH_CONDITIONS` / `INPUT_INSUFFICIENT`
            / `INPUT_CONFLICT_REQUIRES_FOUNDER`

            '
        - id: cb-usr
          role: user
          text: '请执行一次 Content Brief Architect 运行。


            RUN_MODE：BUILD_CONTENT_BRIEFS_FROM_ACCEPTED_CAMPAIGN


            TARGET_PLATFORM：PLATFORM_UNCONFIRMED


            已被接受的 Campaign 决策包是本轮实例的最高真源。

            只允许在上游已确认的决策范围内做制作层判断，生成可以交给内容制作人员继续执行的 Content Brief。

            不得重新选择经营任务、目标顾客、唯一主要顾客变化、主讲账号、参战账号组合、哪个账号不发布、内容数量、已确认的核心内容顺序、接力关系、统一行动入口、主承接人、替补或申请与确认边界。

            如输入中的正式结论之间存在无法解决的冲突，停止并输出冲突，不自行覆盖或择一。


            只能依据 System 指令和下方 content_brief_input 原文判断，不得使用外部案例、行业惯例、专家答案、隐藏答案或输入中没有明确提供的企业事实。


            请一次性输出一个完整的 Content Brief Pack，不要复述方法，不要输出思考过程、自检过程、完整脚本、逐句口播、逐镜头清单、机位秒数、最终标题、最终封面文案或成片文案。


            如果输入存在相互冲突的正式确认结论，严格按照 System 中的 INPUT_CONFLICT_REQUIRES_FOUNDER 格式停止。


            如果缺少已被接受的上游 Campaign 决策、账号发布身份与责任边界、内容数量与顺序结论，或至少一条可确认且具备最低制作条件的事实链，严格按照
            System 中的 INPUT_INSUFFICIENT 格式停止。


            发布平台、承接条件或产能局部不足时，不得补写；应输出 READY_WITH_CONDITIONS，保持平台中立，给出最低运行版本，并暂停相应行动号召。


            ## 版本优先级


            本轮实例真源按以下优先级采信，高优先级覆盖低优先级：


            1. 已被接受的 Campaign 决策包（最高，本轮实例最高真源）

            2. 本轮会话中已被用户接受的 Matrix 账号责任产物（对应原“已确认的四张账号责任卡”位置）

            3. 品牌事实、素材与资源夹具、最小承接条件夹具（事实底座）


            事实底座中若存在已被 Campaign 决策包明确取代的旧状态，一律以 Campaign 决策包为准。不要在输出中重新讨论这些历史差异，也不要把被取代的旧状态当作待裁决冲突提出。


            以下各段之间的分隔标记只是机械拼接标记，不是内容。


