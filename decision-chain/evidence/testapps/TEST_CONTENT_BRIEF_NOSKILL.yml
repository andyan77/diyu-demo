            【任务】

            基于已被用户接受的 Campaign 决策包，产出一份 Content Brief Pack。


            【硬性边界】

            - 只能使用下方冻结夹具中逐字给出的事实；夹具没有的商品、库存、价格、面料、顾客或经营事实一律不得补写。

