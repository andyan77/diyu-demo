            \ 完全相同，七项一项不少\nfact_check_status         **M4 新增** —— PASS | FAIL | NOT_VERIFIED。FAIL 时**阻止交付**，\n           \
            \               保留原 Artifact 与失败输出，**不得删句翻绿**；\n                          只阻断依赖该事实的那一支，其余部分照常产出\nstale_set[] \
            \              **M4 新增** —— 本次变化使哪些下游判断失效。只列真实依赖项；\n                          影响关系判断不了的标 STALE 待定向复验。**不反向传播**\n\
            failure_case              会没人点或点了就走的包装 + 为什么\n                          **包装超额承诺的不只是信息量，也可以是情绪**——给一条不给安慰的内容\n\
            \                          做治愈系包装，同样是 PP-3 意义上的超额\nassumptions[]             用了哪些默认值、作废了哪些不适用的上游输入\nmissing[]\
            \                 还缺什么才能继续\n```\n\n---\n\n## Return 是闭环，不是一句建议\n\n> 本节是 M4 新增。源 Skill 的 `return_to_script[]` /\
            \ `return_to_production[]` 只写「回改建议」——一句建议没有处置、没有失效集，发出去就沉默丢失了。\n\n### 每条 Return 七项，一项不少\n\n| 项 | 写什么 | 写不好会怎样\
            \ |\n|---|---|---|\n| `source` | 哪个能力／哪个环节发出 | 上游不知道该谁看 |\n| `highest_damaged_layer` | 被新事实实际破坏的**最上游**判断层 | 在下游打补丁，上游那个错还在\
            \ |\n| `precise_gap` | 具体缺什么。**不写\"信息不足\"** | 收到的人不知道要补什么 |\n| `affected_objects[]` | 受影响的对象逐个列出 | 影响面靠猜，要么多算要么少算\
            \ |\n| `proposed_disposition` | 接受并局部修改 ｜ 依据权威/事实/边界拒绝 ｜ 精确升级 | 没有处置＝没有闭环 |\n| `needs_user_decision` | true /\
            \ false | 该交人的没交人，或不该交人的去打扰人 |\n| `downstream_stale[]` | 哪些下游变 STALE，**只列真实依赖** | 全链失效（多算）或漏项（少算） |\n\n**处置三选一，且只选一。**\
            \ 拒绝也是合法处置，但**必须给出理由**——**不得沉默丢失**：一条 Return 既不接受也不拒绝地悬着，是最坏的一种。\n\n**修复指向最高失效层。** 破的是正文语义就回 Creative Script，破的是覆盖就回\
            \ Production Director，**不在包装层打补丁**假装解决。\n\n### Return 不自动回环\n\n**收到 Return 不等于自动重跑上游。** 本 Skill 发出 Return 之后：\n\
            \n- 不假设上游会跑、不等待上游跑完、不代替上游跑；\n- 已经能定稿的部分照常定稿，**只把依赖该 Return 的那一支挂起**；\n- 恢复时**先查目标系统**，防止重复副作用（同一条内容不要被包装两遍、发布两遍）。\n\
            \n### 解析失败 ≠ NONE\n\n上游给来的 Return 或兑现证据解析不了时，**置 `parse_status = PARSE_FAILED`，保留失败原文，局部阻断那一支**。\n\n**不得**把解析失败伪装成空数组、`NONE`\
            \ 或「无回改建议」——那会让下游读成\"检查过了，没问题\"，而实际是\"根本没读懂\"。这两件事的差别是本 Skill 里最贵的一个差别。\n\n---\n\n## 语义事实核验失败时怎么办\n\n> 本节是 M4\
            \ 新增。\n\n**核验失败阻止交付。** `fact_check_status = FAIL` 时不出可发布的最终包，`mode` 不得因此被改写。\n\n**保留原 Artifact 与失败输出。** 原来的完整产出留着，核验失败的那一条以及失败原文一起留着。\n\
            \n**不得删句翻绿。** —— **不得靠删掉被质疑的那句话，把结论从失败改成通过。** 那不是通过，那是把证据处理掉了。要通过只有两条路：补上真实的 `fact_id` 回指，或者由有权者依据权威/事实/边界作出裁决；**自己删一句让检查器不再报错，两条都不是。**\n\
            \n**只阻断依赖该事实的那一支。** 一条事实核验不过，不使整份包装作废：\n\n- 不依赖它的标题、封面、文案、评论区设计 **照常完成**；\n- 依赖但可以条件化的 → 条件化产出，写明成立条件；\n- 依赖且产出即编造的那一支\
            \ → **暂停该支**。\n\n**不降低其余部分的创意深度与成品质量。** 一处事实缺口不是把整条内容做浅的理由——阻止的是**无依据的具体主张**，不是这项任务本身。\n\n**核验不重写创意。** 核验只回答\"\
            这句话有没有依据\"，它**不负责**换一个标题、改一个钩子、调一次语气。核验失败之后的重写是包装判断，仍按 PP-1 至 PP-5 做，**不是由核验结论代做**。\n\n---\n\n## 局部失效与不反向传播\n\n\
            > 本节是 M4 新增。\n\n**包装自身的变化不反向使 Script、Brief 或 PD 失效。** 换了标题、调了封面文字层级、多出一个平台变体——上游一个字都不用改，**不得**因此让上游产物变 STALE。\n\
            \n**上游变化只使依赖部分失效**：\n\n| 上游变了什么 | 失效的是 | 不失效的是 |\n|---|---|---|\n| 正文、内容承诺、`plan` 或 `manifest` 实质变化 | 依赖那部分的包装与可发布判断\
            \ | 不依赖它的路线、平台变体与评论区设计 |\n| 平台变化 | 相关平台变体与发布条件 | 母版包 |\n| CTA 权限变化 | `cta_surface`、相关平台变体与发布条件 | 标题、封面、正文文案（除非它们本身带\
            \ CTA） |\n\n**「实质变化」指被下游实际消费的业务含义变了。** 排版、措辞、说明文字、重跑但结果未变、用户提过建议但最终没采纳——**都不触发失效**。\n\n**判断不了影响关系的标 `STALE` 待定向复验。**\
            \ 标 STALE 不算漏项；为了显得精确而假装知道依赖图才是错的。**多算**（让有证据、不受影响的项作废）和**少算**（漏掉已知依赖）**都是错**。\n\n### 发布实例纪律\n\n- 发布后再改，**必须形成新的内容版本**；\n\
            - **只有该新版本实际对外发布了，才形成新的发布实例**；\n- **未再次发布的修订不得产生或冒充发布实例**；\n- **不得改写旧的发布历史**——已发布内容及其发布实例保留为历史，不因上游后来变化而失效或被改写；\n\
            - 只有**实际发布过的那个准确版本**才能绑定真实效果数据。\n\n---\n\n## 用户交付块的事实纪律\n\n用户交付块是**直接交到执行人手上**的那一页。它和完整 Artifact 的定位不一样：\n\n|\
            \ | 完整 Artifact | 用户交付块 |\n|---|---|---|\n| 给谁看 | 给核账的人 | 给拿着它去干活的人 |\n| 能不能记问题 | **能** —— 淘汰了什么、为什么淘汰、哪条没依据，都该写清楚\
            \ | **不能** |\n\n### 不可用的内容，必须真的拿掉\n\n判断某句话不能用之后，**从用户交付块里删干净**，而不是留在那儿加一句说明。\n\n用户交付块里**不得出现**下列任何一种写法：\n\n- 「已删除」「已剔除」「已移除」\n\
            - 「审查发现」「审查时发现」「修正后」「修正为」\n- 「原方案」「上一版」「之前的版本」\n- 「未核实，不得使用」「这句话不能使用」\n- 以及**任何被淘汰内容的全文**\n\n**尤其不得把「错误内容」和「已删除说明」写在同一句话、同一个字段里。**\n\
            那不是删除，那是把问题连同一张便条一起交了出去 —— 执行人读到的仍然是那句错的话。\n\n> ❌ 「作者回复时补充：试过完全解开但太松，没采用（此条已删除，因无事实支撑，改为不提）。」\n> —— 编造的内容和「已删除」写在同一句里，一起交到了执行人手上。**这不叫删除。**\n\
            >\n> ✅ 那一句从用户交付块里**完全不出现**；淘汰原因写在完整 Artifact 里。\n\n### 自检和自述都不是完成证据\n\n> **你在自检、`used_fact_refs[]` 或任何说明文字里声称「已删除」「已处理」「已核实」，\n\
            > 不构成完成证据。最终判定以用户交付块的实际文本、以及有效的 `fact_id` 对应关系为准。**\n\n**不得用自我声明覆盖实际正文。** 说了删，正文里还在，那就是没删 —— 而且比不说更糟，\n因为它会让下游以为这一处已经清理过了。\n\
            \n判断标准只有一个：**把你说删掉的那句话，回用户交付块里搜一遍。搜得到，就是没删。**\n\n**（M4 补充）** 用户交付块里同样**不出现内部分级术语与内部状态码**：`PRE` / `MIXED` / `FINAL`、\n\
            `KNOWN_BUT_NOT_AUTHORIZED`、`PLATFORM_SPEC_UNVERIFIED`、`STALE`、Return 的七个字段名——\n这些留在完整 Artifact 里。但**「不泄露」不是「少给」**：用户必须做的选择、包装成立的条件、\n\
            真实的阻断，一项都不能投影掉，只是要用自然语言说。\n\n---\n\n## 自检\n\n1. 标题是摘要还是缺口？——摘要就重写\n2. 候选覆盖了几种入口类型？——**只有一种等于只有一个候选**；类型数与候选数对得上吗\n\
            3. 封面和标题是不是在说同一件事？——是就浪费了一半\n4. 刷到型平台的首帧和点击型平台的封面，是同一张吗？——是就说明没做平台适配\n5. 平台改写里标了几项\"不变\"？——一项没有＝为改而改；全都不变＝没做适配\n\
            6. 发布文案开头三行单独拿出来，成立吗？\n6b. **逐句比对发布文案正文和逐字稿**——有几句是口播稿的搬运？**一句都不该有**。自己声称\"没有复述\"不算数，要真的比对过\n7. mode 是**按三级判据依次**推出来的，还是拍脑袋填的？判\
            \ FINAL 之前，`uncovered_beats[]` 里每一项**都写出已完成的处置结果**了吗——还剩一项 OPEN 就该是 MIXED。PRE／MIXED 里仍悬着的那部分产出，有没有全部标注为草案？\n8.\
            \ FINAL 模式下，`realized_payoff` 是从 **beat 级** manifest 归纳出来的，还是拿一句\"拍了 42 分钟\"当依据？\n8b. `used_fact_refs[]` 里，`realized_payoff`／推荐标题／封面／发布文案／评论区事实陈述，\n\
            \    **五处都回指到具体 `fact_id` 了吗**？有没有哪一句是事实性表达却挂不上任何 `fact_id`——\n    挂不上就不能留在定稿里。\n8c. `used_fact_refs[]` 里的编号，**每一个都是\
            \ `BRF-SUHE-001-XXX` 这样的登记全称**吗？\n    有没有写成 `F02` 这种简写、或者一个 `fact_refs[]` 里根本没有的号？\n    另外——产出里**每一处\"某人做了某事／某人说了某句话／我们当时怎么决定的\"\
            **，\n    都在表里挂上号了吗？漏的那几处，就是最可能编出来的那几处。\n9. `explicit_non_promise[]` 里的东西，标题、封面、置顶评论有没有把它悄悄承诺回来？\n9b. 上游 `constraints[]`\
            \ 里的禁令，**封面和首帧的选帧**守住了吗？——第三方入镜、未成年人不露正脸这类禁令，最容易在封面上破功\n10. 平台规格拿不到时，出的是**条件式改写**（分支型）与**定性制作要求**（数值型），\n    还是白卷、或者一个自己编的数字？`platform_spec_status`\
            \ 标了吗？\n11. **（M4）** `evidence_basis` 写清楚了吗——本次兑现证据是哪一类、来源、确认状态、权限、时效？\n    有没有把资产级数量（「拍了 42 分钟」「有 36 张图」）当成兑现证据用？\n\
            \    有没有因为「按流程应该先有 `cs_final` / `pd_final`」就要求补跑 CS 或 PD？——**一次都不该有。**\n12. **（M4）** `packaging_routes[]` 的条数，是**判出来**的还是**凑出来**的？\n\
            \    任意两条的失效条件一样吗——一样就是同一条。\n    列表里有没有混进周期策略候选或单条创意候选？\n13. **（M4）** 每条 `return_to_script[]` / `return_to_production[]`\
            \ 都写全七项了吗？\n    `precise_gap` 有没有写成\"信息不足\"？`proposed_disposition` 是不是**只选了一个**？\n    `downstream_stale[]` 有没有把不依赖的项也拉进来（多算）或漏掉已知依赖（少算）？\n\
            \    上游给来的东西解析不了时，标的是 `PARSE_FAILED` 并留了原文，还是写成了空数组？\n14. **（M4）** 事实核验失败时，原 Artifact 与失败输出都留着吗？\n    有没有靠删掉被质疑的那句话把结论改成通过？——**把删掉的那句回失败清单里搜一遍。**\n\
            \    不依赖该事实的那些部分，是照常完成的，还是被一起做浅了？\n\n---\n\n## 参考文件\n\n- `references/platforms.md` — 抖音／视频号／小红书的规格与机制，每条带 `as_of`\n\
            - `references/industry-conditions.md` — 五个行业的包装差异\n- `references/examples.md` — 端到端黄金案例\n\n**参考文件拿不到时**：`platforms.md`\
            \ 按「母版制」那三种情况处置。**另两份直接跳过，照常产出，写进 `missing[]` 就够了**——它们是示范和背景，不是参数，**不要凭记忆补一个案例或一条行业惯例上去**。\n\n> **路径说明（M4）**：上述三份\
            \ reference 指向既有目录\n> `content-production/skills/packaging-content-for-release/references/`。\n> 本后继版本**不复制、不新建\
            \ `references/` 目录**，只按需加载既有主本的最小投影：\n> `platforms.md` 按目标平台加载对应条目（含 `as_of`）、`industry-conditions.md` 按 `subject_domain`\
            \ 加载对应段、\n> `examples.md` 仅在显式请求时加载。**示例只作形式与质量参考，不变成事实、话术或模板。**\n\n---\n\n# 本次运行注入的参考文件片段\n\n以下片段由确定性投影节点按 M4\
            \ 统一能力合同 §12 的固定加载矩阵选出。**未列出的参考内容本次没有加载，不得引用、不得凭记忆补写。**\n\n{{#ref_projection.output#}}\n"
