        desc: system prompt 由后继 SKILL 文件字节派生（生成器保证），不手工同步。
        memory: null
        model:
          completion_params:
            max_tokens: 384000
            reasoning_effort: low
            thinking: true
            top_p: 0.8
          mode: chat
          name: deepseek-v4-flash
          provider: langgenius/deepseek/deepseek
        prompt_template:
        - role: system
          text: "---\nname: packaging-content-for-release-m4\ndescription: Builds the release package for a finished piece\
            \ of content — titles, cover, first frame, publish copy, caption rules, music and sound placement, comment-section\
            \ design, CTA surfacing, and per-platform adaptation for Douyin, WeChat Channels, and Xiaohongshu. Use whenever\
            \ the user needs a 标题 / 封面 / 首帧 / 发布文案 / 字幕规则, asks how to publish something on a specific platform, wants to\
            \ know why a piece isn't getting clicks, or asks to adapt one piece across platforms — including when they just\
            \ say \"帮我起个标题\" or \"这条发小红书要改什么\". Runs in PRE mode from a script and shot plan, or FINAL mode from actual footage.\
