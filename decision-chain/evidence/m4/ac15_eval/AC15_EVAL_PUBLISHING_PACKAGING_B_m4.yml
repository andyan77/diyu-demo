    - data:
        desc: 按统一能力合同 §12 加载矩阵确定性投影；不由 LLM 决定加载范围；不建第二套附件库。
        selected: false
        template: '{%- set INDS = ["服装 / 门店零售", "餐饮 / 门店", "知识付费 / 课程", "动漫 / 原创 IP", "户外 / 露营（爱好垂类）"] -%}

          ## 参考投影 · 按 M4 统一能力合同 §12 加载矩阵确定性选出


          ### platforms.md :: 目标平台条目（含 `as_of`）


          本次 `platform` = {{ platform }}。


          - `NOT_LOCKED` ⇒ **只出母版，不出任何平台改写**（这是正常状态，不是缺陷）。

          - 平台已锁定但主本条目不可得 / 已过期 ⇒ **分支型参数出条件式改写**（两支都写完整），**数值型参数置 `PLATFORM_SPEC_UNVERIFIED` 并改写为定性制作要求**，并在 `missing[]`
          注明定稿前必须查表。**不得凭记忆补一个数字。**


          {%- if subject_domain in INDS %}

          ### industry-conditions.md :: {{ subject_domain }}


          按 `subject_domain` 条件加载该行业段落。

          {%- else %}

          ### industry-conditions.md :: 未加载


          `subject_domain` = {{ subject_domain }} 不在五个已登记行业内 ⇒ **按通用处理并在 `assumptions[]` 声明**，不要挑一个「最像的」套上去。

          {%- endif %}


          {%- if example_reference_requested == ''YES'' %}

          ### examples.md :: 端到端黄金案例


          **只作形式与质量参考，不得变成事实、话术或模板。**

          {%- else %}

          ### examples.md :: 未加载


          本次未显式请求案例参考 ⇒ 不加载。**不得凭记忆补一个案例上去。**

          {%- endif %}



          **未列出的参考内容本次没有加载，不得引用、不得凭记忆补写。**

          '
