            platform_variants[]       逐项：改了什么 → 应对什么机制 / 不变 → 为什么\nrelease_check             五条各自的实际结论\nsingle_distribution_promise\
            \   ≤ realized_payoff（PRE 模式下 ≤ content_promise 且标草案）\nreturn_to_script[]        回改建议 —— **每条必须写全七项**（见「Return\
