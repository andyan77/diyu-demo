    - data:
        code: "\nimport hashlib\nimport json\nimport re\n\n# M4 统一能力接缝 · 确定性外壳校验\n# 只做**结构性**充分性（在场 / 非空 / 可解析）与绑定计算。\n# 语义单薄（N-34「极薄字段齐全」）的最终裁决属于业务判断，\n\
          # 由本能力的后继 Skill 正文负责；本节点只置 vacuity_flags 供其判断，\n# 不代替 Skill 作专业裁决（统一能力合同 §1.2.4）。\n\nREQUIRED = [\"objective\",\
          \ \"audience_problem\", \"expected_change\", \"content_promise\", \"facts_registered\", \"expression_subject_and_boundary\"\
          ]\nCAPABILITY = \"CONTENT_BRIEF\"\nALLOWED_ENTRIES = [\"ENTRY-03\"]\nALLOWED_RUN_MODES = [\"COMPILE_SINGLE_CONTENT_CONTRACT\"\
          ]\nDEFAULT_RUN_MODE = \"COMPILE_SINGLE_CONTENT_CONTRACT\"\n\nVACUOUS = [\n    \"做一条好内容\", \"提升影响力\", \"让大家更了解我们\"\
          , \"顾客不了解我们\",\n    \"提升曝光\", \"增加粉丝\", \"宣传新品\", \"促进转化\", \"打造心智\", \"多账号种草\",\n    \"更好\", \"更专业\", \"待定\", \"\
          无\", \"n/a\", \"none\", \"tbd\",\n]\n\nGOAL_FAMILIES = [\"LONG_TERM_VALUE\", \"ACCOUNT_STARTUP\", \"FOLLOWER_GROWTH\"\
          , \"TRAFFIC\",\n                 \"GMV\", \"LEADS\", \"STORE_VISIT\", \"MIXED\"]\nCTA_LEVELS = [\"NO_CTA\", \"LOW_RISK_INTERACTION\"\
          , \"BUSINESS_HANDOFF\",\n              \"HIGH_RISK\", \"KNOWN_BUT_NOT_AUTHORIZED\"]\n\n\ndef _sha(s):\n    return\
          \ hashlib.sha256((s or \"\").encode(\"utf-8\")).hexdigest()\n\n\ndef _norm(s):\n    return re.sub(r\"\\s+\", \"\
          \ \", (s or \"\")).strip()\n\n\ndef _find_scalar(text, key):\n    \"\"\"从外壳文本里取一个标量语义值。容忍 YAML / JSON / Markdown\
          \ 三种写法，\n    因为统一外壳**不强制物理字段名**（统一能力合同 §1.1）。\"\"\"\n    if not text:\n        return \"\"\n    pats = [\n     \
          \   r'\"%s\"\\s*:\\s*\"([^\"]*)\"' % re.escape(key),\n        r\"^\\s*%s\\s*:\\s*[\\\"']?([^\\\"'\\n]+)[\\\"']?\\\
          s*$\" % re.escape(key),\n        r\"`%s`\\s*[:：]\\s*([^\\n]+)\" % re.escape(key),\n    ]\n    for p in pats:\n \
          \       m = re.search(p, text, re.MULTILINE)\n        if m:\n            return _norm(m.group(1))\n    return \"\
          \"\n\n\ndef _present(text, key):\n    \"\"\"语义在场判据：能取到标量值，或存在以该 key 起头的非空块。\"\"\"\n    v = _find_scalar(text, key)\n\
          \    if v and v.lower() not in (\"\", \"null\", \"none\"):\n        return True, v\n    m = re.search(r\"^\\s*%s\\\
          s*:\\s*$\" % re.escape(key), text or \"\", re.MULTILINE)\n    if m:\n        tail = (text or \"\")[m.end():]\n \
          \       block = []\n        for line in tail.split(\"\\n\"):\n            if line.strip() == \"\":\n           \
          \     if block:\n                    break\n                continue\n            if not line.startswith((\" \"\
          , \"\\t\", \"-\")):\n                break\n            block.append(line.strip())\n        if block:\n        \
          \    return True, \" \".join(block)[:400]\n    return False, \"\"\n\n\ndef _vacuous(v):\n    n = _norm(v).lower()\n\
          \    if not n:\n        return True\n    if len(n) < 4:\n        return True\n    for w in VACUOUS:\n        if\
          \ n == w.lower():\n            return True\n    return False\n\n\ndef main(capability_call, professional_input,\
          \ entry, run_mode, example_reference_requested):\n    env = capability_call or \"\"\n    prof = professional_input\
          \ or \"\"\n    blob = env + \"\\n\" + prof\n\n    missing = []\n    vacuity_flags = []\n    for key in REQUIRED:\n\
          \        ok, val = _present(blob, key)\n        if not ok:\n            missing.append(key)\n        elif _vacuous(val):\n\
          \            vacuity_flags.append(key)\n\n    # entry 解析：只接受结构化能力调用意图，不做自然语言意图识别\n    entry_in = _norm(entry).upper()\n\
          \    if entry_in in ALLOWED_ENTRIES:\n        entry_resolved = entry_in\n    elif entry_in in (\"\", \"AUTO\", \"\
          NONE\"):\n        entry_resolved = ALLOWED_ENTRIES[0]\n    else:\n        entry_resolved = \"ENTRY_NOT_APPLICABLE_FOR_THIS_CAPABILITY\"\
          \n\n    # run_mode 解析\n    rm_in = _norm(run_mode).upper()\n    if rm_in in ALLOWED_RUN_MODES:\n        run_mode_resolved\
          \ = rm_in\n    else:\n        run_mode_resolved = DEFAULT_RUN_MODE\n\n    goal_family = (_find_scalar(blob, \"goal_family\"\
          ) or \"\").upper()\n    if goal_family not in GOAL_FAMILIES:\n        goal_family = \"UNDECLARED\"\n\n    cta_level\
          \ = (_find_scalar(blob, \"cta_level\") or _find_scalar(blob, \"cta_contract\") or \"\").upper()\n    if cta_level\
          \ not in CTA_LEVELS:\n        cta_level = \"NO_CTA\"\n\n    subject_domain = _find_scalar(blob, \"subject_domain\"\
          )\n    platform = _find_scalar(blob, \"platform\") or \"NOT_LOCKED\"\n    duration_band = (_find_scalar(blob, \"\
          duration_band\") or \"SHORT\").upper()\n    equivalence_basis = _find_scalar(blob, \"equivalence_basis\") or \"\
          NOT_STATED\"\n    source_kind = (_find_scalar(blob, \"source_kind\") or \"UNDECLARED\").upper()\n\n    if entry_resolved\
          \ == \"ENTRY_NOT_APPLICABLE_FOR_THIS_CAPABILITY\":\n        status = \"INSUFFICIENT\"\n        note = \"entry 与本能力不匹配：%s\
          \ 不属于 %s\" % (entry_in, ALLOWED_ENTRIES)\n    elif missing:\n        status = \"INSUFFICIENT\"\n        note = \"\
          缺少完成本次判断所必需的业务语义：%s\" % \", \".join(missing)\n    elif vacuity_flags:\n        # 结构在场但可能语义单薄：不在此处判定不足，交由 Skill 正文作专业裁决\n\
          \        status = \"SUFFICIENT_WITH_CONDITIONS\"\n        note = \"结构在场；以下项疑似语义单薄，交由本能力 Skill 正文裁决：%s\" % \", \"\
          .join(vacuity_flags)\n    else:\n        status = \"SUFFICIENT\"\n        note = \"结构性充分\"\n\n    can_run = \"false\"\
          \ if status == \"INSUFFICIENT\" else \"true\"\n\n    conditionalized = []\n    if platform.upper() in (\"NOT_LOCKED\"\
          , \"UNKNOWN\", \"未确认\"):\n        conditionalized.append(\"platform 未锁定：只产出平台中立母版，锁定平台列为条件\")\n    if goal_family\
          \ == \"UNDECLARED\":\n        conditionalized.append(\"objective.goal_family 未声明：不得代为推断，按未声明处理并在产出中标注\")\n    if\
          \ vacuity_flags:\n        conditionalized.append(\"疑似语义单薄项：%s\" % \", \".join(vacuity_flags))\n\n    return {\n\
          \        \"status\": status,\n        \"can_run\": can_run,\n        \"note\": note,\n        \"missing\": missing,\n\
          \        \"missing_text\": \", \".join(missing) if missing else \"无\",\n        \"vacuity_flags\": vacuity_flags,\n\
          \        \"conditionalized_text\": \"；\".join(conditionalized) if conditionalized else \"无\",\n        \"entry_resolved\"\
          : entry_resolved,\n        \"run_mode_resolved\": run_mode_resolved,\n        \"goal_family\": goal_family,\n  \
          \      \"cta_level\": cta_level,\n        \"source_kind\": source_kind,\n        \"subject_domain\": subject_domain,\n\
          \        \"platform\": platform,\n        \"duration_band\": duration_band,\n        \"equivalence_basis\": equivalence_basis,\n\
          \        \"envelope_hash\": _sha(env),\n        \"professional_input_hash\": _sha(prof),\n        \"capability\"\
          : CAPABILITY,\n        \"example_reference_requested\": _norm(example_reference_requested).upper(),\n    }\n"
        code_language: python3
        desc: 确定性外壳校验：结构性充分性 + 绑定计算。语义单薄的裁决交给 Skill 正文。
