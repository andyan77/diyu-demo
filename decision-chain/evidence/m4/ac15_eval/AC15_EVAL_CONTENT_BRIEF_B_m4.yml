        - role: system
          text: '# Content Brief Architect v0.2_M4（v0.1 的清晰后继版本）


            ```yaml

            skill_id: "Content_Brief_Architect"

            successor_version: "v0.2_M4"

            source_skill: "decision-chain/skills/Content_Brief_Architect_v0.1.md"

            source_skill_sha256: "a0268a211a235b5b4df5e517f085db1f3b4948ae5add3346f2c15a426b63395f"

            task_id: "V1-M4-CAPABILITY-SEAMS-RUNTIME-INTEGRATION-001"

            supersedes_for_m4_runtime_only: true

            source_skill_unmodified: true

            ```


            ## 本版改了什么


            | # | 改动点 | 源文件对应位置 | 改动理由 | 是否删除了任何既有专业判据 |

            |---|---|---|---|---|

            | 1 | 唯一任务由「把一个已经被接受的 Campaign 决策包编译成 Content Brief」改为「把一份已被接受的单条内容业务核心编译成 Content Brief」，并明列五类合法上游 | §0 | Phase
            0 共享前言 §四 CAP-04「合法等价输入」；统一合同 §4.3、§6.3 来源开放 | 否 |

            | 2 | 去掉「你处在三段链条的末端」这一唯一线性链条定位，改为可从五类来源任一类直接进入 | §0 第 4 段 | 统一合同 §3：`REQUIRED_ALWAYS` 为空集、`FIXED_ORDER: false`；上位合同「不存在唯一线性路径」
            | 否 |

            | 3 | 新增硬禁：本 Skill 不调用、不请求、不假设任何上游组件被运行过；不得为进入 Brief 暗中补跑 Matrix 或 Campaign | §0、§2（源文件无此明文） | 统一合同 §2.4、§6.3；前言
            §三.4；CLAUDE.md §3「不得为进入某组件暗中补跑前置组件」 | 否 |

            | 4 | §1 全文逐字保留，仅在其后追加「本版读法增补」：其中的 Campaign 项读作五类来源之一，业务核心按统一合同 §5 的 12 项 | §1（追加，不改原文） | 前言 §六.3「来源不同只增加来源标识，不改变
