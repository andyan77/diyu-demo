            # 序里集 Campaign 当前素材与资源夹具 v0.1


            ## 一、文档身份


            本文件为序里集虚构客户 Demo 的当前素材与资源输入，全部新增内容统一标记为：


            ```text

            FactStatus：SIMULATED_DEMO_FACT

            ```


            这些内容不是现实企业、真实顾客或真实经营数据。


            - **适用战役：** “初秋通勤衣橱”第一阶段；

            - **资源快照日期：** 2026-08-20；


            本文件只能用于：


            - 序里集 Demo 的 C2—C6 专家判断；

            - Campaign Orchestrator 测试；

            - Dify 工作流输入；

            - Demo 内容、脚本和制作任务包生成；

            - 验证多账号是否能够围绕同一经营任务产生不同价值。


            不得将本文件中的人物、商品、库存、试穿、顾客或经营记录，对外描述为现实企业事实。若用于客户演示，必须明确说明序里集为虚构演示品牌，相关数据为模拟夹具。


            本文件只补充当前可用事实、素材与资源，不预先决定谁主讲、哪些账号参战、各账号表达角度和七天排序。


