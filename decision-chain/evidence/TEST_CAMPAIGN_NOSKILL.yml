            # C6 Founder 已确认结论 v0.1


            ## 文档身份


            - **状态：** `FOUNDER_CONFIRMED_WITH_MINOR_CLARIFICATION`

            - **确认日期：** 2026-08-20

            - **适用战役：** 序里集“初秋通勤衣橱”第一阶段

            - **当前问题：** 出现事实不足、产能不足或目标冲突时怎么办？


            本文件是 C6 的正式确认结论，也是整理 `Campaign Orchestrator v0.1` 时唯一可使用的 C6 输入。C6 五位专家原始回答、对抗审查、融合过程和未采用方案，不进入
            Orchestrator。


            ## 一、确认前提


            以下两项 C5 资产必须已经正式落盘，并与本文件同时归档：


            - `序里集_Campaign最小承接条件夹具_v0.1.md`；

            - `C5_FOUNDER_CONFIRMED_v0.1.md`。


            仓库归档时，执行侧必须先确认两项文件均已被 Git 正式跟踪。若任一项尚未进入仓库，本文件可以生成，但不得将 C1—C6 的仓库状态标记为全部收口。


            本文件不改变 C5 已确认的统一入口、承接人、替补、Demo 配额和预约确认方式，也不把纸面 Demo 流程描述为已经上线的 CRM、排班或预约系统。


            ## 二、总原则


            异常发生时，不默认停止整个 Campaign，也不默认交 Founder，更不默认重新打开 C2。


            统一采用：


            > **最上游实际失效结论回退原则。**


            先判断新事实究竟破坏了哪一个已经确认的业务结论，再返回其中最上游的一项重新判断。


            “最上游”不是编号最小，也不是看起来最严重，而是：


            > 如果该结论不重新确认，后续哪一项判断就失去了成立依据。


            如果一次异常同时破坏多个彼此独立的成立前提，可以形成一个“最上游实际失效结论集合”，分别返回相应问题；不得为了形式简单，强行把所有问题归入同一个编号。


            返回后，只重新判断实际受影响的下游结论；没有受到影响的 C1—C6 结论继续有效，不自动推翻、不从头重做。


            ## 三、事实不足时怎么办


            事实不足只停止依赖该事实的具体结论或内容，不自动停止整个 Campaign。


            按以下顺序处理：


            1. **删除：** 删除无法由原始事实负责人确认的细节、案例或结论；

            2. **降级：** 把表达收窄到现有证据真正支持的范围，并保留仍需本人试穿或现场确认的事项；

            3. **改题：** 将题目改到现有事实能够完整回答的位置；

            4. **延期或不发：** 删除、降级和改题后仍没有新问题、新证据或新判断时，取消该条内容。


            改题必须同时满足：


            - 继续推动 C1 已确认的顾客变化；

            - 保持 C3 已确认的账号表达角度和判断责任；

            - 使用当前已经登记且可确认的事实；

            - 不把事实缺口改写成空泛品牌态度、通用知识或“建议到店试试”；

            - 继续守住共情、观点、烟火气、真实感和内容叙事化底线。


            改题不得暗中改变 C2 已确认的参战与主讲关系、C4 已确认的执行边界或 C5 已确认的对外承接承诺；确需改变时，返回对应问题重新判断。


            原始事实负责人负责确认事实能否保留、删除或降低结论强度；对应内容负责人和制作执行负责改稿、延期、撤稿或取消。制作侧不得自行改写他人事实来维持内容成立。


            如果改题后不再满足上述条件，应返回被新事实实际破坏的上游问题重新判断，而不是由内容团队继续包装。


            明确禁止：


            - 根据图片、品类名称、人物身份或行业经验补写商品事实；

            - 把内部演示人员包装成现实顾客；

            - 把匿名门店问题、商品判断和内部试穿拼成一个真实顾客故事；

            - 虚构试穿差异、顾客反馈、退换货、未成交原因或经营冲突；

            - 用 Founder 背书代替商品、试穿和门店事实确认；

            - 用“因人而异”回避现有事实已经能够支持的明确判断；

            - 为维持排期，把事实不足的内容改成安全但无用的知识清单或品牌说教。


            ## 四、产能不足时怎么办


            产能不足时，优先削减覆盖面、数量和制作复杂度，不削减事实确认、判断完整性和顾客价值。


            首周依次缩减：


            1. 取消轻量澄清；

            2. 不启用林序的条件性备用内容；

            3. 放弃六款商品覆盖和其他内容单元；

            4. 减少非必要镜头、包装和形式复杂度；

            5. 优先保留苏禾一条真实使用内容和周宁一条选择判断内容构成的完整链。


            普通的拍摄窗口变化、剪辑延期、发布时间调整、内容数量调整和单条内容延期，直接调整 C4，不重开 C2。


            只有出现以下结构性变化，才重新打开 C2：


            - 周宁不再具备主讲所需的核心商品比较事实或人员条件；

            - 苏禾不再具备独立使用判断所需的真实试穿材料或人员条件；

            - 林序现有有限参战依据被撤回，且该变化影响本轮参战组合；

            - 陈晚或其他角色新增了足以改变参战组合的独立判断链；

            - 已确认主讲关系或账号之间的独立判断链整体不再成立。


            不得因为一个镜头缺失、一条内容延期或未用满产能，就重开 C2。


            C4 已确认的“两条主要内容无法完成时重开 C2”，在本文件中明确解释为：周宁—苏禾核心组合因事实、人员或资源资格变化而持续或结构性不可运行。若只是短期拍摄窗口、剪辑或发布时间变化，先在
            C4 内减量、延期或调整，不直接重开 C2。


            ## 五、门店承接不足时怎么办


            门店承接不足只约束会制造预约和服务预期的表达，不自动停止仍有独立判断价值的内容。


            默认处理：


            - 暂停或删除预约型 CTA；

            - 核心内容继续帮助顾客识别问题、比较、排除和形成待验证方向；

            - 已提交申请在未完成确认前继续保持“已提交，待确认”；

            - 不制造名额、库存、排队或“已经约满”的虚假紧迫感；

            - 不让发布账号、出镜人、个人微信或临时私信接单补洞。


            当以下任一 C5 成立条件失效时，重新打开 C5：


            - 统一入口；

            - 主承接人；

            - 替补；

            - 任一门店 Demo 配额；

            - 预约确认方式。


            这里的“失效”是指该构成要素本身不再真实、不可用或无法按已确认方式运行。某日配额已满、暂时无法确认或一般容量波动，属于既有机制内的日常状态，由陈晚和对应门店处理，维持“已提交，待确认”或暂停新增预约型表达，不自动重开
            C5。


            重开 C5 期间：


            - 暂停预约型表达；

            - 不把提交申请描述为预约成功；

            - 不因此停止仍符合 C1、C3 和事实边界的判断型内容；

            - 不建设临时 CRM、排班系统、状态机或预约前端。


            如果需要新增候补、取消、改期、跨店调配、固定回复时效、指定服务人员、服务时长或结果保证，已经超出日常容量调整，应按新增对外政策或承诺处理。


            ## 六、目标冲突时怎么办


            能够通过减量、延期、换题或调整顺序解决的，不升级为重大经营取舍。例如：


            - 单个 SKU 事实未及时确认；

            - 一组试穿素材暂时不能公开；

            - 某个账号本周无法按原计划出镜；

            - 第三条内容没有新增价值；

            - 当日门店配额无法确认；

            - 普通负面评论或事实误解；

            - 拍摄、剪辑和发布时间发生一般变化。


            以下事项属于真正的经营取舍，必须交 Founder：


            - 改变 C1 已确认的经营任务、唯一主目标或核心品牌判断；

            - 为短期成交隐去商品限制、不适合边界或事实不确定性；

            - 将本轮改成清仓、强促销、库存消化或预约填充任务；

            - 用库存或 Demo 配额制造虚假稀缺和紧迫感；

            - 要求门店承担超出现有条件的新服务承诺；

            - 改变长期账号使命或组织权责；

            - 增加重大人员、预算、系统或持续制作投入；

            - 形成新的正式品牌立场、品牌级公开回应或对外承诺。


            Founder 裁决前，与冲突直接相关的内容停止发布；与冲突无关、且事实、目标和顾客价值仍完整成立的内容可以继续。


            ## 七、返回哪个问题


            | 实际被新事实破坏的结论 | 返回位置 | 典型情形 |

            |---|---|---|

            | 经营任务、目标顾客变化、唯一主目标或核心品牌判断 | 先交 Founder，再重开 C1 | 任务改为清仓或强促销；主目标改变；要求牺牲已确认品牌判断
            |

            | 参战账号资格、主讲关系或独立判断链的结构 | 重开 C2 | 核心账号事实或人员条件失效；出现会改变组合的新角色能力 |

            | 某账号的具体顾客问题、一手证据使用方式或独有新判断 | 重开 C3 | 账号仍具备参战资格，但原表达角度不再成立或发生实质重叠 |

            | 发布顺序、数量、接力条件或七天时间安排 | 调整 C4 | 普通拍摄、剪辑、排期、数量和先后变化 |

            | 统一入口、承接人、替补、门店配额或确认方式 | 重开 C5 | 承接条件失效、人员变化、门店无法按已确认方式确认 |

            | 现有异常路由原则或 Founder 升级边界本身需要改变 | 重审 C6 | 新情况要求改变本文件的责任边界，而非处理一次具体异常 |


            返回上游后，只检查真正依赖该结论的下游项：


            - C4 调整不自动推翻 C1—C3 或 C5；

            - C5 重开不自动推翻 C1—C4；

            - C3 重开时，仅复核依赖该角度的 C4、C5 内容；

            - C2 重开时，仅复核受新参战关系影响的 C3—C5 内容；

            - C1 重开时，才检查 C2—C5 哪些结论因新目标实际失效。


            不得把“回到上游”理解为删除所有历史结论或重新运行全部六题。


            ## 八、谁可以决定不发


            “不发”是正常专业权限，不是失败，也不要求每次交 Founder。


            ### 单条内容


            对应账号负责人、原始事实负责人和制作执行可以在各自权限内决定：


            - 删除；

            - 降级；

            - 改题；

            - 延期；

            - 不发。


            适用原因包括：


            - 核心事实不能确认；

            - 删除不确定事实后已无实质判断；

            - 没有新增问题、新证据或新判断；

            - 只能依靠虚构或越权表达维持内容；

            - 成片事实安全但退化为知识清单、培训课、参数表、品牌说教或重复卖点；

            - 内容会制造门店当前无法兑现的服务预期。


            单条内容不发无需 Founder 批准；但如果该决定使 C4 的最低运行链不再成立，应先重开 C4。只有当其进一步证明账号资源资格、主讲关系或独立判断链发生结构性失效时，才重开
            C2。林序首周备用内容未触发，属于 C4 已确认的正常条件结果，不构成 C2 失效。


            ### 多条相关内容或局部阶段


            由本轮实际经营负责人和对应账号负责人根据已确认目标、事实和资源共同决定暂停、减量或延期；如果只是顺序和数量变化，调整 C4。


            ### 整个 Campaign


            取消整个 Campaign、改变经营任务、改变唯一主目标、改变核心品牌判断或改变长期账号职责，必须交 Founder 裁决，并返回相应上游问题。


            已经投入拍摄、剪辑或排期，不构成必须发布的理由；账号需要保持活跃、产能尚有空余或计划已经写好，也不构成发布理由。


            ## 九、日常责任与 Founder 边界


            ### 日常事项由对应负责人处理


            - 商品登记、选品比较和组合边界：周宁；

            - 内部试穿、搭配、陈列和使用判断：苏禾；

            - 匿名门店问题、服务事实、申请状态和旗舰店普通配额处理：陈晚；

            - 第二门店普通配额与本店承接条件：第二门店当班负责人；

            - A01 已登记经营取舍及可公开范围：林序；

            - 拍摄、剪辑、字幕、封面和普通排期：现有制作执行与对应内容负责人。


            普通负面评论、事实误解、一般容量波动、单条内容删改和日常执行调整不交 Founder。


            ### 只有以下事项交 Founder


            - 正式品牌立场；

            - 品牌级公开回应；

            - 重大经营取舍；

            - 长期账号使命；

            - 组织权责变化；

            - 重大资源投入；

            - 新增或改变对外政策与承诺。


            “可能影响声誉”或“评论较负面”本身不足以触发 Founder。只有需要品牌以正式立场公开回应，或已经涉及上述重大事项时，才升级。


            “品牌级公开回应”是指需要以品牌名义，对争议、经营立场或对外责任作统一正式表态。普通事实纠错、评论处理、内容撤回和日常解释不属于品牌级公开回应。


            ## 十、内容质量底线继续有效


            异常处理不能只保证“没有编造”，还必须保证剩余内容值得发布。


            所有继续发布或改题后的核心内容，仍须守住 C1 已确认的五项底线：


            - 共情；

            - 观点；

            - 烟火气；

            - 真实感；

            - 内容叙事化。


            这些不是五栏模板，也不得生搬硬套。内容必须从本账号真实事实、顾客处境和判断责任自然产生。


            如果内容事实安全、格式完整，却整体成为培训课程、参数清单、通用穿搭知识、品牌宣言或机械故事，顾客没有感到自己的处境被理解，也没有得到新的判断价值，则应改题、延期或不发。


            ## 十一、非建设范围


            本原则只是业务判断路由，不建设：


            - 状态机；

            - Contract；

            - Gate；

            - Schema；

            - 自动回退系统；

            - 自动异常分级器；

            - 自动评分器；

            - 新的 CRM、排班或预约系统。


            不得把“返回 C1—C5”实现成复杂工程流程。本 Demo 只需要用业务语言说明：什么事实变了、哪项结论因此失效、谁重新判断、哪些后续内容需要复核。


            ## 十二、C6 状态与下一步


            ```text

            C6：CONFIRMED_WITH_MINOR_CLARIFICATION

            新增 Founder 待决项：无

            C1—C6：全部收口

            下一步：整理 Campaign Orchestrator v0.1

            ```


