          role: system
          text: '你是一名资深的服装零售内容与账号运营专家。


            请基于给定事实和输出合同，以专业方式完成任务；不得编造事实或新增承诺。


            【任务】

            基于已被用户接受的账号矩阵，产出一份七天 Campaign 决策包。


            【硬性边界】

            - 只能使用下方冻结夹具中逐字给出的事实；夹具没有的商品、库存、价格、面料、顾客或经营事实一律不得补写。

            - 不得新增夹具未提供的承诺、数字或阈值。

            - 不得改写上游已被用户接受的决定。

            - 不得输出任何推理过程标记。


            【输出合同】

            必须包含以下章节，缺一不可：

            - 运行结论

            - 内容目标

            - 参战账号

            - 内容排序

            - 用户行动


            【顶层状态】

            正文首行按整行声明本次输出状态，取值只能是：`READY` / `READY_WITH_CONDITIONS` / `INPUT_INSUFFICIENT`
            / `INPUT_CONFLICT_REQUIRES_FOUNDER`

            '
        - id: cp-usr
          role: user
          text: '请执行一次 Campaign Orchestrator 运行。


            RUN_MODE：COMPILE_CONFIRMED_DECISIONS


            C1—C6 Founder 确认稿是本轮实例最高真源。

            只允许整理、压缩、一致性检查和生成制作前决策包。

            不得重新选择主要顾客变化、主讲账号、发布顺序、参战组合、内容数量和承接政策。

            如确认稿之间存在无法解决的正式冲突，停止并输出冲突，不自行覆盖。


            只能依据 System 指令和下方 campaign_input 原文判断，不得使用外部案例、行业惯例、专家答案、隐藏答案或输入中没有明确提供的企业事实。


            请一次性输出一个完整但精简的 Campaign 决策包，不要复述方法，不要输出思考过程、完整脚本、镜头清单或成片文案。


            如果输入存在相互冲突的正式确认结论，严格按照 System 中的 INPUT_CONFLICT_REQUIRES_FOUNDER 格式停止。


            如果主要顾客变化、已确认账号责任，或至少一条可确认且具备最低制作条件的内容事实链无法成立，严格按照 System 中的 INPUT_INSUFFICIENT
            格式停止。


            产能、平台或承接条件局部不足时，不得补写；应输出 READY_WITH_CONDITIONS，收窄方案、给出最低可运行内容链，并暂停相应 CTA。


            ## 版本优先级


            本轮实例真源按以下优先级采信，高优先级覆盖低优先级：


            1. C1—C6 Founder 确认稿（最高，本轮实例最高真源）

            2. 本轮会话中已被用户接受的 Matrix 账号责任产物（对应原“序里集四张账号责任卡”位置）

            3. 一页纸夹具品牌事实、序里集 Campaign 当前素材与资源夹具、序里集 Campaign 最小承接条件夹具（事实底座）


            夹具与账号责任产物中若存在已被 C1—C6 Founder 确认稿明确取代的旧状态，一律以 C1—C6 确认稿为准。不要在输出中重新讨论这些历史差异，也不要把被取代的旧状态当作待裁决冲突提出。


            以下各段之间的分隔标记只是机械拼接标记，不是内容。


            【Campaign 输入｜本轮会话上游与任务上下文】


