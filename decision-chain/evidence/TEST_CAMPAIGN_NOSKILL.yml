            - C2 专家对照分析；

            - `C2_五专家融合回复_待Founder确认_v0.1.md`；

            - 未采用的条件分支；

            - C3 预写答案、Campaign Skill 草稿、七天排期或评分标准。


            如果后续发生以下实质变化，应在进入制作前按对应方式处理：


