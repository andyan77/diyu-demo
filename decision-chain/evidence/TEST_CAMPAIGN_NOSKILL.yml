            # 序里集 Campaign 最小承接条件夹具 v0.1


            ## 一、文档身份


            本文件为序里集虚构客户 Demo 的最小承接条件输入，全部新增内容统一标记为：


            ```text

            FactStatus：SIMULATED_DEMO_FACT

            ```


            - **适用战役：** “初秋通勤衣橱”第一阶段；

            - **适用阶段：** C5、C6、Campaign Orchestrator Demo、内容侧承接说明和 Demo 流程结果；

            - **确认日期：** 2026-08-20；

            - **确认主体：** Founder；

            - **不是：** 现实企业预约政策、真实历史产能、科学测算结果、CRM 需求、排班系统设计或预约前端方案。


            本文件不得被描述为现实企业已经运行的预约体系。用于客户演示时，必须明确序里集为虚构演示品牌，相关入口、人员、配额和流程均为模拟夹具。


            ## 二、补充前状态


            在本文件由 Founder 确认前，序里集只具备视频号、抖音和企业微信等渠道事实，但没有确认：


            - 正式预约入口；

            - 具体承接人；

            - 替补人员；

            - 两家门店每日接待能力；

            - 预约确认方式。


            因此补充前状态为：


            ```text

            预约承接条件：NOT_READY

            首周核心内容：允许继续发布

            预约型 CTA：不得启用

            ```


            五位 C5 专家对这一缺口的识别保持为原始判断证据，不因本文件后续补充而改写。


            ## 三、Founder 已确认的最小承接条件


            ### 1. 统一正式入口


            ```text

            序里集企业微信官方客服

            ```


            该入口是本次 Demo 唯一正式承接入口。


            - 视频号、抖音等内容发布平台不自动成为预约入口；

            - 评论区、平台私信、个人微信、个人企业微信、门店电话和发布账号均不自动成为预约入口；

            - 所有账号如需引用承接方式，只能引用该统一入口；

            - 不得由不同账号分别留下不同联系人、二维码、口令或接单方式。


            ### 2. 用户正式行动


            用户在已经识别出一个无法仅凭内容解决的具体场景、衣橱问题或适配疑问后，可以：


            > 通过序里集企业微信官方客服，提交到店试穿或搭配咨询申请。


            提交咨询申请不等于预约成功。


            ### 3. 主承接人与替补


            - **主承接人：** 陈晚；

            - **替补：** 第二门店当班负责人。


            第二门店当班负责人：


            - 只作为本次 Demo 的后台运营角色；

            - 不新增姓名；

            - 不建立 IP 账号；

            - 不进入 Matrix；

            - 不因承担替补或门店容量确认而获得内容发布身份。


            发布账号、出镜人、事实确认人、申请承接人和现场服务人员是不同角色，不能自动合并。


            ### 4. Demo 每日确认配额


            | 门店 | Demo 每日最多确认数量 |

            |---|---:|

            | 旗舰店 | 4 组 |

            | 第二门店 | 2 组 |


            以上数字仅为本次 Demo 人为设置的确认上限：


            - 不是现实历史接待量；

            - 不是依据服务时长、人效、客流或排班科学测算的结果；

            - 不得用于宣传企业真实服务能力；

            - 不得解释为稀缺、限量、抢约或制造紧迫感的依据；

            - 不得据此承诺某日一定还有名额。


            ### 5. 最小申请信息


            用户只需提供：


            1. 一个具体穿着、衣橱或适配问题；

            2. 意向门店；

            3. 意向日期或时间范围。


            不得要求用户为了提交申请而填写复杂问卷、上传完整衣橱资料、提供无关身份信息或提交不必要的身体数据。


            企业微信账号本身承担联系路径，不另行要求用户重复提供其他联系方式；如现有工具无法联系，必须由企业另行确认处理方式，不得由内容账号临时收集。


            ## 四、对外状态与确认方式


            本次 Demo 对外只使用两个状态：


            ### 状态一｜已提交，待确认


            适用于：


            - 用户已经通过统一入口提交最小申请信息；

            - 企业尚未完成门店、日期或时段确认；

            - 当前不能称为预约成功。


            ### 状态二｜预约已确认


            只有序里集企业微信官方客服明确回复以下信息后，预约才成立：


            - 已确认门店；

            - 已确认日期或时段；

            - 明确文字“预约已确认”。


            未同时满足上述条件时，状态仍为“已提交，待确认”。


            不得把以下表述当作预约成功：


            - 已收到；

            - 稍后联系；

            - 已转门店；

            - 正在查询；

            - 已登记意向；

            - 请等待回复。


            ## 五、Demo 承接流程


            ```text

            用户通过企业微信官方客服提交申请

            →

            陈晚核对问题、意向门店和意向日期／时间范围

            →

            对应门店核对当日 Demo 确认配额

            →

            企业微信官方客服回复确认门店和日期／时段

            →

            明确写明“预约已确认”

            →

            预约成立

            ```


            第二门店申请由第二门店当班负责人确认本店配额。陈晚不能绕过第二门店确认直接承诺。陈晚无法承接时，由第二门店当班负责人作为已确认替补接管本次
            Demo 申请状态处理。


            当配额无法确认或安排条件不成立时，保持“已提交，待确认”，不得为了演示完整而虚假确认。本文件不预先决定候补、改期、取消或跨店调配规则。


            ## 六、不作出的承诺


            本次 Demo 不承诺：


            - 固定回复时效；

