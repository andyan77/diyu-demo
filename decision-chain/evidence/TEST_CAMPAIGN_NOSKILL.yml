            # C4 Founder 已确认结论 v0.1


            ## 文档身份


            - **状态：** `FOUNDER_CONFIRMED`

            - **确认日期：** 2026-08-20

            - **适用战役：** 序里集“初秋通勤衣橱”第一阶段首个七天

            - **当前问题：** 七天内怎样排序和接力？


            本文件是 C4 唯一可传递给 C5 的正式结论。C4 五位专家原始回答、对抗审查和未采用的条件方案均不得作为 C5 输入。


            ## 一、直接确认结论


            首周采用：


            > **苏禾呈现真实使用摩擦 → 周宁反推选择、比较与排除判断。**


            周宁仍承担本轮主判断链，但不要求第一个发布。首个内容先让问题在真实使用中发生，避免 Campaign 从抽象方法课开始；第二个内容再把已经发生的使用问题转化为顾客能够使用的比较、排除和待验证判断。


            首周默认规模：


            ```text

            2 条主要短视频

            ＋

            最多 1 条轻量澄清

            ```


            - 不覆盖全部六款商品；

            - 不要求三个发布账号全部在首周出现；

            - 不把“最多 3 条主要短视频＋2 条轻量内容”的产能上限当作发布配额；

            - 没有新增问题、新证据或新判断时，默认停止，不补总结和凑数内容。


            两条主要内容依据现有已确认事实预先成立。真实反馈只用于：


            1. 调整第二条主要内容的重点；

            2. 决定是否增加一条轻量澄清；

            3. 判断是否启用林序的条件性备用内容。


            反馈不是两条核心内容继续执行的前提。没有反馈、反馈较少或只有泛化互动时，不得把沉默解释为认同，也不得取消已经由真实事实支撑的核心内容。


            ## 二、七天排序


            ### 第 1 天｜选择证据链并完成事实确认，不发布


            从现有 B01 商品比较和 C01 三组内部演示试穿中，选择一条事实完整、能够形成“使用问题—选择判断”关系的内容链。


            当天完成：


            - 苏禾确认对应试穿过程、调整动作和仍未解决事项；

            - 周宁确认对应商品事实、选品比较及哪些变量可以提前判断；

            - 陈晚只在引用 D01 匿名问题时确认其准确性及公开边界；

            - 林序确认 A01 的可公开边界，并准备一份条件性备用材料；

            - 不预先承诺林序本周发布；

            - 不要求选中的内容覆盖全部六款商品。


            如使用 D01 匿名问题作为生活问题来源，必须与 C01 内部演示试穿明确分开：可以说明“门店曾记录过这一类问题，以下用内部演示进行验证”，不得把匿名顾客和内部试穿人员拼成同一个真实人物。


            ### 第 2—3 天｜苏禾发布第一条主要短视频


            苏禾从已经登记的内部演示试穿出发，呈现：


            > 原先准备怎样穿 → 实际出现什么问题 → 做了什么调整 → 什么得到改善 → 什么仍不能下结论。


            她必须增加真实使用判断，而不是只展示前后画面。内容至少回答：


            - 哪些问题可以通过穿法、层次或组合调整；

            - 哪些只能部分改善；

            - 哪些不能由搭配补救；

            - 哪些事项仍需顾客本人试穿。


            必须明确：


            - 出镜人为序里集 Demo 内部演示试穿人员，不是现实顾客；

            - 单次演示不能推导为某类年龄、职业、身材或身份的普遍结论；

            - 不得把普通调整剪成身体羞辱、惊人改造或虚假成功结局。


            苏禾向周宁交出的未解决问题是：


            > 哪些试穿中暴露的问题，可以在商品选择和组合阶段提前识别；哪些无论如何仍需本人试穿才能判断？


            ### 第 4 天｜观察真实反馈并确认第二条重点


            本日默认不发布补量内容。


            可以用于调整第二条重点的有效反馈，至少应包含以下一项：


            - 一个具体生活场景；

            - 一个明确衣橱问题；

            - 一个比较或排除理由；

            - 一个会改变选择的待试穿变量；

            - 一个与品牌销售意图直接相关的疑问；

            - 一个明确的事实误解。


            以下内容不能单独决定账号接力或改变核心计划：


            - 播放量；

            - 点赞量；

            - 收藏量；

            - 泛化称赞；

            - 单纯商品喜好；

            - 沉默或没有评论。


            少量具体反馈可以用于收窄问题，但不得被描述为目标顾客的代表性结论。最终平台尚未确认，因此不预设某种平台反馈机制或固定反馈数量。


            即使没有有效反馈，周宁第二条主要内容仍继续执行，只依据已经登记的试穿问题、商品比较和选品事实确定重点。


            ### 第 5—6 天｜周宁发布第二条主要短视频


            周宁标明来源后引用苏禾的内部演示试穿观察，并增加试穿前的选择判断：


            - 哪些问题可以在选择阶段提前比较；

            - 哪些候选可以先排除；

            - 哪些条件因试穿观察而需要收窄或修正；

            - 哪些问题本来就不能只凭商品资料关闭；

            - 顾客本人试穿时应继续确认什么。


            周宁不能事后声称已经准确预见全部试穿结果，也不能把苏禾的一手观察改写成自己的亲历。她承担主判断链，是因为本条内容把真实使用问题转化成可以迁移的比较与排除方法，而不是因为她必须最先发布或发布数量最多。


            ### 第 7 天｜默认停止，最多发布一条条件性轻量内容


            两条主要内容完成后默认停止，不发布：


            - 本周总结；

            - 三账号观点合集；

            - Founder 收尾；

            - 六款商品总评；

            - 为下一阶段凑完整感的预告；

            - 与前两条没有新增判断的重复切片。


            只有以下两类情况之一成立时，才增加一条轻量澄清：


            1. 出现明确事实误解，需要根据已确认事实纠正；

            2. 出现一个可由现有事实回答、并会改变顾客判断的新问题。


            轻量内容必须增加新问题、新证据或新判断之一。只增加关系表达、情绪、口吻或行动号召，不构成发布理由。


            ## 三、林序的条件性备用内容


            林序首周默认不发布。第 1 天只完成：


            - A01 原始经营取舍的准确性确认；

            - 可公开范围确认；

            - 可用录音片段或口述要点标记；

            - 一份尚未进入正式制作的轻量备用提纲。


            只有真实反馈明确出现以下品牌销售意图疑问时，才启用林序：


            - “这是不是仍然想让顾客把六件都买齐？”

            - “为什么品牌要公开不适合和未解决事项？”

            - “为什么不直接给出一套统一购买答案？”


            林序只能解释已经登记的 A01 经营取舍：为什么否决“六件必买”，为什么要求说明选择条件和不适合边界。


            不得扩写为：


            - 不追求销量；

            - 宁可放弃利润；

            - 保证顾客少买；

            - 长期反商业立场；

            - 新的服务政策或经营承诺。


            未触发林序发布条件，不等于 C2 失效，也不自动重新打开 C2。林序仍保留本次四周 Campaign 的有限参战身份，只是首周延期。


            ## 四、最低运行版本与产能变化


            首周最低运行版本是：


            ```text

            苏禾 1 条主要短视频

            ＋

            周宁 1 条主要短视频

            ```


            缩减顺序：


            1. 取消轻量澄清；

            2. 不启用林序备用内容；

            3. 放弃六款覆盖和其他第二内容单元；

            4. 只保留一条事实完整的“真实使用摩擦—选择判断”链。


            如果实际素材、人员或产能下降到无法完成上述两条主要内容，说明 C2 已确认的周宁—苏禾核心组合已无法按当前资源成立，应重新打开 C2。不得让一个账号代讲另一个账号的一手事实，也不得把单账号内容伪装成已经完成多账号接力。


            ## 五、事实确认与交接责任


            - 商品登记、选品比较、组合逻辑和比较边界交周宁确认；

            - 内部试穿、搭配调整、陈列变化和使用判断交苏禾确认；

            - 匿名门店问题及其公开边界交陈晚确认；

            - A01 经营取舍及其公开范围交林序确认。


            下一账号只有在能够至少增加新问题、新证据或新判断之一时才接棒。不能增加时直接停止，不为矩阵完整继续发布。


            普通负面评论、事实误解和日常内容调整，由对应负责人在既有事实与权责内处理，不交 Founder。


            只有涉及以下事项时才交 Founder：


            - 正式品牌立场；

            - 需要品牌层面的公开回应；

            - 组织权责；

            - 重大资源投入；

            - 对外承诺。


            因素材、人员或产能变化需要调整本轮参战组合时，重新打开 C2；不因普通执行调整自动升级给 Founder。


            ## 六、适用边界与明确禁止


            本结论只适用于当前“初秋通勤衣橱”第一阶段首个七天及当前模拟资源快照，不是其他 Campaign 的固定账号顺序。


            本题不决定：


            - 最终发布平台；

            - 具体预约入口；

            - 预约承接人员；

            - 门店每日接待能力；

            - 服务确认方式；

            - 具体 CTA；

            - 完整脚本、镜头和成片文案。


            明确禁止：


            - 把“苏禾—周宁”固化为所有 Campaign 的通用顺序；

            - 因苏禾先发而把她升级为主讲或最终商品解释人；

            - 因周宁主讲而要求她必须先发；

            - 把内部演示人员包装成现实顾客；

            - 将 D01 匿名问题与 C01 内部试穿拼成同一个真实人物；

            - 用播放、点赞或泛化评论推断顾客已经形成判断；

            - 为覆盖六款商品而稀释一条完整证据链；

            - 把轻量内容做成主要内容的摘要、重复切片或强 CTA；

            - 为用满产能增加第三条主要内容；

            - 在没有明确品牌销售意图疑问时强行让林序收尾；

            - 在 C5 前承诺预约入口、服务时效、接待能力或结果。


