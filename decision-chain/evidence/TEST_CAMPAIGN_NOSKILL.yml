            ### 使用限制


            - 上述材质、价格、库存和结构仅适用于对应 SKU；

            - 未登记防水、防风、抗皱、保暖、显瘦、耐磨和洗护性能，不得自行补写；

            - 库存数字不得解释为库存压力、稀缺或促销理由；

            - 具体顾客是否适穿，仍需结合本人试穿，不得仅依据身高、年龄或职业直接下结论。


            ## 三、林序现有素材


            ### A01｜一次可公开的品牌经营取舍记录


            ```text

            素材状态：可确认、可公开、可制作

            素材形式：9分钟录音＋会议速记

            持续性：只足够形成一条核心内容或被其他账号引用，不足以单独支撑四周主叙事

            ```


            记录内容：


            - 第一阶段最初有人建议将主题表达为“初秋通勤六件必买”；

            - 林序否决“必买清单”表达，理由是六个品类承担的衣橱任务不同，不能让所有顾客得到同一购买答案；

            - 林序确认本轮可以表达“商品存在适合与不适合”，并要求内容说明选择条件；

            - 林序没有承诺顾客一定少买、没有承诺提高衣橱利用率的具体比例，也没有形成新的售后或服务政策；

            - 该取舍可以解释本轮为什么从顾客真实问题出发，但不能替代具体商品、试穿和服务事实。


            ### 可使用边界


            - 可以作为序里集拒绝“统一必买清单”的经营取舍来源；

            - 不得扩写成“序里集从不追求销量”或“宁可放弃利润”等经营承诺；

            - 不得虚构林序与商品团队发生激烈争执；

            - 涉及具体商品的部分仍由周宁确认。


            ## 四、周宁现有素材


            ### B01｜六款商品进入第一阶段的选品比较表


            ```text

            素材状态：可确认、可公开、可制作

            素材形式：选品表、商品照片、12分钟口述记录

            持续性：能够支撑一条完整主判断链和至少两个独立内容单元

            ```


            已确认比较：


            1. 廓形西装候选中，未选择一款明显收腰、肩部更强调造型的版本；当前 XQ-2501 更适合叠穿衬衫和针织马甲，也更便于覆盖会议与日常移动场景。该记录不代表
            XQ-2501 适合所有身材；肩部结构和长度仍需试穿。

            2. 阔腿裤候选中，未选择一款裤腿更宽、面料光泽更明显的版本；XQ-2502 与西装、衬衫和针织马甲的组合范围更稳定。裤长和腰臀适配不能仅凭内容确认。

            3. 衬衫没有选择高装饰领型，原因是第一阶段需要承担单穿、内搭和轻外套中间层三种任务；这属于商品组合判断，不等于装饰领型本身不好。

            4. 针织马甲被保留为温差和叠穿工具，不被定义为所有顾客必买。袖窿、领口和叠穿后的体积感需要实际比较。

            5. 半裙与轻外套作为裤装之外的生活场景补充，不要求在每套通勤搭配中出现。


            ### B02｜周宁可以负责的专业判断


            - 六款商品分别承担什么衣橱任务；

            - 面对两件相似商品时先比较什么、先排除什么；

            - 哪些结论可以依据登记事实给出；

            - 哪些结论必须保留到真实试穿；

            - 为什么某个商品没有进入本阶段，而不是只讲入选商品的优点。


            ### 可使用边界


            - 可以表达真实选品比较、组合逻辑和限制条件；

            - 不得把商品组合判断写成对所有顾客通用的衣橱公式；

            - 不得推断未登记的功能、质量检测结果和适穿结论；

            - 周宁可参与两次集中拍摄，并能够在发布前确认商品事实和口述稿。


            ## 五、苏禾现有素材


            ### C01｜三组内部演示试穿记录


            ```text

            素材状态：可确认、可公开、可制作

            素材形式：三组内部试穿视频、前后对比照片、搭配记录

            试穿身份：序里集Demo内部试穿人员，不是现实顾客

            持续性：能够支撑两个独立内容单元，并可以验证周宁的部分商品判断

            ```


            #### 试穿记录一｜会议与接送连续场景


            - 使用商品：XQ-2501廓形西装、XQ-2502阔腿裤、XQ-2503衬衫；

            - 初始问题：完整西装＋衬衫组合满足会议场景，但试穿人认为连续穿着时层次偏正式；

            - 调整过程：保留西装和阔腿裤，将衬衫袖口与领口处理得更放松，并比较脱下西装后的单穿效果；

            - 已确认观察：同一组合在正式程度上可以通过穿法调整，但肩部、袖长、裤长仍需本人试穿；

            - 不得扩写为该组合适合所有“职场妈妈”。


            #### 试穿记录二｜办公室温差与多层叠穿


            - 使用商品：XQ-2503衬衫、XQ-2504针织马甲、XQ-2506轻外套；

            - 初始问题：三层同时穿着时，领口、袖窿和下摆容易产生视觉拥挤；

            - 调整过程：比较衬衫全部放下、局部收进下装，以及不同时段减少一层的效果；

            - 已确认观察：马甲是否成立取决于内搭体积、袖窿空间和使用温度，不应作为固定三件套；

            - 未登记保暖温度范围，不得声称适合具体气温。


            #### 试穿记录三｜裤装与半裙的场景切换


            - 使用商品：XQ-2501廓形西装、XQ-2502阔腿裤、XQ-2505半裙；

            - 初始问题：同一件西装在会议、晚间聚会和周末用餐中是否需要不同下装；

            - 调整过程：分别搭配阔腿裤和半裙，比较行动便利、整体正式程度和与已有鞋履的关系；

            - 已确认观察：下装变化可以改变整体关系，但不能脱离顾客已有鞋履、活动强度和个人穿着习惯直接给出统一答案。


            ### C02｜门店陈列调整记录


            - 原陈列按单一品类分区；

            - 苏禾将其中一组调整为“西装＋衬衫／马甲＋裤装／半裙”的生活问题组合；

            - 调整理由是让顾客先看见衣橱关系，而不是把每个品类单独理解；

            - 该记录只有陈列前后照片和苏禾口述，没有顾客停留、成交或转化数据；

            - 不得声称调整后提高了销售或顾客更喜欢。


            ### 可使用边界


            - 可以表达试穿中实际发生的调整、保留和未解决问题；

            - 内部试穿人员可以出镜，但不得包装成现实顾客案例；

            - 可以另行设计“如果你需要同时应对会议和接送”等假设场景，但必须标明为情境演示；

            - 苏禾可参与一次3小时集中拍摄和一次口述补录，并能够确认试穿与搭配判断。


            ## 六、陈晚现有素材


