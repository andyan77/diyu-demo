            \ 时**：逐条回应——接受并改写，或说明为什么不改。改了的部分重新标 `zone`，并检查 `audience_shift` 是否还成立。**如果落点本身要改，那是结构级回退，明写出来，不要塞进句子级修改里。**\n\n\
            完整闭环见下面「合法等价输入与局部回改」一节。\n\n---\n\n## 合法等价输入与局部回改\n\n### 合法等价输入（不要求物理 Brief 存在）\n\n下列任何一种，只要**业务核心语义充分**，都是本 Skill\
            \ 的合法输入：\n\n- **Brief**（完整或最小合法）；\n- **用户直接选题 + 必要事实**；\n- **已选方向**（`accepted_direction`）；\n- **合法历史任务 / 概念 /\
