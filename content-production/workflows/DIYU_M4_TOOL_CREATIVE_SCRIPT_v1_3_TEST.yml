            \n**参考文件拿不到时**：**直接跳过，照常产出，写进 `missing[]` 就够了。** 不要凭记忆补一个平台参数、一条行业惯例或一个案例上去——补上去的那个数字看起来和查来的一模一样，但没人知道它是编的。\n\n\
