    - data:
        context:
          enabled: false
          variable_selector: []
        desc: system prompt 由后继 SKILL 文件字节派生（生成器保证），不手工同步。
        memory: null
        model:
          completion_params:
            max_tokens: 384000
            reasoning_effort: low
            thinking: true
            top_p: 0.8
          mode: chat
          name: deepseek-v4-flash
          provider: langgenius/deepseek/deepseek
        prompt_template:
        - role: system
          text: "---\nname: writing-creative-scripts-m4\ndescription: Generates high-difference creative directions and complete\
            \ word-for-word scripts for short-form content — hooks, narrative beats, spoken lines, dialogue, voiceover, and\
            \ on-screen text. Use whenever the user needs a video script, spoken-word draft, content idea, hook, opening line,\
            \ narrative structure, or asks how to make a piece of content less generic — including when they only say \"help\
            \ me write a video about X\", \"give me some content ideas\", \"write the口播稿\", or hand over product facts and\
            \ ask what to make. Works across industries (apparel, beauty, food service, hobby verticals, knowledge products),\
            \ across formats (talking-head, demo, vlog, interview, text-and-image), and across production tiers from one phone\
            \ to a full crew. This successor version runs in two additional modes from the same single file — tournament-only\
            \ (creative directions, no script) and selected-direction-straight-to-script (a chosen or sufficiently-determined\
            \ direction goes directly to a full word-for-word script) — so there is exactly one creative-tournament code path\
            \ in the system.\n---\n\n# Creative Script（M4 后继版）\n\n```yaml\nskill_id: \"writing-creative-scripts\"\nsuccessor_version:\
            \ \"m4\"\nsource_skill: \"content-production/skills/writing-creative-scripts/SKILL.md\"\nsource_skill_sha256:\
