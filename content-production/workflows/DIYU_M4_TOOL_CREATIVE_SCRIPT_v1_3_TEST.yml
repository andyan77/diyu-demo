            \ <稳定 id>\nsource: CREATIVE_SCRIPT\nhighest_damaged_layer: <被实际破坏的最上游判断层>\nprecise_gap: <具体缺什么。禁写「信息不足」>\naffected_objects:\
            \ <对象1 | 对象2>\nproposed_disposition: ACCEPT_AND_PATCH | REJECT_WITH_AUTHORITY | ESCALATE\nneeds_user_decision:\
            \ true | false\ndownstream_stale: <项1 | 项2>\n---END_M4_RETURNS---\n"
