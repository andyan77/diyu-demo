            7. 逐字稿里有没有输入里不存在的具体事实？\n8. 有没有把两个各自为真的事实连成一个没有来源的关联？有没有编造一次沉默、或给谁补了一个身份？**有没有删掉输入里记录的另一半？**\n9. `explicit_non_promise[]`\
            \ 写了吗？——这条明确不做什么，比它做什么更容易在下游被悄悄补回来\n\n---\n\n## 参考文件\n\n本版**不复制、不新建 `references/`**，引用的是源 Skill 目录下既有的三份文件：\n\n\
