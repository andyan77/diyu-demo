            \n| `cs_run_mode` | 对应入口 | 跑什么 | 输出到哪停 |\n|---|---|---|---|\n| `TOURNAMENT_ONLY` | `ENTRY-04` 直接创意锦标赛 | **只跑 CS-1**（五轴、三轴判据、真实取舍判定）\
            \ | 输出创意方向与推荐，**不写完整脚本**、不写逐字稿、不写开场逐字第一句 |\n| `SELECTED_DIRECTION_TO_SCRIPT` | `ENTRY-05` 直接 Creative Script |\
            \ 已有选定方向，或语义已充分到足以直接推荐一个方向 → **直接产出完整脚本** | 完整逐字稿 + 三区标注 + 两问表 + `fact_refs[].type`；不做分镜、机位、剪辑、标题、封面、发布文案 |\n\
            | `FULL` | 从 Brief 进来的常规路径 | 先 CS-1，再把选中方向深化成脚本 | 同上，另附 CS-1 的方向与选择理由 |\n\n`cs_run_mode` 缺省时的确定性推导（只看输入充分性，**不做意图识别**）：\n\
            \n```text\n已有明确选定方向（accepted_direction 非空）  → SELECTED_DIRECTION_TO_SCRIPT\n否则若存在真实取舍（见 CS-1 判据）          → TOURNAMENT_ONLY\
            \ 或 FULL（按调用方要不要脚本）\n否则                                        → SELECTED_DIRECTION_TO_SCRIPT（直接推荐一个方向，不办锦标赛）\n\
            ```\n\n**系统里只有这一处锦标赛代码路径。**\n\n- 任何「再建一套创意发散 / 候选筛选 / 第二个方向生成器」的做法**一律拒绝**——不新建独立 Skill、不在下游复刻 CS-1、不在包装层或运营层重开一次方向评比。\n\
            - **CS-1 与 Creative Script 之间不得出现两次创意发散、两次候选筛选。** `FULL` 模式下 CS-1 只发散一次；进入脚本阶段是**深化**已选方向，不是重新比一轮。\n- `TOURNAMENT_ONLY`\
            \ 下不得顺手把推荐方向写成脚本；`SELECTED_DIRECTION_TO_SCRIPT` 下不得为了「更严谨」而先补办一场锦标赛。**多做的那一步就是第二套锦标赛。**\n- 三层候选不得混写：**周期策略候选**（M3\
            \ 层，本 Skill 不代做）｜**单条创意候选**（CS-1，本 Skill 负责）｜**包装候选**（PP 层，本 Skill 不代做）。\n\n---\n\n## 输入\n\n**缺了不要卡住，但也不要闷头猜。**\
            \ 三条规则：\n\n1. **对话里被调用** —— 缺\"猜错了整条要重做\"的参数，直接问一句。问一句的成本远低于产出一份作废的稿。\n2. **工作流里被调用**（无人可问）—— 用默认值，并在输出的 `assumptions[]`\
            \ 里写清用了什么默认。\n3. **两种情况都一样** —— 假设必须显式，不能藏在方案里。\n\n| 槽位 | 内容 | 缺了怎么办 |\n|---|---|---|\n| `production_profile`\
            \ | 单人手机／1–2 人／小团队／商业制作 | **问**／默认单人手机 —— 单人手机和商业制作的方案完全不同，猜错整条重做 |\n| `expression_subject` | 五类之一（见下表），含表达条件\
            \ | **问**／默认 `NATURAL_PERSON`，并在 `assumptions[]` 声明 —— 表达主体决定人称、视角和可信度来源 |\n| `content_origin_mode` | 见 CS-6 表\
            \ | **问**／默认现拍 —— 它决定现在能不能写逐字稿，猜错会产出一份到现场作废的稿 |\n| `subject_domain` | 行业／赛道 —— 决定加载 `../writing-creative-scripts/references/industry-conditions.md`\
            \ 的哪一段 | **问**／默认不加载任何行业段落，并声明这是通用处理 |\n| `subject_facts` | 商品／服务／课程的具体参数，或事件的具体经过；**生活类叙事填真实记录（备忘录、日志、对话）** |\
            \ 改从人和场景起手，注明\"无具体标的\" |\n| `real_friction` | 被否决的提议、失败的尝试、一次真实取舍 | 从 `real_quote` 找替代；都没有就明说 |\n| `real_quote`\
            \ | 顾客／员工／学员真说过的话，逐字 | 注明\"无原话可用\"，改用具体场景 |\n| `usage_record` | 试穿／试用／复盘／作业，**含\"改了什么\"** | 只能讲判断，不能讲验证 |\n| `duration_band`\
            \ | 短（≤60s）／长（>60s） | 默认短档 —— 短扩成长容易，反过来难 |\n| `platform` | 抖音／视频号／小红书，或未锁定 | 默认平台中立母版 |\n| `audience_shift` |\
            \ 这条内容要让观众发生什么变化 | 自己拟一条，标注\"待确认\" |\n| `return_from_downstream[]` | 下游发回的回改建议（哪一句／改成什么／为什么） | 无则跳过。**收到时必须逐条回应**：接受并改写、或说明为什么不改。不得沉默\
            \ |\n\n### 表达主体五类\n\n**不要默认有真人。** 先确定是哪一类，五类的事实确认方式和辨识度判据都不同。\n\n| 类型 | 例 | 事实由谁确认 | 辨识度判据 | 不适用的字段 |\n|---|---|---|---|---|\n\
            | `NATURAL_PERSON` 自然人 | 创始人、店员、讲师 | 本人 | 删掉名字后说话方式还认得出吗 | — |\n| `CHARACTER_IP` 角色／IP | 动漫形象、数字人 | **世界观设定**\
            \ | **删掉角色名后，这条还是只有这个 IP 能发吗** | 出镜授权、事实确认人 |\n| `BRAND_VOICE` 品牌口吻 | 官方号、无具体人格 | 事实提供方 | 语气与信息密度可辨识 | 表演指导、出镜条件\
            \ |\n| `OBJECT_LED` 物件主导 | 纯手部、商品自述、过程记录 | 事实提供方 | 手的动作与拍摄视角可辨识 | 面部表演、视线 |\n| `NO_PERSONA` 无主体 | 图集、纯素材剪辑、纯文字卡\
            \ | 事实提供方 | 视觉语言可辨识 | 全部表演相关字段 |\n\n**上游任何一项换了值，这份 Skill 都照常工作。** 不要求上游先定死。\n\n---\n\n## 核心判断\n\n### CS-1 · 创意方向的差异必须是机制差异\n\
            \n**候选数量由「是否存在真实取舍」决定，不固定，不设上下限，不得硬编码。** 不要生成 10 个平庸备选——备选多不等于选择空间大。\n\n五个结构轴：**核心矛盾｜叙事发动机｜人物关系｜信息释放顺序｜视觉前提**\n\
            \n判据：任两个方向必须在五轴中**至少三轴不同**，并逐轴写清怎么不同。\n\n**这条判据本版一字未改。**\n\n**存在真实取舍** ⟺ 至少两个方向在五轴中至少三轴不同 → 给出这些实质不同的方向，逐轴写清差异，并给推荐与推荐理由（指名具体判据）。\n\
            \n**不存在真实取舍 → 直接给推荐，候选数 = 1。这不是缺陷，不得机械凑候选。**\n\n> 凑出来的必然是同义替换——换标题、换语气、换案例，贴上三个不同标签。**凑候选比只给一个候选更不合格**：它把一个方向伪装成三个，用户以为自己在选，其实没有选择空间。候选数=1\
            \ 时，必须写清**为什么不存在真实取舍**（事实只支持一种机制／表达主体只允许一种关系／素材只支持一种信息释放顺序……），这句话本身就是产出的一部分。\n\n**候选在用户选择前不得被确定性抹掉。**\n\n- 未选候选**保留在内部\
            \ Artifact 中**，完整保留其五轴说明、适用条件、代价与失败条件。\n- 投影到用户交付时**可以**只呈现推荐与必要的选择项（用户交付要自然、可用，不是内部结构的转储）；\n- 但**不得从内部记录里剥离**未选候选。「不泄露」不是「少给」——把用户的必要选择和成立条件投影掉，与泄露内部术语是同一级别的错。\n\
            \n**用户已选方向时**：直接进入深化，**不重赛、不强制物理 Brief、不重复索要同意**。普通可逆生成不新增确认闸；用户已明确提出任务时，该意图已覆盖任务范围内必要的可逆生成。\n\n**不构成新方向的变化**（发现即合并）：换标题｜换第一句｜换语气｜换修辞｜换案例｜换平台名｜贴\"\
            故事版·干货版·情绪版\"标签\n\n> **为什么**：模型做发散时最稳定的失败，是产出同一个想法的四种措辞变体，并给它们贴上不同标签。三轴判据是唯一能挡住这件事的机械关卡。\n\n**示例**\n\n> ❌ 方向 A\"\
            讲讲这件西装的面料\"／方向 B\"聊聊这件西装怎么搭\"／方向 C\"这件西装适合什么场合\"\n> ——三个方向的核心矛盾都是\"这件西装好在哪\"，叙事发动机都是罗列，人物关系都是导购对顾客。**同一个方向的三种说法。**\n\
            >\n> ✅ 方向 A：**苏禾按\"衣橱任务\"重排六件，说明为什么给不出统一答案**（核心矛盾＝选择过载／发动机＝重排／关系＝替你做减法）\n> 方向 B：**陈晚复述那句门店原话，苏禾当场试三种解法，两种失败**（核心矛盾＝正式与松弛不可兼得／发动机＝试错过程／关系＝并肩解决）\n\
            > 方向 C：**林序解释他为什么否决\"六件必买\"这个选题**（核心矛盾＝好卖与负责冲突／发动机＝揭秘决策／关系＝创始人自曝）\n> ——三轴以上全不同。\n\n---\n\n### CS-2 · 张力是未完成状态，不是冲突\n\
            \n张力＝**尚未完成的状态**。它**不等于**争吵、高刺激、反转、悬念句式。\n\n**有强张力时，填一个类型**（六选一）：\n\n| 类型 | 什么状态没完成 |\n|---|---|\n| `UNANSWERED`\
            \ 未闭合的问题 | 有人问了，还没答 |\n| `UNSETTLED_DEBT` 未清偿的责任 | 一个旧决定第一次收到账单 |\n| `UNVERIFIED` 未验证的判断 | 试过了，还没定论 |\n| `UNRESOLVED_TRADEOFF`\
            \ 未解决的取舍 | 两边都想要，只能选一边 |\n| `UNRECONCILED` 未和解的矛盾 | 当事人自己也没想明白 |\n| `UNREVEALED` 未揭晓的结果 | 做了，还不知道成不成 |\n\n**没有强张力时，填一条替代的继续消费理由**（五选一）：\n\
            `Utility 有用｜Identity 这说的是我｜Aesthetic 好看｜Humor 好笑｜Information_Value 值得存`\n\n**两个可以并存，不是二选一。** 张力负责让人看完，替代理由负责让人转发或存下来——入口形态含**社交带出型**的平台上（见\
            \ `../writing-creative-scripts/references/platforms.md` 一节），两者管的是不同的事。长内容尤其常见：前半段靠张力，后半段靠信息价值。\n\n**都不填是不允许的。**\
            \ \"没有冲突\"不等于\"没有消费理由\"。\n\n> **为什么**：模型默认给一切内容强加冲突。教程、审美展示、工具型内容被强行编出戏剧张力，观众会觉得用力过猛，而真正的消费理由反而没说出来。\n\n**示例**\n\
            \n> ❌ 「你以为通勤装只能死板？错了！」——给一条本质是穿搭工具的内容强加对立面。\n> ✅ 张力：**无**。替代理由：`Utility`。观众要的是\"明早穿什么\"的可执行答案，看完能直接照做。开场直接给结论：「先说结论，这六件里我只会让你先买两件。」\n\
            > ✅ 张力：`UNRECONCILED`（她自己也没想明白）＋ 替代理由：`Identity`（看的人多半也说过同样的话）。**两个都填**——张力让人看完，Identity 让人愿意转给熟人。\n\n### CS-3\
            \ · 每个主要段落必须至少改变一项状态\n\n八类：**情境｜信息｜理解｜判断｜关系｜风险｜预期｜停驻**\n\n前七类是\"变了什么\"。第八类 `停驻` 是**明确让状态不再往前**——一段静默、一个不给答案的收束、一次刻意的重复。它只在内容本身以\"\
            未完成\"为落点时合法，且**全片最多用一次**；用它必须写清为什么这里不能往前走。\n\n一段话如果八项都没占，删掉它。\n\n**不设固定段落数量。** 短档（≤60s）通常 2–3 段，长档 4–7 段，但以内容需要为准，在输出里声明实际用了几段。\n\
            \n> **为什么**：模型默认写三段式议论文——观众从第二段到第三段身上什么也没变。\"每段至少改变一项状态\"是可判定的，\"写得有逻辑\"不是。\n\n**示例**\n\n> ❌ 第一段\"通勤装要兼顾正式和舒适\"\
            →第二段\"所以选择很重要\"→第三段\"这六件就是为此设计的\"\n> ——观众的情境、信息、理解、判断全程没动过。三段说的是同一句话。\n> ✅ 第一段：**信息**（陈晚那句原话，观众第一次听到有人这样描述自己的困境）→\
            \ 第二段：**判断**（试到第二组才发现问题不在衣服在层数）→ 第三段：**预期**（原以为要买齐六件，结论是先买两件）\n\n---\n\n### CS-4 · 把不可变语义和可变实现分开\n\n信息精确与自然表达冲突时，不是二选一，是**分区**：\n\
            \n三个区，逐段标注：\n\n| 区 | 内容 | 怎么念 | 下游怎么处理 |\n|---|---|---|---|\n| **准确区** | 可核验的事实、数字、承诺、否定 | 逐字，不改 | 需要画面证明 |\n\
            | **发挥区** | 铺垫、连接、转述、举例 | 按本人说话方式自由表达 | 随意 |\n| **主观区** | 本人的感受或判断——**有出处，但不是外部事实**。对应 `fact_refs[].type = SUBJECTIVE`\
            \ | 逐字或改写都行，以自然为准；**措辞可改，理由不可改**。<br>**限定语算\"理由\"，不算\"措辞\"**——「至少在我们自己这一次里」「我试的是我自己身上」这类词**一个字都不能删**：删掉它正是\"升级成结论\"\
            最常走的那一步，而它看起来只是在精简措辞 | **不得用画面强化** |\n\n**主观区为什么单列**：「我到现在也说不清」这类句子有出处（本人说过／写过），按准确区处理会产生\"念自己\"的怪感；更重要的是——**给它配一个\"\
            若有所思\"的镜头，画面会把一个主观判断变成看起来客观的东西**。\n\n**非口播形态下三区的所指要换**：图文里\"念\"变成\"可否被编辑改写\"；动画里角色台词一旦进入分镜和口型就落入准确区，但**理由是制作锁定，不是事实精确**——回改走\
            \ `return_to_script`。\n\n> **为什么**：这是\"单人手机 ＋ 老板本人出镜\"这个最高频档位的核心矛盾——照稿念不自然，放开说会说错事实。分区之后两个问题各解各的。\n\n**示例**\n\n\
            > ✅ **[准确区·逐字]**「这件是聚酯 52、粘胶 28、羊毛 16，1380。」——成分和价格一个字都不能改\n> **[发挥区·自由]** 大意是：**苏禾在三组试穿里的实际观察**——连续穿一天后层次偏正式，脱掉西装单穿也成立。怎么说都行。\n\
            >\n> ⚠️ 注意发挥区说的是**试穿记录里真实发生的事**，不是从成分表推出来的性能结论。「羊毛 16% 所以保暖／不起球」这种推导是 CS-7 禁止的——成分不能直接推性能。\n\n---\n\n### CS-5\
            \ · 口语化不是加语气词\n\n口语感必须来自：**自然长短句｜停顿｜补充｜犹豫｜修正｜现场反应｜具体动作与观察**\n\n**直接淘汰**：\n- 用\"其实／真的／你知道吗／说白了\"冒充口语\n- 模板化句式：\"\
            3 个秘密\"\"90% 的人不知道\"\"看完这条你就懂了\"\n- 书面词进口播：进行、实现、提升、打造、赋能、助力、精准、极致\n\n**示例**\n\n> ❌ 「其实呢，你知道吗，这件西装真的**非常**适合通勤，它能够**有效提升**你的职场形象。」\n\
            > ✅ 「这件我犹豫过。」（停）「肩线偏软，站着好看，坐下会塌。」「但它比同价位的挺括版舒服很多。」——短句、有停顿、有自我修正、给了一个具体观察。\n\n---\n\n### CS-6 · 判断现在到底该不该写逐字稿\n\
            \n**这是写任何东西之前的第一个判断。**\n\n| `content_origin_mode` | 现在能产出 | 现在**不得**产出 |\n|---|---|---|\n| 现拍 | 完整逐字稿 | — |\n\
            | 已有素材剪辑 | 结构 ＋ 选片判据 ＋ 补录清单 | 依赖新拍镜头的段落 |\n| 访谈提取 | 提问清单 ＋ 结构骨架 | 受访者的逐字答案 |\n| 评论回应 | 完整逐字稿 | 编造未发生的追问 |\n| 视觉先行\
            \ | 不超过已有画面信息的表达 | 画面不支持的论断 |\n| AI 生成 | 完整逐字稿 ＋ 画面描述 | 声称是实拍记录的内容 |\n\n**缺镜头 ≠ 去拍。** 已有素材剪辑模式下发现缺一个镜头，正确动作是换一种讲法或列进补录清单，不是假设可以补拍。\n\
            \n**混合来源怎么办**：一条内容可以有多种来源（口播现拍 ＋ 访谈提取，AI 生成 ＋ 已有素材）。这时 `content_origin_mode` 填多个值，**并逐 beat 回答那两个问题**（事实：有／无；素材：已确认／待检索／待产出·可控／待产出·不可控）。不要为了填一个单值而把整条按最宽松的那种处理。\n\
            \n**清单分两种，判据不同**（**现拍模式下同样适用**——记了「后来觉得这个反应不对」却没记「为什么不对」，那就是一个「事实=无」的 beat，人在现场，走 (a)）：\n\n**(a) 有人可问**（访谈提取、评论回应的追问）→\
            \ 提问清单，判据见下\n**(b) 无人可问**（已有素材剪辑、视觉先行、AI 生成）→ **检索判据清单**，规则相反：可以是是非题、可以预设答案（\"3h20m 里有没有大肠清洗的可用帧\"），因为你问的是素材不是人。它要写清：找什么／找到算什么／**找不到时这一段怎么办**。\n\
            \n**提问清单的判据**（仅适用于 (a)）：\n- 每个问题都**不预设答案**——问\"被砍掉最多的是哪一部分\"，不问\"你是不是舍不得那段\"\n- 至少有一个问题**允许对方否定你的前提**——\"有没有哪一次你坚持没砍\"\
            \n- 不问能用是非回答的问题（除非后面紧跟一个\"为什么\"）\n- 数量按内容需要定，但**每一个「事实=无」的 beat 至少要有一个问题指向它**\n- 清单里不得出现任何你希望听到的具体表述\n\n**结构骨架**写的是段落之间的关系（A\
            \ 引出 B、B 被 C 推翻），不是段落内容。答案回来后由 Creative Script 重新调用产出逐字稿——回改建议通过 `return_from_downstream[]` 回到这里。\n\n> **为什么**：模型对任何任务都先写一份稿。对\
            \ vlog、演示、访谈、街采这类表达依赖尚未采集现实的任务，写出的逐字稿等于**凭空捏造还没发生的事**——到现场全部作废。\n\n**示例**\n\n> ❌ 访谈提取模式下写出：「陈晚：'对，我们店里这样的客人特别多，一周能碰到七八个。'」——受访者没说过，数字是编的。\n\
            > ✅ 「**提问清单**：① 这样的客人大概多久遇到一次？② 你当时是怎么问的？③ 有没有哪次你也没给出建议？**结构骨架**：原话 → 追问过程 → 她当时没直接推荐商品这件事本身就是内容。**答案回来后再写逐字稿。**」\n\
            \n---\n\n### CS-7 · 不编造、也不删减输入里的取舍\n\n具体数字、顾客原话、人名、时间、地点、成分比例——**输入里没有就不写**。\n\n缺了就明说缺什么，然后带着缺失继续做。**但\"模糊化\"\
            不等于\"可以编\"**：\n\n- ❌ 「有位顾客说过类似的话」—— 如果这位顾客不存在，这仍然是编造，只是编得含糊\n- ✅ 「**这是一个演示场景，不是真实顾客案例**：假设你遇到的是……」—— 明确标注为假设\n\
            - ✅ 「门店经常被问到的一个问题是……」—— **只有在真有这条记录时**才能这么说\n- ✅ 用「这几款里有一款」代替编一个 SKU 编号 —— 安全，因为\"这几款\"确实存在\n\n**虚构内容怎么办**：原创角色的新台词、新场景**不是编造**——它们由世界观设定确认，`fact_refs[].type`\
            \ 标 `SETTING`。CS-7 管的是**现实层**：制作决策、观众留言、销售数据、真实人物。**两层必须在画面上分层**，否则观众会把创作决策当成剧情。自检第 7 条只查现实层。\n\n**另外五种编造，比编一个假事实更难发现：**\n\
            \n**① 内容未知，不等于可以形容。**\n知道\"那条评论下面有 37 条回复\"，不等于知道里面说了什么。**可以引用它的存在和数量，不得引用、概括或形容它的内容与倾向。**\n> ❌「那条下面吵了三十多条」——\"\
            37\"是事实，\"吵\"不是。\n\n**② 把两个各自为真的事实连起来，如果这个连接本身没有来源，它和编造一个假事实是同一件事。**\n> ❌「我那条视频里给的是三季帐加 400 克睡袋这套」——每个装备参数都来自输入、都是真的，编的是\"\
            这些装备出现在那条视频里\"这个**关联**。\n\n**③ 事实存在，但位置搬错，也是编造。**\n> ❌ 输入里\"上周\"是顾客**去露营的时间**，写成「上周有个粉丝问我」就变成了**提问时间**。词是原文里的词，最难发现。\n\
            \n**④ 编造一次沉默，也是编造。**\n> ❌「他到现在也没再回复」「从来没人问过这个」「我一次也没遇到过」——**否定同样需要来源**。你不知道他有没有回复，就不能说他没回复。\n\n**⑤ 人的属性不能补。**\n\
            身份、职业、性别、经验水平、年龄——输入没写就不写。\n> ❌「一个刚入坑的朋友问我」——\"刚入坑\"是补的。用第二人称\"你\"或直接引用，不要给对方安一个身份。\n\n**⑥ 输入记录了两侧结果的，删掉一侧和编造一侧是同一件事。**\n\
            输入里凡是带「但／仍／另一边／同时」的后半句，**那是这条记录的另一半，不是修饰**。只写前半句，等于替输入宣布了一个它没宣布的结论——**每个字都真，整句是假的**。\n> ❌「改成隔天用、叠上面霜，泛红就没了。」——原记录后面还有「**但去角质感变弱**」。\n\
            > ✅「泛红是没了。但同一条记录里还有后半句：去角质那点效果也变弱了。」\n\n**三条硬禁**：\n> 1. 输入没写明哪一侧更好时，**不得出现比较级评价**——更好／更适合／更值得／最终找到了更好的方案。\n> 2.\
            \ **不得用「解决了」「就没问题了」「既…又…」收束一条输入本身没有收束的记录。**\n> 3. 这种记录出现时，`tension_mode` **只能填 `UNRESOLVED_TRADEOFF` 或 `UNRECONCILED`，不得按\
            \ `UNVERIFIED` 收束**。\n\n**这不是\"一律不下结论\"**：输入已经写明结论的，照常写。**也不许用「因人而异」「看个人选择」糊过去**——要点名是**哪两个具体标准**没能同时满足。\n\n>\
            \ 前五条管的是\"不许加\"。**这一条管的是\"不许删\"，而删掉的那一半永远是让内容变难看的那一半**——所以它比前五条更容易发生，也更难被自己发现。\n\n> **为什么**：这不是合规问题，是生产问题。脚本里写了一个不存在的细节，到拍摄现场才发现，整条作废、人和场地都白约了。**编造的成本发生在最贵的那一步。**\n\
            \n**示例**\n\n> ❌ 「上周有位客人跟我说，她试了三家店都没找到合适的西装。」——输入里只有陈晚记的那一句原话，没有\"三家店\"也没有\"上周\"。\n> ✅ 「陈晚记过一句原话：'上班需要正式，但下班接孩子时不想显得过于用力。'」——原样引用。需要更多细节时，标注\
            \ `[需补充：这位顾客的通勤方式与会议频率]`。\n\n---\n\n## 默认失败模式对照\n\n写完之后逐条自查。这几条是模型不加干预时最常做的事。\n\n| 默认动作 | 对应判断 |\n|---|---|\n\
            | 给出四个方向，其实是一个方向的四种语气 | CS-1 |\n| 给一切内容强加冲突、反转、悬念 | CS-2 |\n| 写成三段式议论文，观众从头到尾没变化 | CS-3 |\n| 堆语气词冒充口语 | CS-5 |\n\
            | 对任何任务都先写逐字稿，包括素材还没采集的任务 | CS-6 |\n| 为了让内容更具体而编造数字和原话 | CS-7 |\n\n---\n\n## 输出\n\n```\ncontent_origin_mode[]\
            \        本条实际用了哪几种来源 —— **必须传给下游。不传，PD 会按现拍处理**\ncreative_directions[]        数量由是否存在真实取舍决定，不固定；每个含五轴说明\n    \
            \                         不存在真实取舍时候选数=1，并写清为什么不存在真实取舍\ncreative_concept             选中的方向 + 为什么选它（指名具体判据，不写\"\
            更抓人\"）\naudience_shift               一句话 —— **原样传给 PD 和 PPA，三段共用一个落点**\n                             后面加括号注明来源：（上游给定）／（本段拟定，待确认）／（从\
            \ X 推断）\ncontent_promise              这条内容承诺兑现什么（下游不得静默改写）\nexplicit_non_promise[]       **这条明确不承诺什么** —— 全链只读继承，任何一段都不得在这里加东西回来\n\
            tension_mode                 六类强张力之一，和／或五类替代理由之一；两个可并存，都不填不允许\nexpression_subject           五类之一 + 为什么是他\nopening\
            \                      开场单元：视频＝前 3 秒画面 ＋ 逐字第一句；图文＝首图 ＋ 首行文字\nscript_beats[]               每段：beat_id | 事实 | 素材\
            \ | state_change | 逐字稿 | zone\n                             zone ∈ 准确区 | 发挥区 | 主观区\n                         \
            \    「事实」「素材」见下方两问表 —— 三份 Skill 共用同一套词\nquestion_list[]              **有「事实=无」的 beat 时必填** —— 每个这样的 beat 至少一个问题\n\
            检索判据清单                  **有「素材=待检索」的单元时必填** —— 找什么／找到算什么／找不到怎么办\nskeleton                     **有「事实=无」的 beat\
            \ 时必填** —— 段落之间的关系，不是段落内容\nvoiceover[]                  画外音，带位置；无则 NOT_APPLICABLE\nscreen_text[]             \
            \   屏幕文字，带位置\nfact_refs[]                  每条事实：内容 | 来源 | **type**（见下表）\nevidence_requirements[]      哪些说法需要画面证明（交给\
            \ Production Director）\nresource_note                谁出镜、需要哪些现在还不存在的素材\nconstraints[]                拍摄／使用禁令（第三方入镜边界、引用授权状态、不得出现的内容）\n\
            failure_case                 会砸的那条方案 ＋ 为什么砸（要看得出机制）\nassumptions[]                用了哪些默认值、作废了哪些不适用的上游输入\nmissing[]\
            \                    还缺什么才能继续（缺就写，不要为此停止产出）\n```\n\n`cs_run_mode = TOURNAMENT_ONLY` 时，只输出：`creative_directions[]`、`creative_concept`（推荐及理由）、`audience_shift`、`content_promise`、`explicit_non_promise[]`、`expression_subject`、`assumptions[]`、`missing[]`。**不输出\
            \ `opening`、`script_beats[]`、`voiceover[]`、`screen_text[]`。**\n\n### 两个问题 —— 三份 Skill 共用\n\n每个 beat（CS）、每个单元（PD）都回答同样两个问题。**不要为每一段发明新的状态词。**\n\
            \n| 问题 | 取值 | 什么意思 |\n|---|---|---|\n| **事实** | `有` | 输入里有支撑这段的事实，现在就能写死 |\n| | `无` | 要等采集回来才知道内容（访谈答案、还没发生的事）\
            \ |\n| **素材** | `已确认` | 看过，确定可用 |\n| | `待检索` | 存在但没人看过（未编目的存量素材）——**这不是\"有\"，检索成本可能高于重拍** |\n| | `待产出·可控` | 自己拍／自己画，能排期\
            \ |\n| | `待产出·不可控` | 等别人或等条件（受访者档期、天气、第三方授权） |\n\n**六种常见组合怎么做：**\n\n| 事实 | 素材 | 现在能产出 | 例 |\n|---|---|---|---|\n\
            | 有 | 待产出·可控 | 完整逐字稿 ＋ 拍摄计划 | 现拍口播 |\n| 有 | 待检索 | 完整逐字稿 ＋ **检索判据清单**，每个证明性单元带降级路径 | 已有素材剪辑 |\n| 有 | 已确认 | 完整逐字稿\
            \ ＋ 直接对应素材 | 二次剪辑、图文 |\n| 无 | 待产出·不可控 | **只出提问清单 ＋ 结构骨架**，不得写对方的话 | 访谈提取 |\n| 部分有 | 混合 | 逐 beat 分别标，**不要按最宽松的那一档处理整条**\
            \ | 口播＋访谈 |\n| 有 | 待产出·可控（但受限） | 逐字稿 ＋ 明写受什么限制 | 户外看天、班底看产能 |\n\n**下游据此推导，不另填状态**：PD 的单元、PP 的模式都从这两问推出来（见各自 SKILL）。\n\
            \n### `fact_refs[].type` —— 下游按类型区别对待\n\n| type | 是什么 | 下游规则 |\n|---|---|---|\n| `EXTERNAL` | **外部核验得了**：数字、成分、价格、公开发表过的话\
