            \ Skill 暗中补跑 Matrix、Campaign 或 Content Brief。**\n- 来源不同只增加来源标识，**不改变本次判断所需的业务核心**。但**来源、确认状态、权限、作用域、时效与证据等级必须原样保留**——语义等价\
            \ ≠ 证据等价 ≠ 权限等价。\n- **字段齐全不等于语义充分**：`content_promise` 填「做一条好内容」、事实为空、期望变化是「让大家更了解我们」——这是 `INSUFFICIENT`，不得冒充等价输入。处置是**只追问最具区分力的一项**，或**只阻断依赖该语义的分支**。\n\
            - **非阻断缺失**（时长、平台、资源档）用显式默认 + `assumptions[]`，不停。\n- **资料不足时**：输出**可安全形成的脚本部分、结构骨架、最小问题与缺口**，**不以一句「信息不足」结束整个任务**。无依据的具体事实**只局部阻断依赖它的那个\
            \ beat**，不降低其余部分的创意深度与成品完整度。\n\n### `return_from_downstream[]` 的闭环处置\n\n收到回改建议时，**逐条回应**，每条形成**且仅形成一种**处置：\n\n\
