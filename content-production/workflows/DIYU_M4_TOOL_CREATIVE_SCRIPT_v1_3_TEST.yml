            \ |\n| **精确升级** | 需要改的是本 Skill 无权改的上层判断（落点、内容承诺、主目标） | 点名**被破坏的最上游判断层**与**具体缺什么**（不写「信息不足」），交回上层裁决 |\n\n硬规则：\n\
            \n- **不得沉默。** 一条建议既没被接受、也没被拒绝、也没升级，等于丢失。\n- **解析失败 ≠ NONE。** 回改内容读不懂、结构坏了、字段对不上时，**保留失败原文并局部阻断依赖该条的部分**，标记为解析失败；**不得伪装成空数组、`NONE`\
            \ 或「无回改」**。其余不依赖该条的部分照常继续。\n- **Return 不自动回环**：收到回改不等于自动重跑上游或重开一次 CS-1。\n- **落点本身要改属结构级回退**：明写出来，**不要塞进句子级修改里**。\n\
            \n### 局部修改只影响真实依赖项\n\n判据是：**被下游实际消费的语义键是否变化，不是正文 hash 是否变化。**\n\n- 只改某一句事实句时，**未依赖该句的 beat、下游制作单元与包装不失效**。\n-\
            \ 排版、措辞、说明文字、重跑但结果未变、用户提出建议但最终没有采纳——**均不触发下游失效**。\n- 正文变了但被下游消费的语义键没变 → **不失效，只更新引用**。\n- 影响关系判断不了的项标 `STALE`\
            \ 待定向复验，**不为求精确假装已知依赖图**，也不为省事让整条链失效。\n\n---\n\n## 与统一能力接缝的对接\n\n本 Skill 在统一能力链里承担**两行**责任（`TOURNAMENT_ONLY` 走上面一行，另两种模式走下面一行）：\n\
            \n| 能力 | 独有输入 | 独有输出 | 独有停止边界 |\n|---|---|---|---|\n| Creative Tournament（CS-1） | 存在真实取舍的创意空间 | 机制上实质不同的方向（五轴至少三轴不同）\
            \ | **只出方向，不出完整脚本** |\n| Creative Script | 已选方向 + 表达主体 + 来源方式 | 完整逐字稿 + 三区标注 + 两问表 + `fact_refs[].type` | **不做分镜、机位、剪辑、标题、封面、发布文案**\
            \ |\n\n这三列**只有本能力能产生**。把本能力的专业产出去掉名称后与任何其他能力互换，下游若仍能正常消费，说明产出被压成了中性字段——那是失败。\n\n**`explicit_non_promise[]` 全链只读继承。**\n\
            \n- 上游给的「明确不承诺」原样往下传，**任何一段都不得往回加东西**。\n- 它不因换入口、换模式、换平台、换标题包装而复活；**标题、默认值、包装、CTA、代码行为、配置、人格**都不算例外。\n- 本 Skill\
            \ 可以**新增**本条内容自己的不承诺项，**不可以删除或弱化继承来的任何一项**。\n\n**`objective.goal_family` 只读继承。**\n\n- 起号 / 吸粉 / 流量 / GMV / 线索\
            \ / 到店及混合目标，**不得被静默改写成长期价值内容**。\n- 目标可以改变选题优先级、钩子强度、节奏、密度、实验比例与 CTA 方向；**不得以目标不同为由旁路、削弱或中性化适用的专业方法**。\n- 本 Skill\
            \ 无权改目标。目标与事实、权限或边界冲突时**只做局部 Return**，不静默改写。\n- 反向也一样：**目标本身不自动授权高风险表达**——流量、起号、GMV 目标不等于授权剧情化、争议、强冲突、激进人设或高风险\
            \ CTA。\n\n**短入口不得丢失当前任务适用的专业方法。**\n\n从 `ENTRY-04` 或 `ENTRY-05` 直接进来，跳过了物理上游组件，**只表示等价输入已经满足**，不表示可以少做判断。以下**照做**，一条都不减：\n\
            \n- CS-1 的**三轴差异判据**（给多个方向时）与「不存在真实取舍就直接推荐」的交代义务；\n- CS-4 的**三区标注**（含限定语一个字都不能删）；\n- **两问表**（每个 beat 的「事实」「素材」两栏）；\n\
            - **`fact_refs[].type` 判定**（含 `KNOWN_UNKNOWN` 压过 `SUBJECTIVE`）；\n- CS-6 的来源模式判断与 CS-7 的全部事实纪律。\n\n**跳过组件不降低事实、权限、风险与必要质量。**\
            \ 反过来，**保护专业价值也不得变成「必须依次调用全部六份 Skill」**——本 Skill 不是必经门，也不要求上游先跑完谁。\n\n---\n\n## 下游失效\n\n**内容承诺、节拍、台词、事实引用、素材需求、表达主体、明确不承诺或生产约束发生实质变化时**，只使**依赖相应单元**的\
            \ PD 计划 / manifest 与 PP 包装失效。\n\n| 变化 | 失效范围 |\n|---|---|\n| 某个 beat 的台词、事实引用或素材需求变了 | 只失效**依赖该 beat** 的 PD 制作单元与\
            \ PP 包装 |\n| `content_promise` 或 `explicit_non_promise[]` 变了 | 失效依赖它的全部下游包装与 CTA 面 |\n| `expression_subject` 变了\
            \ | 失效依赖表达主体的表演指导、人称与包装定位 |\n| 生产约束（`constraints[]`）变了 | 失效依赖该约束的拍摄计划与素材安排 |\n| 排版、措辞、说明文字、重跑但结果未变、建议未被采纳 | **不失效**，不机械重跑整链\
            \ |\n\n规则：\n\n- **判定依据是被下游实际消费的业务含义**（Creative Script 向下暴露的语义：`content_promise` / `explicit_non_promise` / `script_beats`\
            \ / `lines` / `fact_refs` / `asset_needs` / `expression_subject` / `constraints`），**不是正文 hash**。\n- **不影响制作 /\
            \ 包装的文字修正不机械重跑整链。**\n- **改变核心承诺时定向回到 Brief / 创意层**——修复指向最高失效层，不在下游打补丁。\n- **不反向传播**：包装变化不使 Script 失效。\n- **已发布内容保留为历史**，不因上游后来变化而失效或被改写。\n\
            - 影响关系判断不了的项标 `STALE`，待定向复验；不多算、不少算。\n\n---\n\n## 自检\n\n1. 第一句删掉，内容还成立吗？——成立说明第一句是废话\n2. 这条在反对什么，或者在解决什么？——两个都说不出来就是没有落点\n\
