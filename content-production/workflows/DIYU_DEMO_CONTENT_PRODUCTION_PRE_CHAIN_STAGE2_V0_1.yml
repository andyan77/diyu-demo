    - data:
        code: "import hashlib, json\n\ndef main(cs_final: str, cs_hash: str, pd_final: str, pd_hash: str,\n         pd_return_to_script: str, pd_return_to_production: str, pd_advisory_notes: str,\n         stage1_models: str, stage1_run_status: str,\n         content_brief: str, platform: str, cta_contract: str, account_positioning: str,\n         subject_domain: str, duration_band: str, constraints: str, fact_refs: str,\n         example_reference_requested: str) -> dict:\n    req = {\"cs_final\": cs_final, \"cs_hash\": cs_hash, \"pd_final\": pd_final, \"pd_hash\": pd_hash,\n           \"content_brief\": content_brief, \"platform\": platform, \"cta_contract\": cta_contract,\n           \"account_positioning\": account_positioning, \"subject_domain\": subject_domain,\n           \"duration_band\": duration_band, \"constraints\": constraints, \"fact_refs\": fact_refs,\n           \"example_reference_requested\": example_reference_requested}\n    missing = [k for k, v in req.items() if not str(v or \"\").strip()]\n\n    def jarr(s):\n        t = str(s or \"\").strip()\n        if not t:\n            return []\n        try:\n            v = json.loads(t)\n        except Exception:\n            return [\"__PARSE_FAILED__\"]\n        return [str(i) for i in v] if isinstance(v, list) else [\"__PARSE_FAILED__\"]\n\n    rts, rtp = jarr(pd_return_to_script), jarr(pd_return_to_production)\n    adv = jarr(pd_advisory_notes)\n    models, rstatus = jarr(stage1_models), jarr(stage1_run_status)\n    bad = [n for n, a in ((\"pd_return_to_script\", rts), (\"pd_return_to_production\", rtp),\n                          (\"pd_advisory_notes\", adv), (\"stage1_models\", models),\n                          (\"stage1_run_status\", rstatus)) if \"__PARSE_FAILED__\" in a]\n\n    cs_got = hashlib.sha256(str(cs_final or \"\").encode(\"utf-8\")).hexdigest()\n    pd_got = hashlib.sha256(str(pd_final or \"\").encode(\"utf-8\")).hexdigest()\n    cs_ok = cs_got == str(cs_hash or \"\").strip()\n    pd_ok = pd_got == str(pd_hash or \"\").strip()\n    verdicts = [\n        \"creative_script -> publishing_packaging : \" + (\"MATCH\" if cs_ok else \"MISMATCH\")\n        + \" (recomputed \" + cs_got[:16] + \" / expected \" + str(cs_hash or \"\")[:16] + \")\",\n        \"production_director -> publishing_packaging : \" + (\"MATCH\" if pd_ok else \"MISMATCH\")\n        + \" (recomputed \" + pd_got[:16] + \" / expected \" + str(pd_hash or \"\")[:16] + \")\",\n    ]\n\n    notes = []\n    if missing:\n        notes.append(\"缺失输入: \" + \", \".join(missing))\n    if bad:\n        notes.append(\"上游数组解析失败: \" + \", \".join(bad))\n    if not cs_ok:\n        notes.append(\"cs_final 与 cs_hash 不一致\")\n    if not pd_ok:\n        notes.append(\"pd_final 与 pd_hash 不一致\")\n\n    return {\n        \"status\": \"OK\" if not notes else \"INPUT_BLOCKED\",\n        \"missing\": missing,\n        \"note\": \"上游产物与哈希核对通过，九槽位齐备\" if not notes else \"; \".join(notes),\n        \"upstream_handoff\": verdicts,\n        \"pd_return_to_script\": [] if bad else rts,\n        \"pd_return_to_production\": [] if bad else rtp,\n        \"pd_advisory_notes\": [] if bad else adv,\n        \"stage_models\": [] if bad else models,\n        \"stage_run_status\": [] if bad else rstatus,\n    }\n"
        code_language: python3
        desc: 重算 cs_final / pd_final 的 SHA-256 与 Stage 1 交来的哈希比对；不一致即 INPUT_BLOCKED，不调用 PP Tool。
