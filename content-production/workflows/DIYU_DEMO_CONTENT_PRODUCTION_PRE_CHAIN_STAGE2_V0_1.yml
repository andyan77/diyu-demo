    - data:
        code: "def main(pd_rts: list, pd_rtp: list, pd_adv: list,\n         pp_rts: list, pp_rtp: list, pp_adv: list,\n         pp_mode: str, pp_model: str, pp_hash: str, pp_len: str,\n         stage_models: list, stage_run_status: list, upstream_handoff: list) -> dict:\n    def L(x):\n        return [str(i) for i in x] if isinstance(x, list) else ([str(x)] if str(x or \"\").strip() else [])\n\n    # 只有正式数组进 return_to_*；普通备注一律进 advisory_notes，不升格\n    # Stage 1 传来的条目已带来源前缀，原样沿用，不重复打标\n    rts = L(pd_rts) + [\"[publishing_packaging] \" + s for s in L(pp_rts)]\n    rtp = L(pd_rtp) + [\"[publishing_packaging] \" + s for s in L(pp_rtp)]\n    adv = L(pd_adv) + [\"[publishing_packaging] \" + s for s in L(pp_adv)]\n\n    formal = len(rts) + len(rtp)\n    n_adv = len(adv)\n    if formal > 0:\n        status = \"HUMAN_REVIEW_REQUIRED (\" + str(formal) + \" return\"\n        status += (\", \" + str(n_adv) + \" advisory)\") if n_adv else \")\"\n    else:\n        status = \"PRE_PACKAGE_READY_FOR_REVIEW\"\n        if n_adv:\n            status += \" (\" + str(n_adv) + \" advisory)\"\n\n    models = L(stage_models) + [\"publishing_packaging=\" + str(pp_model)]\n    rstat = L(stage_run_status) + [\"publishing_packaging=SUCCEEDED\"]\n    return {\n        \"chain_status\": status,\n        \"return_to_script\": rts,\n        \"return_to_production\": rtp,\n        \"advisory_notes\": adv,\n        \"formal_return_count\": formal,\n        \"advisory_count\": n_adv,\n        \"stage_models\": models,\n        \"stage_run_status\": rstat,\n        \"upstream_handoff\": L(upstream_handoff) +\n            [\"publishing_pre_hash=\" + str(pp_hash) + \" len=\" + str(pp_len)],\n        \"final_present\": \"true\",\n        \"pp_mode\": str(pp_mode or \"\"),\n    }\n"
        code_language: python3
        desc: 只汇总正式回改数组；普通备注一律进 advisory_notes 不升格；chain_status 带计数。本轮不接受、不拒绝、不触发重跑。
