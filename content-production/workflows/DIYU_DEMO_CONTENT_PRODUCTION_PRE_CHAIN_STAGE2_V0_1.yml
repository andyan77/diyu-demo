    - data:
        code: "import hashlib, json\n\ndef main(tool_text: str) -> dict:\n    def blank(gate, note):\n        return {\"artifact\": \"\", \"artifact_hash\": \"\", \"artifact_length\": 0,\n                \"model_used\": \"\", \"reference_projection\": \"\", \"returns_raw\": \"\",\n                \"declared_mode\": \"\", \"return_to_script\": [], \"return_to_production\": [],\n                \"advisory_notes\": [], \"gate\": gate, \"note\": note}\n    try:\n        o = json.loads(tool_text or \"\")\n    except Exception as e:\n        return blank(\"TOOL_FAILED\", \"Tool 返回不是 JSON：\" + str(e)[:150])\n    if not isinstance(o, dict):\n        return blank(\"TOOL_FAILED\", \"Tool 返回不是对象\")\n\n    art = str(o.get(\"final_output\") or \"\")\n    present = str(o.get(\"final_present\", \"\")).strip().lower()\n    if present != \"true\" or not art.strip() or art.strip() == \"MODEL_OUTPUT_NO_FINAL\":\n        return blank(\"TOOL_FAILED\", \"上游 Final 缺失或为空（final_present=\" + present + \"）\")\n\n    h = hashlib.sha256(art.encode(\"utf-8\")).hexdigest()\n    rstat = str(o.get(\"returns_status\", \"\")).strip()\n    base = {\"artifact\": art, \"artifact_hash\": h, \"artifact_length\": len(art),\n            \"model_used\": str(o.get(\"model_used\") or \"\"),\n            \"reference_projection\": str(o.get(\"reference_projection\") or \"\"),\n            \"returns_raw\": str(o.get(\"returns_raw\") or \"\"),\n            \"declared_mode\": str(o.get(\"declared_mode\") or \"\"),\n            \"return_to_script\": [str(x) for x in (o.get(\"return_to_script\") or [])],\n            \"return_to_production\": [str(x) for x in (o.get(\"return_to_production\") or [])],\n            \"advisory_notes\": [str(x) for x in (o.get(\"advisory_notes\") or [])]}\n    if rstat != \"OK\":\n        base[\"gate\"] = \"RETURN_PARSE_FAILED\"\n        base[\"note\"] = \"回改块解析失败：\" + str(o.get(\"returns_parse_note\") or \"\")[:200]\n        # 解析失败绝不当成空数组\n        base[\"return_to_script\"] = []\n        base[\"return_to_production\"] = []\n        base[\"advisory_notes\"] = []\n        return base\n    base[\"gate\"] = \"OK\"\n    base[\"note\"] = \"OK\"\n    return base\n"
        code_language: python3
