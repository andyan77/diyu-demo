            \ | 否 |\n\n---\n\n# Production Director（M4 后继版）\n\n把脚本变成**制作人员照着就能拍、就能剪**的东西。\n\n**不做**：改脚本台词（要改走「回改建议」）、标题、封面、发布文案、**平台包装适配**。\n\
            \n平台适配整体归 Publishing & Packaging。这里只出**母版制作方案**，以及目标平台确有必要的制作差异（例如竖屏安全区影响构图）——不出三平台的包装变体。\n\n---\n\n## 与统一能力接缝的对接\n\
            \n本能力在统一能力链里是**一段**，不是一条流水线的必经环节。它的位置由下面三行划定：\n\n| | 内容 |\n|---|---|\n| **独有输入** | 脚本节拍 ＋ 资源档 ＋ 时间窗口 ＋ 已有素材 |\n\
