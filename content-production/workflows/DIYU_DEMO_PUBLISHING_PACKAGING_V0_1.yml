    - data:
        desc: 确定性查表投影（运行合同 4.1／4.2／4.3）。不使用知识库，不由 LLM 决定加载范围。
        selected: false
        template: '## 参考投影 · platforms.md


          ## 一、入口形态 —— 决定封面和首帧谁承担第一眼


          这一节是**机制判断**，不是可查的数字。判据是「用户是怎么遇到你的」，打开 App 就能自己确认，比数字稳定得多。


          | 平台 | 主要入口 | 谁承担第一眼 | 封面还有什么用 |

          |---|---|---|---|

          | **抖音**（视频） | 单列全屏、自动播放 → **刷到型** | **首帧 ＋ 开头几秒** | 主页九宫格。它决定「点进主页之后看不看下一条」，不决定推荐流里的第一眼
          |

          | **抖音**（长图文） | 同样进单列推荐流，但**不自动翻页**——第一张停在那儿等你划 → **刷到型，第一眼由一张静图承担** | **第一张图**
          | 同上 |

          | **小红书** | 双列瀑布流、必须点开才展开 → **点击型** | **封面 ＋ 标题** | 决定生死。封面不成立，正文写得再好也没人看到
          |

          | **视频号** | 推荐流是单列全屏（刷到型），但「朋友在看／朋友点赞」是**社交带出型** | 分两路：刷到时是首帧；被朋友带出时是**首帧
          ＋ 描述第一行 ＋ 那个朋友的名字** | 低 |


          **视频号那一行是这张表里最容易被忽略的一条**：同一条内容有两个入口，且**社交带出的那一路，观众先看到的是「谁转的」**。这会改变转发语的写法——见
          SKILL.md「作者转发语」。


          > **「好友推荐」是与「算法推荐」并列的独立机制**，有官方级出处：中央网信办《中央网信办持续加强信息推荐算法治理》原文「微信视频号完善『好友推荐』和『算法推荐』双重机制」。`cac.gov.cn/2025-05/22/c_1749536203490537.htm`，发布
          2025-05-22，核对 2026-08-22。

          > **这条出处只证明「两条机制都存在」，不证明好友信号的分发权重**——权重仍未公开，不得据此写任何权重结论。


          ## 四、字数与展示长度 —— Publishing & Packaging 读这一节


          | 平台 | 标题建议长度 | 信息流截断长度 | 单屏字幕字数 | `as_of` | 来源 |

          |---|---|---|---|---|---|

          | **抖音** | ≤15 字 | 未核实 | 未核实 | 2026-06-02 | 色彩韵设计规格文档 |

          | **小红书** | **未核实** ⚠️ | 未核实 | 未核实 | — | — |


          ⚠️ **小红书那一格容易踩的坑**：常查到的「10–15 字」是**封面上压的那行字**的长度，不是**笔记标题**的长度。两者不是一回事——封面文字是你自己排上去的，标题是笔记的标题栏。**这张表问的是标题，所以小红书这一格是「未核实」。**（封面文字
          10–15 字，`as_of` 2026-05-30，色彩韵设计规格文档——它属于封面设计，不属于本节。）

          | **视频号** | 未核实 | 未核实 | 未核实 | — | 官方未公布 |


          **这一节大面积「未核实」是本表当前最大的缺口。**


          **处置方式已经改了。** 这里过去写的是「数值型参数拿不到时给一个保守下限」——**该规则已作废**。

          一个自己填的数字，下游读起来和查证过的数字长得一模一样，会被当成平台规则执行；

          而它一旦进了发布包，没有任何人再回来问它是从哪儿来的。


          **现在的做法**：置 `platform_spec_status = PLATFORM_SPEC_UNVERIFIED`，

          数值型那几项**改写成定性制作要求**，并全部写进 `missing[]`：


          | 拿不到的数值项 | 改写成 |

          |---|---|

          | 标题建议长度 | 保证被信息流截断之后，核心信息仍然在前半句 |

          | 单屏字幕字数 | 一屏只表达一个意思；首屏必须完整可读 |

          | 信息流截断长度 | 关键信息不押在句尾 |


          **不得**产出「标题 ≤15 字」「字幕 ≤12 字」这类自己定的数字。


          若项目方主动选定一个临时工作值，**必须原样写明**：

          「本项目临时制作选择，不是平台已核实规则。」——这句不能省，省了它就变成了伪装成规则的数字。


          **实测方法比查表可靠**：发一条测试内容，截图信息流里的实际显示，量一遍。平台文档常年落后于线上表现。


          ## 五、这张表里没有的东西


          **别在这里找，找不到不是遗漏，是设计如此：**


          - **推荐权重、完播率阈值、流量池分级** —— 这些是平台不公布、第三方互相矛盾、且改得最快的东西。把它们写进表里，等于把三份 Skill
          的判断建在一堆传闻上。

          - **「什么内容在这个平台更容易火」** —— 那是内容判断，在 SKILL.md 里，不在参数表里。

          - **发布时间、话题标签、活动入口** —— 运营动作，不属于这三份 Skill。


          **这张表只回答一个问题：这个平台的物理限制是什么。** 判断留在 SKILL.md，数字留在这里，两者不互相搬家。


          ## 参考投影 · industry-conditions.md（按 subject_domain 精确匹配 → 再按固定行名投影）


          {%- if subject_domain == ''服装 / 门店零售'' -%}

          ## 服装 / 门店零售


          | | |

          |---|---|

          | **哪一类真的带信息** | **只有试穿视频**。棚拍商品图在信息流里和所有服装广告长得一样，基本只能当背景 |

          | **特有淘汰项** | **① 用成分推性能**——"70% 羊毛所以垂感好、不起球"。成分是事实，性能是结论，中间那一步没有来源。要说垂感，只能用试穿时观察到的动作（手一松塌不塌）<br>**②
          无条件推荐**——"必买""闭眼入"<br>**③ 把条件句写成否决句**——"取决于内搭体积"不是"我劝你别买" |

          | **包装差异** | 封面用**穿着状态**不用平铺；在点击型平台上，封面里那件衣服要能一眼看出是什么品类——认不出品类的封面等于没有封面
          |

          {%- elif subject_domain == ''餐饮 / 门店'' -%}

          ## 餐饮 / 门店


          | | |

          |---|---|

          | **哪一类真的带信息** | **备料过程**。成品图是这个行业最没有区分度的素材——所有餐饮内容的成品图都长一样 |

          | **特有淘汰项** | **① 无来源的工艺形容**——"秘制""古法""匠心"<br>**② 把后厨拍干净**——干净到不像在用的后厨反而不可信<br>**③
          用别家的成品图**<br>**④ 把"好吃"当成可证明的事实**——它是 `SUBJECTIVE`，不得用画面强化 |

          | **包装差异** | 首帧用**过程**不用成品；收藏动机来自"我也想试试这个做法"，转发动机来自"带你去吃"——两者的标题写法不同 |

          {%- elif subject_domain == ''知识付费 / 课程'' -%}

          ## 知识付费 / 课程


          | | |

          |---|---|

          | **哪一类真的带信息** | **改稿痕迹本身**——第几版改了什么。这个行业真正的素材是文字，不是画面 |

          | **特有淘汰项** | **① 学员成果当成方法有效的证明**——那是幸存者，不是验证<br>**② 时间承诺**——"三天学会"<br>**③
          把讲师的判断包装成行业共识**<br>**④ 访谈还没做就先写好学员会说什么**——这是最常见也最难发现的一种，因为写出来的稿子看上去完全正常
          |

          | **包装差异** | 长档为主，收藏动机来自**可复用的信息**（"存下来照着做"）｜标题**不能承诺结果，只能承诺方法**——承诺结果就落进上面第②条
          |

          {%- elif subject_domain == ''动漫 / 原创 IP'' -%}

          ## 动漫 / 原创 IP


          | | |

          |---|---|

          | **哪一类真的带信息** | **废弃分镜**。它是这个行业唯一天然带"真实摩擦"的素材——一个被否掉的版本，本身就是一次可展示的取舍 |

          | **特有淘汰项** | **① 两层事实不分层**——设定层的"真"和现实层的"真"必须在画面上分开，否则观众把创作决策当成剧情<br>**②
          用"世界观宏大"代替具体设定**<br>**③ 角色一致性断裂**——同一角色在两个单元里不像同一个人。这是这个行业的头号废片原因，且**在分镜阶段就要设一致性锚点**，不能留到成片才发现
          |

          | **包装差异** | 封面必须出现角色，且是**已定稿的那一版**（用废弃版做封面＝对外承诺了一个不存在的角色）｜转发驱动是"这说的是我"（Identity），不是"有用"（Utility）
          |

          {%- elif subject_domain == ''户外 / 露营（爱好垂类）'' -%}

          ## 户外 / 露营（爱好垂类）


          | | |

          |---|---|

          | **哪一类真的带信息** | **评论区提问**。这个行业大量内容本来就是从别人的问题里长出来的——那是客场，见 PP-5 |

          | **特有淘汰项** | **① 把自己的参数当成对方的答案**——"充绒 400g、舒适温标 −2℃"是我的参数，不是你该带多厚的答案。这是这个行业最高频的一种超额承诺<br>**②
          装备推荐不说使用条件**<br>**③ 把一次好天气的体验当成常态** |

          | **包装差异** | 评论区是主场景，客场情况下置顶要落**两处**（新内容下 ＋ 原提问那条下面）｜必须准备一个诚实的"我答不出"，代答就是编造
          |

          {%- else -%}

          （未匹配到行业。按规则不加载任何行业段落，也不选择「最相近行业」。按通用处理。）

          {%- endif -%}


          ## 参考投影 · examples.md


          （example_reference_requested = {{ example_reference_requested }}；本轮固定 false，examples.md
          未加载，正文亦未嵌入本工作流。）

          '
