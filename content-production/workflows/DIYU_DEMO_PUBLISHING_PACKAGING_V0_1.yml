          text: "---\nname: packaging-content-for-release\ndescription: Builds the\
            \ release package for a finished piece of content — titles, cover, first\
            \ frame, publish copy, caption rules, music and sound placement, comment-section\
            \ design, CTA surfacing, and per-platform adaptation for Douyin, WeChat\
            \ Channels, and Xiaohongshu. Use whenever the user needs a 标题 / 封面 / 首帧\
            \ / 发布文案 / 字幕规则, asks how to publish something on a specific platform,\
            \ wants to know why a piece isn't getting clicks, or asks to adapt one\
            \ piece across platforms — including when they just say \"帮我起个标题\" or\
            \ \"这条发小红书要改什么\". Runs in PRE mode from a script and shot plan, or FINAL\
            \ mode from actual footage.\n---\n\n# Publishing & Packaging\n\n把成片变成**能在平台上打得动的发布包**。\n\
            \n**不做**：重写脚本或分镜（要改走「回改建议」）。\n\n---\n\n## mode 是推出来的，不是填的\n\n**不要先问\"\
            这条算 PRE 还是 FINAL\"。** 按下面三级判据**依次**判断——\n**第一级不成立才看第二级，第二级不成立才是第三级。顺序不可颠倒。**\n\
            \n### 第一级 · PRE\n\n满足**任一**条即为 PRE：\n\n- 没有 beat 级 `realization_manifest`；\n\
            - `content_origin_mode[]` 里还有一种**计划使用的素材尚不存在**（待拍、待画、待生成、待采集），\n  且**没有被正式取消**。\n\
            \n**这一级优先于其他一切 mode 判断。**\n\n### 第二级 · MIXED\n\n已有 beat 级 `realization_manifest`，计划素材均已存在或已正式取消，\n\
            **但任一 beat 的覆盖缺口仍处于下列状态之一**：\n\n- 等待补拍\n- 等待替代素材\n- 等待人工决定\n- 处理方式不明确\n\
            - 尚未完成承诺降档\n\n**只要还剩一个这样的缺口，整条就是 MIXED。**\n\n### 第三级 · FINAL\n\n已有 beat\
            \ 级 `realization_manifest`，计划素材均已存在或已正式取消，并且：\n\n- 所有 beat 的画面支撑都是「有」；**或者**\n\
            - 存在「没有」或「有，但不够」，但**每一处都已经通过删除、替换或降低承诺完成处置**；\n- 没有待补拍、待替换、待人工决定的事项；\n\
            - 最终标题、封面、发布文案与 CTA 都已经按 `realized_payoff` 收敛。\n\n### 最容易判错的一条\n\n> **「有，但不够」本身不决定\
            \ mode。**\n> 决定 mode 的是**这个缺口有没有被处置完** —— 处置完了是 FINAL，还悬着是 MIXED。\n\n\
            同理，**「有覆盖单元」也不等于「已处置」**。一条 beat 可以既在 manifest 里、又留着一个没人拍板的缺口。\n\n**FINAL\
            \ 的 `uncovered_beats[]` 允许非空**，但其中每一项都必须写出**已经完成的处置结果**\n（删掉了什么、换成了什么、承诺降到了哪一档），**不得留下任何\
            \ OPEN 项**。\n一项写不出处置结果，整条就退回 MIXED。\n\n| mode | 能输出 |\n|---|---|\n| **FINAL**\
            \ | **可正式发布**的最终包装 |\n| **MIXED** | 已处置的部分正式，仍悬着的缺口相关产出标草案 |\n| **PRE**\
            \ | 全部标注为草案，**不得声称已验证 `realized_payoff`** |\n\n**为什么看 manifest，不看别的**：`script_beats[]`\
            \ 里的「素材」那一栏是**开拍前写下的计划值**，素材回来之后没有人负责回去改写它。拿计划值判断现实，正是「计划 ≠ 实际」要挡的那件事。manifest\
            \ 不一样——它按定义只在素材回来、并且对上 beat 之后才存在，**它在不在，本身就是答案。**\n\n**这一条同时解决两个麻烦**：单元的「素材」比\
            \ beat 更细时按谁算（不用算，manifest 本来就是 beat 级的）；「待检索」什么时候翻成「已确认」（不用翻，检索完就产出 manifest）。\n\
            \n**混合来源的例外（就是第一级里的第二条，单独讲一遍）**：一条内容同时含\"已有素材检索\"和\"还没拍\"两种来源时，**检索先做完是常态**——那一刻已有素材那几条\
            \ beat 就有了真实的 manifest。**不要据此往下判 MIXED：整条片子一个镜头都还没拍，任何一部分都不能定稿。**\n\n\
            **规则**：`content_origin_mode[]` 里只要还有一种来源的素材**尚不存在**（待拍、待画、待生成、待采集）且**未被正式取消**，**整条走\
            \ PRE**，不看已经检索完了多少。\n\n一句话分辨：**PRE 是\"还没拍完\"；MIXED 是\"拍完了，但还有缺口没人拍板\"\
            ；FINAL 是\"拍完了，缺口也都处置掉了\"。** 检索完成度再高也不改变第一级的判断。\n\n**资产级的清单不是 manifest。**\
            \ 上游只交「拍了 42 分钟」「有 36 张图」，说明它没告诉你哪条 beat 被覆盖——**按\"没有 manifest\"处理，走 PRE**。回退\
            \ Production Director 要 beat 级的，不要自己按分钟数猜。\n\n**\"没有新拍\"不是走 PRE 的理由。**\
            \ 已有素材剪辑模式下素材两个月前就存在，检索完、对上 beat 就是真实的 manifest，往下走第二、三级判——一律降级会把包装上限无谓压低。反过来，**\"\
            素材名义上有\"也不是走 FINAL 的理由**：没检索、没对位，manifest 就不存在。\n\n**MIXED 的处理**：按 manifest\
            \ **覆盖到的部分**归纳 `realized_payoff`，包装上限取它；未覆盖的部分产出的一切标草案，且**不得作为标题或封面的缺口兑现物**。\n\
            \n**FINAL 模式的第一步不是写标题，是归纳 `realized_payoff`：**\n\n1. 读 **beat 级**的 `realization_manifest`——哪条\
            \ beat 由哪段素材覆盖（对位是上游做的，不在这里重做）\n2. 逐条比对 `script_beats[]`：**哪些 beat 在 manifest\
            \ 里没有对应项**——那就是没拍到的\n3. 逐条比对 `fact_refs[]`：**哪些事实真有画面支撑，哪些只剩口说**\n4. 归纳出\
            \ `realized_payoff` = 这条片子**实际兑现了什么**\n5. **然后**才开始做包装，上限是第 4 步的结论\n\n\
            这一步由这份 Skill 负责，不需要额外的环节。跳过它直接写标题，等于对着一个还没看过的片子做承诺。\n\n> **为什么**：拿拍摄计划当现实去写标题，等于对一个还不存在的片子做承诺。关键镜头没拍到，标题就变成了标题党——而你到发布那天才发现。\n\
            \n---\n\n## 输入\n\n**缺了不要卡住，也不要闷头猜。** 对话里被调用就问；工作流里被调用就用默认并在 `assumptions[]`\
            \ 声明。\n\n| 槽位 | 缺了怎么办 |\n|---|---|\n| `script_beats[]` ＋ `content_promise`\
            \ | **无法工作**，回退上游 |\n| `realization_manifest` 或 `realization_plan` | 只有\
            \ `plan`、没有 beat 级 manifest ＝ **第一级 PRE**。有 manifest 时按三级判据往下判，**不是有 manifest\
            \ 就 FINAL**。资产级的清单不算 manifest |\n| `subject_domain` 行业／赛道 | 由上游原样透传。**决定加载\
            \ `references/industry-conditions.md` 的哪一段**——缺了就按通用处理并在 `assumptions[]`\
            \ 声明，**不要挑一个\"最像的\"套上去** |\n| `expression_subject` 五类之一 | **问**／默认从脚本口吻反推，标为推断。不同类型的\"\
            人物一致性\"判据不同 |\n| `audience_shift` | 从 `content_promise` 反推，声明是推断。**三段共用一个落点**\
            \ |\n| `fact_refs[]` | 无来源的事实**不得写进标题和封面**——标题是承诺，承诺不能建在没有出处的说法上 |\n|\
            \ `platform` | **问**／默认出平台中立母版，不出正式平台包装 |\n| `account_positioning` 对标什么类型账号\
            \ | 自选并声明，同时给出\"换一种定位会怎样\" |\n| `cta_contract` 有无 CTA、动作是什么 | 默认无 CTA\
            \ —— **不得自己创造业务动作** |\n| `key_frame` 可截图帧 | 从单元清单里挑一个，标为推断 |\n| `duration_band`\
            \ 短（≤60s）／长（>60s） | **问**／默认短档。长档的完播、收藏、\"会不会存下来\"逻辑与短档完全不同——长档的收藏动机通常来自可复用的信息，短档来自一句能复述的话\
            \ |\n| `explicit_non_promise[]` | 只读继承。**包装阶段是最容易把承诺加回来的地方**——上游明说不给结论，标题就不能暗示有结论\
            \ |\n| `constraints[]` | 只读继承。第三方入镜边界同样约束封面与首帧选帧 |\n| `content_origin_mode[]`\
            \ ＋ `fact_refs[]` | 按 type 区别对待，见下 |\n\n---\n\n## 母版制\n\n**先出一套母版包装，再出平台改写，每一处改动必须写明为了应对该平台的哪个机制。**\n\
            \n没被改的部分＝通用包装能力；被改的部分＝平台知识；改动理由＝判断本身。\n\n**没改的项要写\"不变\"并说明为什么。** 一项\"\
            不变\"都没有＝在为改而改；全都\"不变\"＝没做适配。\n\n平台的具体规格、权重、时长、入口形态**不写在这里**，全部在 `references/platforms.md`，每条带\
            \ `as_of` 与来源。**过期时不得用记忆补。**\n\n**三种拿不到的情况，处置不同：**\n\n| 情况 | 怎么办 |\n|---|---|\n\
            | 平台未锁定 | 只出母版，不出任何平台改写。**这是正常状态，不是缺陷** |\n| 平台锁定了，但 `references/platforms.md`\
            \ 不可得 | **出条件式改写**：「若该平台属于刷到型 → 资源压首帧；若属于点击型 → 资源压封面」。两条分支都写完整，并在 `missing[]`\
            \ 注明定稿前必须查表。**不要交白卷，也不要凭记忆选一支** |\n| 表里有该平台，但条目已过期 | 按上一行处理，并在 `missing[]`\
            \ 写明过期项 |\n\n自检第 5 条（改了几项／不变几项）在第二三种情况下按**条件式改写**计数，不判为\"没做适配\"。\n\n**条件式改写只对\"\
            分支型\"参数有效**（入口形态、封面 vs 首帧的资源分配——它们是两条路，两条都写得完整）。\n**对\"数值型\"参数无效**（单屏字数上限、标题展示长度、图片张数上限——它们是一个数，没有两条分支）。\n\
            \n**数值型拿不到时，不要自己编一个数出来。** 过去这里写的是\"给一个保守下限\"——那条规则已经作废：\n一个自己填的数字，下游读起来和查证过的数字长得一模一样，会被当成平台规则执行。\n\
            \n**正确做法**：置 `platform_spec_status = PLATFORM_SPEC_UNVERIFIED`，\n然后**改用定性的制作要求**把这一项写完整，例如：\n\
            \n- 首屏必须完整可读\n- 一屏只表达一个意思\n- 标题要保证被截断之后核心信息仍在\n- **定稿前在目标平台实测一遍**\n\n\
            **不得**产出「标题 ≤15 字」「字幕 ≤12 字」这类自己定的数字。\n定性要求不是留空——它同样告诉下游\"这一项要做\"，只是不假装知道那个数。\n\
            \n若项目方主动选定一个临时工作值，**必须原样写明**：\n「本项目临时制作选择，不是平台已核实规则。」——这句话不能省，省了就变成了伪装成规则的数字。\n\
            \n**结构级参数要提前问**（图文的图片张数上限决定 beat 拆几段）——它影响的不是包装而是内容结构。这一项 Creative Script\
            \ 也读 `references/platforms.md`；到了这里才发现超出上限，是回退上游改结构，不是在这里删图。\n\n---\n\n\
            ## 核心判断\n\n### PP-1 · 标题不是摘要\n\n**摘要让人觉得\"我已经知道了\"，标题要让人觉得\"我还差一点\"。**\n\
            \n**候选数由可用的入口类型数决定，不是先定一个数再凑。** 每种可用类型至少出一个，每个标明是哪一种：\n\n| 入口类型 | 承诺的是\
            \ |\n|---|---|\n| `INFORMATION` 信息 | 你会**得到**一条信息 |\n| `RESULT` 结果 | 你会**得到**一个结果\
            \ |\n| `IDENTITY` 身份 | 你会**得到**一个归属 |\n| `CONTRADICTION` 矛盾 | 你会**得到**一个矛盾的解\
            \ |\n| **`SITUATION` 情境** | 你会**看到**一个场景 |\n| **`QUOTABLE_LINE` 金句** |\
            \ 你会**看到**一句话 |\n\n前四类都预设**正文有可带走物**。判据是这个，不是\"有没有结论\"——**两者会分家**：一条明说不给结论的内容，可以有很实在的可带走物（三个要你自己填的格子、一次改动的完整经过）。这时前四类仍然合法。\n\
            \n**真正不合法的情况是：正文没有任何可带走物。** 这时用前四类构成超额承诺——观众看完发现手上什么都没有。\n\n**怎么判**：把正文能给的东西写成一句「看完你会拿到\
            \ ____」。填不出来的，只有后两类合法。\n\n**同义替换不构成新的标题家族。** 三个候选如果入口类型相同，等于只有一个候选。\n\n\
            **所以没有结论的内容只出两个候选是正常的**——可用类型只剩后两类，硬凑第三个必然是同义替换，凑出来反而不合格。**类型有几种，候选就是几个。**\n\
            \n推荐理由**必须指名正文的哪一处**，不得写\"更抓人\"\"更有网感\"。\n\n**示例**\n\n> ❌ 「初秋通勤六件单品搭配分享」——看完标题就不用看了，是摘要。\n\
            > ❌ 三个候选：「通勤六件」「秋季通勤必备六件」「初秋通勤六件推荐」——同义替换，只有一个候选。\n> ✅ `CONTRADICTION`「多穿一层就挤，挤的不是衣服」\n\
            > `QUOTABLE_LINE`「'上班要正式，接孩子不想太用力'」\n> `IDENTITY`「一周开三次会以上的看这条」\n> 推荐第一个，理由：**正文第\
            \ 2 段给出了挤在哪三处，且画面上手真的碰到了那三处**——标题的缺口在正文有对应兑现。\n>\n> ⚠️ 推荐理由必须指名**输入里真实存在的**兑现处。如果输入只记了\"\
            马甲成立与否取决于内搭体积和袖窿空间\"（条件句），就不能写成\"我劝你别买\"（否决句）——那是 CS-7 意义上的编造，而且编在标题上代价最大。\n\
            \n---\n\n### PP-2 · 标题、封面、首帧不得三处重复\n\n三者关系只能是：**互补｜证明｜分工** —— 明确标出用的是哪一种。\n\
            \n**首帧和封面不是同一件事**，即使某些平台上它们看起来是同一张图。判断依据是**这个平台的用户是怎么遇到你的**：\n\n| 用户遇到你的方式\
            \ | 谁承担第一眼 | 封面的作用 |\n|---|---|---|\n| 刷到，不用点就在播 | **首帧 ＋ 开头几秒** | 低 |\n\
            | 必须先点才播 | **封面 ＋ 标题** | 决定生死 |\n| 朋友点赞／转发后带出 | 看带出的是首帧还是封面 | 取决于入口形态\
            \ |\n\n**哪个平台属于哪一种，查 `references/platforms.md`**（每条带 `as_of` 与来源）。平台入口形态会变，正文不写死具体平台的结论。\n\
            \n封面文字层级：\n- 第一行是缺口那句，字号明显大\n- 第二行是限定条件（谁看、什么场合），小\n- 文字不压脸、不压主体动作\n-\
            \ **行数按缩略图尺寸定**——在实际展示尺寸下读不出来的字，等于没写\n\n**示例**\n\n> ❌ 标题「三层同穿，挤在这三处」＋\
            \ 封面大字「挤在三处」＋ 首帧同一画面\n> ——三处说同一句话，浪费了两个入口。\n> ✅ 标题给**缺口**（是哪三处）｜封面给**情境**（穿着三层的实拍\
            \ ＋ 小字\"初秋通勤\"）｜首帧给**证明**（手停在领口那一处，还没动）\n\n### PP-3 · 包装的承诺上限取实际成片\n\n\
            `single_distribution_promise ≤ realized_payoff`\n\n**不得**为了让包装成立而修改上游的\
            \ `content_promise`。发现成片弱于原承诺时：\n\n1. `realized_payoff` 记录实际兑现了什么\n2.\
