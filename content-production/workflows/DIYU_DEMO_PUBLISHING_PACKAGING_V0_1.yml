            ## 原 Content Brief


            {{#1788000000001.content_brief#}}


            ---


            按 Publishing & Packaging 的输出契约产出。


            **`mode` 由你自行推导，并写出推导依据**——依据只看上游交没交来 beat 级 `realization_manifest`，以及
            `content_origin_mode[]` 里是否还有来源的素材尚不存在。**不要因为本提示词提到某个值就填某个值。**

            推导出什么就写什么；如果推导结果不是 PRE，照实写出实际值和依据，不要改成 PRE。


            ---


            ## 输出格式补充要求（只规定末尾附加块，不改变以上任何判断和产出内容）


            完整产出结束之后，**另起一行**，追加下面这个结构块，供下游确定性读取：


            ---RETURNS---

            mode: <只写你在上文自行推导出的那个值本身，不写解释、不写引号>

            return_to_script: <见下方规则；无则写 NONE>

            return_to_production: <见下方规则；无则写 NONE>

            advisory_notes: <见下方规则；无则写 NONE>


            填写规则：


            - `---RETURNS---` 这一行原样照抄，只出现一次，且必须排在全部产出之后。

            - 上列标签**必须全部出现、各占一行、顺序不变**；标签名原样小写，不加粗、不加编号、不改写、不翻译。

            - 有内容时：每条独占一行，以 `- ` 开头，写在该标签的下一行起。

            - 确实没有时：在该标签的冒号后写 `NONE`，**不得省略整行标签**。

            - `return_to_script` / `return_to_production` 只放**正式回改项**——必须由上游改动才能解决的问题。可选的、仅供参考的、不改也能交付的，一律放
            `advisory_notes`，不要升格成回改。

            - **`return_to_script` 与 `return_to_production` 都需要你真正判断**——你在 Creative
            Script 与 Production Director 的下游，两者都是你的上游，都可以退回。

            - 本块之后不再输出任何内容。

            - `mode` 一行只写值本身；推导过程和依据仍写在上面的正文里，不要搬进本块。**本块不得改变你在正文里推导出的结论**：正文推导出什么，这里就写什么。


            ---


            ## 追加输出块 —— 用户交付块


            > **本节取代上一节末尾「本块之后不再输出任何内容」这一句。** 输出顺序改为固定三段：

            > **① 完整产出 → ② 用户交付块 → ③ `---RETURNS---` 块**。这三段之外不再输出任何内容。


            在完整产出结束之后、`---RETURNS---` 之前，另起一行，原样追加下面这个块。


            **这个块是给真实执行人员看的**，只回答一件事：**下一步具体做什么**。写作规则：


            - **只保留最终采用的那一个版本。** 不写候选方案、不写推演过程、不写淘汰了什么、不写失败示范或错误示范。

            - **不出现内部字段名**（`assumptions`、`missing`、`question_list`、`failure_case`、`evidence_requirements`
            等），也不出现「再判一次」「修正后」「我认为上一版」这类自我讨论。

            - **每一项都必须能在你上面的完整产出里找到对应。** 本块不得新增上面没有的事实，不得把假设写成已经发生的事实，不得写未核实的平台数字，不得虚构顾客、员工或内部讨论原话。

            - 用大白话写给人看，直接可执行。

            - 没有内容的字段写 `无`，**不得省略整行标签**。

            - 标签名原样小写照抄、各占一行、顺序不变。

            - 下面模板里的**开始标记行**和**结束标记行**原样照抄，各只出现一次、必须成对闭合。**不要把本节这几行说明抄进产出。**


            ---USER_DELIVERY_PP---

            status: PRE 或 MIXED 或 FINAL 三选一

            recommended_title: 唯一推荐标题，只写一个

            cover: 封面怎么做

            first_frame: 首帧怎么做

            final_publish_copy: 唯一发布文案定稿，只写一份

            subtitle_and_sound: 字幕与声音要求

            comment_and_interaction: 评论区与互动怎么接

            cta: 本条的 CTA。上游定的是无 CTA 就写「无 CTA」，不得自己造一个业务动作

            pre_release_check: 发布前要逐项确认的事

            remaining_blockers: 还需要由人拍板才能发布的事项，逐条列出；没有就写 无

            ---END_USER_DELIVERY_PP---


            **`status` 与正文里的 `mode` 是同一件事，必须写成同一个值**，用同一套词：`PRE` / `MIXED` / `FINAL`。不得写
            `PRE_DRAFT`、`FINAL_READY`、`NEEDS_DECISION` 之类的另一套词，也不得因为有待拍板事项就改动 `status`——**需要人拍板的事一律写进
            `remaining_blockers`**。

            '
