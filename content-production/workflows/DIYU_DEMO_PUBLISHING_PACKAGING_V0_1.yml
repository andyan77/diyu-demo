    - data:
        code: "def _core(final_text: str) -> dict:\n    MARK = \"---RETURNS---\"\n\
          \    LABELS = [\"mode\", \"return_to_script\", \"return_to_production\"\
          , \"advisory_notes\"]\n    REQUIRED = [\"mode\", \"return_to_script\", \"\
          return_to_production\", \"advisory_notes\"]\n    REQUIRE_MODE = True\n \
          \   KNOWN_MODES = [\"PRE\", \"MIXED\", \"FINAL\"]\n\n    def blank():\n\
          \        return {\"artifact\": \"\", \"returns_raw\": \"\", \"returns_status\"\
          : \"RETURN_PARSE_FAILED\",\n                \"parse_note\": \"\", \"declared_mode\"\
          : \"NOT_APPLICABLE\",\n                \"return_to_script\": [], \"return_to_production\"\
          : [], \"advisory_notes\": []}\n\n    text = final_text or \"\"\n    if MARK\
          \ not in text:\n        r = blank()\n        r[\"artifact\"] = text.strip()\n\
          \        r[\"parse_note\"] = \"未找到 \" + MARK + \" 标记\"\n        return r\n\
          \n    head, tail = text.rsplit(MARK, 1)\n    artifact = head.rstrip()\n\
          \    while artifact.endswith(\"-\") or artifact.endswith(\"*\"):\n     \
          \   artifact = artifact[:-1].rstrip()\n    raw = tail.strip()\n\n    def\
          \ norm(s):\n        t = s.replace(\"*\", \"\").replace(\"`\", \"\").replace(\"\
          #\", \"\").strip()\n        while t[:1] in (\"-\", \"+\", \">\"):\n    \
          \        t = t[1:].strip()\n        return t\n\n    buckets = {}\n    cur\
          \ = None\n    for line in raw.split(\"\\n\"):\n        n = norm(line)\n\
          \        low = n.lower()\n        hit = None\n        for lb in LABELS:\n\
          \            if low.startswith(lb + \":\") or low.startswith(lb + \"\\uff1a\"\
          ) or low == lb:\n                hit = lb\n                break\n     \
          \   if hit is not None:\n            cur = hit\n            if hit not in\
          \ buckets:\n                buckets[hit] = []\n            rest = \"\"\n\
          \            for sep in (\":\", \"\\uff1a\"):\n                if sep in\
          \ n:\n                    rest = n.split(sep, 1)[1].strip()\n          \
          \          break\n            if rest:\n                buckets[hit].append(rest)\n\
          \        elif cur is not None:\n            s = line.strip()\n         \
          \   if s:\n                buckets[cur].append(s)\n\n    missing = [lb for\
          \ lb in REQUIRED if lb not in buckets]\n\n    def items(lb):\n        out\
          \ = []\n        for v in (buckets.get(lb) or []):\n            t = v.strip()\n\
          \            while t[:1] in (\"-\", \"*\", \"+\", \"\\u2022\"):\n      \
          \          t = t[1:].strip()\n            i = 0\n            while i < len(t)\
          \ and t[i].isdigit():\n                i += 1\n            if 0 < i < len(t)\
          \ and t[i] in (\".\", \")\", \"\\u3001\"):\n                t = t[i + 1:].strip()\n\
          \            t = t.strip().strip(\"<>\").strip()\n            if not t:\n\
          \                continue\n            if t.upper().rstrip(\".\\u3002\"\
          ) in (\"NONE\", \"\\u65e0\"):\n                continue\n            out.append(t)\n\
          \        return out\n\n    r = blank()\n    r[\"artifact\"] = artifact\n\
          \    r[\"returns_raw\"] = raw\n    r[\"return_to_script\"] = items(\"return_to_script\"\
          )\n    r[\"return_to_production\"] = items(\"return_to_production\")\n \
          \   r[\"advisory_notes\"] = items(\"advisory_notes\")\n\n    mode_items\
          \ = items(\"mode\")\n    if REQUIRE_MODE:\n        if not mode_items:\n\
          \            r[\"declared_mode\"] = \"\"\n        else:\n            line\
          \ = mode_items[0]\n            up = line.upper()\n            pos = [(up.find(k),\
          \ k) for k in KNOWN_MODES if up.find(k) >= 0]\n            # 命中已知枚举就取最先出现的那个；一个都不命中就原样保留模型写的值，不代它归一\n\
          \            r[\"declared_mode\"] = sorted(pos)[0][1] if pos else line[:80]\n\
          \    else:\n        r[\"declared_mode\"] = \"NOT_APPLICABLE\"\n\n    notes\
          \ = []\n    if missing:\n        notes.append(\"缺少标签: \" + \",\".join(missing))\n\
          \    if REQUIRE_MODE and not r[\"declared_mode\"]:\n        notes.append(\"\
          mode 行存在但取不出值\")\n    if notes:\n        r[\"returns_status\"] = \"RETURN_PARSE_FAILED\"\
          \n        r[\"parse_note\"] = \"; \".join(notes)\n    else:\n        r[\"\
          returns_status\"] = \"OK\"\n        r[\"parse_note\"] = \"OK\"\n    return\
          \ r\n\n\ndef main(final_text: str) -> dict:\n    \"\"\"先按标记摘出用户交付块，再把剩下的正文交给原有的\
          \ ---RETURNS--- 切分。\"\"\"\n    t = final_text or \"\"\n    DOPEN = \"---USER_DELIVERY_PP---\"\
          \n    DCLOSE = \"---END_USER_DELIVERY_PP---\"\n\n    def split_delivery(t):\n\
          \        \"\"\"按标记确定性摘出交付块并把它从正文里移除。无 LLM 参与；\n        缺失 / 重复 / 未闭合 / 为空\
          \ 一律返回 USER_DELIVERY_PARSE_FAILED，正文原样不动。\"\"\"\n        no = t.count(DOPEN)\n\
          \        nc = t.count(DCLOSE)\n        if no == 0 and nc == 0:\n       \
          \     return t, \"\", \"USER_DELIVERY_PARSE_FAILED\", \"缺少 \" + DOPEN\n\
          \        if no != 1 or nc != 1:\n            return t, \"\", \"USER_DELIVERY_PARSE_FAILED\"\
          , \"标记不是各一次：开始 %d 次 / 结束 %d 次\" % (no, nc)\n        i = t.find(DOPEN)\n\
          \        j = t.find(DCLOSE)\n        if j < i:\n            return t, \"\
          \", \"USER_DELIVERY_PARSE_FAILED\", \"结束标记出现在开始标记之前\"\n        body = t[i\
          \ + len(DOPEN):j].strip()\n        if not body:\n            return t, \"\
          \", \"USER_DELIVERY_PARSE_FAILED\", \"交付块内容为空\"\n        rest = t[:i].rstrip()\
          \ + \"\\n\\n\" + t[j + len(DCLOSE):].lstrip()\n        return rest, body,\
          \ \"OK\", \"OK\"\n\n    rest, body, st, note = split_delivery(t)\n    r\
          \ = _core(rest)\n    r[\"user_delivery\"] = body\n    r[\"user_delivery_status\"\
          ] = st\n    r[\"user_delivery_note\"] = note\n    return r\n"
