        code: "def main(final_text: str) -> dict:\n    MARK = \"---RETURNS---\"\n    LABELS = [\"mode\", \"return_to_script\", \"return_to_production\", \"advisory_notes\"]\n    REQUIRED = [\"return_to_script\", \"return_to_production\", \"advisory_notes\"]\n    REQUIRE_MODE = False\n    KNOWN_MODES = [\"PRE\", \"MIXED\", \"FINAL\"]\n\n    def blank():\n        return {\"artifact\": \"\", \"returns_raw\": \"\", \"returns_status\": \"RETURN_PARSE_FAILED\",\n                \"parse_note\": \"\", \"declared_mode\": \"NOT_APPLICABLE\",\n                \"return_to_script\": [], \"return_to_production\": [], \"advisory_notes\": []}\n\n    text = final_text or \"\"\n    if MARK not in text:\n        r = blank()\n        r[\"artifact\"] = text.strip()\n        r[\"parse_note\"] = \"未找到 \" + MARK + \" 标记\"\n        return r\n\n    head, tail = text.rsplit(MARK, 1)\n    artifact = head.rstrip()\n    while artifact.endswith(\"-\") or artifact.endswith(\"*\"):\n        artifact = artifact[:-1].rstrip()\n    raw = tail.strip()\n\n    def norm(s):\n        t = s.replace(\"*\", \"\").replace(\"`\", \"\").replace(\"#\", \"\").strip()\n        while t[:1] in (\"-\", \"+\", \">\"):\n            t = t[1:].strip()\n        return t\n\n    buckets = {}\n    cur = None\n    for line in raw.split(\"\\n\"):\n        n = norm(line)\n        low = n.lower()\n        hit = None\n        for lb in LABELS:\n            if low.startswith(lb + \":\") or low.startswith(lb + \"\\uff1a\") or low == lb:\n                hit = lb\n                break\n        if hit is not None:\n            cur = hit\n            if hit not in buckets:\n                buckets[hit] = []\n            rest = \"\"\n            for sep in (\":\", \"\\uff1a\"):\n                if sep in n:\n                    rest = n.split(sep, 1)[1].strip()\n                    break\n            if rest:\n                buckets[hit].append(rest)\n        elif cur is not None:\n            s = line.strip()\n            if s:\n                buckets[cur].append(s)\n\n    missing = [lb for lb in REQUIRED if lb not in buckets]\n\n    def items(lb):\n        out = []\n        for v in (buckets.get(lb) or []):\n            t = v.strip()\n            while t[:1] in (\"-\", \"*\", \"+\", \"\\u2022\"):\n                t = t[1:].strip()\n            i = 0\n            while i < len(t) and t[i].isdigit():\n                i += 1\n            if 0 < i < len(t) and t[i] in (\".\", \")\", \"\\u3001\"):\n                t = t[i + 1:].strip()\n            t = t.strip().strip(\"<>\").strip()\n            if not t:\n                continue\n            if t.upper().rstrip(\".\\u3002\") in (\"NONE\", \"\\u65e0\"):\n                continue\n            out.append(t)\n        return out\n\n    r = blank()\n    r[\"artifact\"] = artifact\n    r[\"returns_raw\"] = raw\n    r[\"return_to_script\"] = items(\"return_to_script\")\n    r[\"return_to_production\"] = items(\"return_to_production\")\n    r[\"advisory_notes\"] = items(\"advisory_notes\")\n\n    mode_items = items(\"mode\")\n    if REQUIRE_MODE:\n        if not mode_items:\n            r[\"declared_mode\"] = \"\"\n        else:\n            line = mode_items[0]\n            up = line.upper()\n            pos = [(up.find(k), k) for k in KNOWN_MODES if up.find(k) >= 0]\n            # 命中已知枚举就取最先出现的那个；一个都不命中就原样保留模型写的值，不代它归一\n            r[\"declared_mode\"] = sorted(pos)[0][1] if pos else line[:80]\n    else:\n        r[\"declared_mode\"] = \"NOT_APPLICABLE\"\n\n    notes = []\n    if missing:\n        notes.append(\"缺少标签: \" + \",\".join(missing))\n    if REQUIRE_MODE and not r[\"declared_mode\"]:\n        notes.append(\"mode 行存在但取不出值\")\n    if notes:\n        r[\"returns_status\"] = \"RETURN_PARSE_FAILED\"\n        r[\"parse_note\"] = \"; \".join(notes)\n    else:\n        r[\"returns_status\"] = \"OK\"\n        r[\"parse_note\"] = \"OK\"\n    return r\n"
        code_language: python3
        desc: 确定性字符串切分：把正文与 ---RETURNS--- 块分开，并解析三/四个固定标签。无 LLM 参与；缺标签返回 RETURN_PARSE_FAILED，不当成空数组。
        outputs:
          advisory_notes:
            children: null
            type: array[string]
          artifact:
            children: null
            type: string
          declared_mode:
            children: null
            type: string
          parse_note:
            children: null
            type: string
          return_to_production:
            children: null
            type: array[string]
          return_to_script:
            children: null
            type: array[string]
          returns_raw:
            children: null
            type: string
          returns_status:
            children: null
            type: string
        selected: false
        title: Returns Adapter
        type: code
        variables:
        - value_selector:
          - final_extract
          - output
          variable: final_text
