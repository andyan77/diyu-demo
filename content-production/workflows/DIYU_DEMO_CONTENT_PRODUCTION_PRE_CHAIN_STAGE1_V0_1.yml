    - data:
        code: "import hashlib\n\ndef main(bound_text: str, expected_hash: str) -> dict:\n    b = str(bound_text or \"\")\n    got = hashlib.sha256(b.encode(\"utf-8\")).hexdigest()\n    exp = str(expected_hash or \"\").strip()\n    ok = (got == exp and exp != \"\")\n    return {\"bound_hash\": got, \"bound_length\": len(b),\n            \"verdict\": \"MATCH\" if ok else \"MISMATCH\",\n            \"note\": (\"父流绑定文本哈希与上游产物一致\" if ok\n                     else \"父流绑定文本哈希与上游产物不一致 got=\" + got[:16] + \" exp=\" + exp[:16])}\n"
        code_language: python3
