    - data:
        code: "import json\n\ndef main(cs_hash: str, cs_len: str, cs_model: str, cs_proj: str,\n         cs_rts: list, cs_rtp: list, cs_adv: str,\n         pd_hash: str, pd_len: str, pd_model: str, pd_proj: str,\n         pd_rts: list, pd_rtp: list, pd_adv: str,\n         handoff_verdict: str) -> dict:\n    def arr(x):\n        if isinstance(x, list):\n            return [str(i) for i in x]\n        s = str(x or \"\").strip()\n        if not s:\n            return []\n        try:\n            v = json.loads(s)\n            return [str(i) for i in v] if isinstance(v, list) else [s]\n        except Exception:\n            return [s]\n    cs_a, pd_a = arr(cs_adv), arr(pd_adv)\n    adv = [\"[creative_script] \" + x for x in cs_a] + [\"[production_director] \" + x for x in pd_a]\n    rts = [\"[production_director] \" + str(x) for x in arr(pd_rts)]\n    rtp = [\"[production_director] \" + str(x) for x in arr(pd_rtp)]\n    # CS 是链条起点，其 return_to_* 若非空要如实带出（正常应为空）\n    rts = [\"[creative_script] \" + str(x) for x in arr(cs_rts)] + rts\n    rtp = [\"[creative_script] \" + str(x) for x in arr(cs_rtp)] + rtp\n    stage_models = [\"creative_script=\" + str(cs_model), \"production_director=\" + str(pd_model)]\n    stage_status = [\"creative_script=SUCCEEDED\", \"production_director=SUCCEEDED\"]\n    return {\n        \"stage1_status\": \"STAGE1_OK_PENDING_STAGE2\",\n        \"return_to_script\": rts,\n        \"return_to_production\": rtp,\n        \"advisory_notes\": adv,\n        \"stage_models\": stage_models,\n        \"stage_run_status\": stage_status,\n        \"handoff_report\": [\"cs_final -> production_director : \" + str(handoff_verdict)],\n        \"hash_report\": [\"creative_script_hash=\" + str(cs_hash) + \" len=\" + str(cs_len),\n                        \"production_plan_hash=\" + str(pd_hash) + \" len=\" + str(pd_len)],\n        \"projection_report\": [\"creative_script: \" + str(cs_proj)[:1200],\n                              \"production_director: \" + str(pd_proj)[:1200]],\n    }\n"
