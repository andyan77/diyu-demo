    - data:
        code: "import hashlib\n\nREQUIRED = [\"content_brief\", \"production_profile\", \"expression_subject\", \"content_origin_mode\",\n            \"subject_domain\", \"duration_band\", \"platform\", \"cta_contract\",\n            \"account_positioning\", \"constraints\", \"available_assets\", \"fact_refs\",\n            \"example_reference_requested\"]\n\ndef main(content_brief: str, production_profile: str, expression_subject: str,\n         content_origin_mode: str, subject_domain: str, duration_band: str,\n         platform: str, cta_contract: str, account_positioning: str, constraints: str,\n         available_assets: str, fact_refs: str, example_reference_requested: str) -> dict:\n    slots = {\n        \"content_brief\": content_brief, \"production_profile\": production_profile,\n        \"expression_subject\": expression_subject, \"content_origin_mode\": content_origin_mode,\n        \"subject_domain\": subject_domain, \"duration_band\": duration_band,\n        \"platform\": platform, \"cta_contract\": cta_contract,\n        \"account_positioning\": account_positioning, \"constraints\": constraints,\n        \"available_assets\": available_assets, \"fact_refs\": fact_refs,\n        \"example_reference_requested\": example_reference_requested,\n    }\n    missing = [k for k in REQUIRED if not str(slots.get(k) or \"\").strip()]\n    ok = not missing\n    return {\n        \"status\": \"OK\" if ok else \"INPUT_BLOCKED\",\n        \"missing\": missing,\n        \"note\": \"九槽位与链路输入齐备\" if ok else (\"缺失输入: \" + \", \".join(missing)),\n        \"brief_hash\": hashlib.sha256(str(content_brief or \"\").encode(\"utf-8\")).hexdigest(),\n        \"brief_length\": len(str(content_brief or \"\")),\n    }\n"
        code_language: python3
        desc: 确定性必填校验，缺任一项即 INPUT_BLOCKED，不进入任何 Tool 调用。
