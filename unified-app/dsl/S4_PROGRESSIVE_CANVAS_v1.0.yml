          \            # 当成用户说过的话复述出来，是 CE-A2 那一类缺陷的新触发口（CAPABILITY_LABEL_ZH/\n  \
          \          # BLOCK_REASON_LABEL_ZH 已经在处理这一类问题，这里补上第三处遗漏）。\n            if\
