          \ CTA 在讨论时才登记缺口——没有话题就没有\"缺信息\"可言。经营\n    # 目标/承接路径缺一，只暂停 CTA 这一个分支（不是整任务拒绝），且用户已表示这个阶段\n\
          \    # 不要 CTA 时不必追问这两项（不打算做就不用先备齐材料）。\n    #\n    # **对抗式审查发现的真实缺口，已修复**：授权缺口此前和\
          \ no_cta_requested 共用同一个\n    # 判断分支，导致\"用户说了不要 CTA，之后又在同一/后续轮次真的提到一个具体高风险动作\"\
          \n    # 时，授权检查被 no_cta_requested 短路跳过——一个仍然真实存在、尚未获得授权的高风险\n    # 目标就这样从缺口清单和对话提醒里同时消失。这不是\"\
          要不要主动建议 CTA\"的开关能覆盖\n    # 的范围：授权是安全门槛，不是建议开关，必须独立判断、不受 no_cta_requested\
          \ 影响。\n    # 同时补上\"层级是 HIGH_RISK 但没有具体目标\"本身也是缺口——一个连目标都不清楚的高\n    # 风险动作，结构上不可能满足\"\
          作用域明确\"的授权前提，不能因为没有 target 就悄悄放行。\n    cta = snapshot.get(\"cta_context\"\
          ) or {}\n    cta_tier = cta.get(\"risk_tier\", \"UNSTATED\")\n    if cta_tier\
          \ in (\"BUSINESS_CONVERSION\", \"HIGH_RISK\") and not cta.get(\"no_cta_requested\"\
          ):\n        if not cta.get(\"conversion_goal_text\"):\n            gaps.append({\"\
          field_ref\": \"cta_context.conversion_goal_text\", \"status\": \"MISSING\"\
          , \"degraded_to\": None})\n        if not cta.get(\"access_path_text\"):\n\
          \            gaps.append({\"field_ref\": \"cta_context.access_path_text\"\
          , \"status\": \"MISSING\", \"degraded_to\": None})\n    if cta_tier == \"\
          HIGH_RISK\":\n        target = cta.get(\"target_text\")\n        if not\
          \ target:\n            gaps.append({\"field_ref\": \"cta_context.target_text\"\
          , \"status\": \"MISSING\", \"degraded_to\": None})\n        elif target\
          \ not in (cta.get(\"authorized_high_risk_targets\") or []):\n          \
          \  gaps.append({\"field_ref\": \"cta_context.authorization\", \"status\"\
          : \"MISSING\", \"degraded_to\": None})\n    # **已知限制，如实登记（对抗式审查指出，本批不做结构性修复）**：risk_tier\
          \ 是单值、\n    # 逐轮由模型现判现写，target_text 也是单值覆盖——如果某一轮模型把 risk_tier 判成\n    #\
          \ LOW_RISK/BUSINESS_CONVERSION（哪怕 target_text 实际还是同一个客观上高风险的动作，\n    # 只是这一轮分类判轻了），上面这条\
          \ HIGH_RISK 专属的授权缺口会跟着消失，不会有\n    # \"曾经是 HIGH_RISK、现在被降级但目标没变\"这种更细的追踪。要正确处理需要把风险层级\n\
          \    # 按目标分别记录（而不是一个全局单值），是真正的结构调整，不在本批范围内。\n\n    return gaps\n\n\n# block_reason\
          \ → 当轮真正在阻塞该能力的字段。用于把\"真正阻塞的一项\"从\"带着继续跑的缺口\"里\n# 分出来（共享合同一 §五）。只是一张常量映射，不是新算的分数。\n\
          BLOCK_REASON_BLOCKING_FIELD_REFS = {\n    \"NO_CURRENT_TASK_STATED\": [\"\
          current_task.text\"],\n    \"NO_TASK_OR_GOAL_STATED\": [\"current_task.text\"\
          , \"goal_structure.primary_goal\"],\n}\n\n\ndef _capability_input_status(snap,\
          \ cap_id):\n    \"\"\"对照该能力的\"必需业务输入\"判定 DIRECT_ENTRY_ELIGIBLE / DEGRADED_INPUT\
          \ / BLOCKED。\n\n    v0.1 只实现判据里最核心、可从当前扁平快照直接判断的部分（有无当前任务描述、\n    有无主目标）；更细的必需输入项（如\
          \ Matrix 的六类企业/组织事实）快照里还没有专门\n    字段承载，如实标记为 DEGRADED_INPUT 并在 block_reason\
          \ 里说明缺什么，不假装已满足。\n    \"\"\"\n    has_task = bool(snap[\"current_task\"\
          ][\"text\"])\n    has_goal = bool(snap[\"goal_structure\"][\"primary_goal\"\
          ])\n\n    if cap_id == \"MATRIX\":\n        # Matrix 六类必需输入里，快照目前只能判断\"\
          是否涉及长期定位/账号结构\"这一条件本身\n        # 是否成立；其余五类（企业事实/组织事实/账号责任卡数量等）本设计尚未采集专门字段。\n\
          \        if not has_task:\n            return \"BLOCKED\", \"NO_CURRENT_TASK_STATED\"\
          \n        return \"DEGRADED_INPUT\", \"MATRIX_REQUIRES_SIX_INPUT_CATEGORIES_SNAPSHOT_ONLY_HAS_TASK_TEXT\"\
