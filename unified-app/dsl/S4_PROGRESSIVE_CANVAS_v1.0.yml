          \ = {}\n    needed = list(requested_capabilities or [])\n\n    for cap_id\
          \ in CAPABILITIES:\n        status, reason = _capability_input_status(snap,\
          \ cap_id)\n        per_capability[cap_id] = {\n            \"status\": status,\n\
          \            \"reachable_if_requested\": status != \"BLOCKED\",\n      \
          \      \"block_reason\": reason if status == \"BLOCKED\" else None,\n  \
          \          \"known_limitation\": \"此判定不代表主 Chatflow 的既有线性锁(v1_state.UPSTREAM_OF)会放行；\"\
          \n            \"M1 候选环境不经过该锁，锁的解除暂定为 M4 施工范围。\"\n            if cap_id in\
          \ (\"CAMPAIGN\", \"CONTENT_BRIEF\")\n            else None,\n        }\n\
          \n    for cap_id in NO_ENTRY_CAPABILITIES:\n        per_capability[cap_id]\
          \ = {\n            \"status\": \"BLOCKED\",\n            \"reachable_if_requested\"\
          : False,\n            \"block_reason\": \"NO_PHYSICAL_ENTRY_YET\",\n   \
          \         \"known_limitation\": None,\n        }\n\n    open_now = [t for\
          \ t in snap[\"open_threads\"] if t.get(\"status\") == \"OPEN\"]\n\n    #\
          \ 共享合同一 §五「只追问真正阻塞当前任务的一项，其余作为缺口继续运行」的机制化落地。\n    # 阻塞集合是本轮**全部**被请求且判定为\
          \ BLOCKED 的能力的阻塞字段并集（B-4 修复前只可能\n    # 有一项被请求，并集退化成单项，行为不变；现在可能有多项同时被请求并同时\
          \ BLOCKED）。\n    blocking_field_refs = set()\n    for cap_id in needed:\n\
          \        requested_info = per_capability.get(cap_id)\n        if requested_info\
          \ and requested_info[\"status\"] == \"BLOCKED\":\n            blocking_field_refs\
          \ |= set(BLOCK_REASON_BLOCKING_FIELD_REFS.get(requested_info[\"block_reason\"\
          ], []))\n\n    # gaps 正常由 main() 在合并后、调用本函数前重算写入；若调用方喂来的快照没有该键，\n    # 这里自行重算而不是退化成空列表——空列表会被读成\"\
          查过了，没有缺口\"，那是不实主张。\n    # fallback 用 include_structural=False，与 main() 实际持久化的口径一致：\n\
          \    # non_blocking_gaps 是调用路由信号，不是审计副本，9 条恒定常量不必塞进每轮 call_intent。\n   \
          \ gaps = snap[\"gaps\"] if isinstance(snap.get(\"gaps\"), list) else _compute_gaps(snap,\
          \ include_structural=False)\n    # 只放 field_ref 字符串，完整对象留在 snapshot.gaps，避免\
          \ call_intent 膨胀。\n    non_blocking_gaps = [g[\"field_ref\"] for g in gaps\
          \ if g[\"field_ref\"] not in blocking_field_refs]\n\n    return {\n    \
          \    \"needed_capabilities\": needed,\n        \"per_capability\": per_capability,\n\
          \        \"continuation\": {\n            \"open_threads_to_surface\": [t[\"\
          id\"] for t in open_now[:1]],\n            \"non_blocking_gaps\": non_blocking_gaps,\n\
          \        },\n    }\n\n\ndef _dialogue_directive(snap, patch_ok, reject_reason,\
          \ call_intent, requested_capabilities,\n                        current_route_intent=None,\
          \ changed=False, cancel_effect=None,\n                        material_present=False,\
          \ cta_authorization_signal_this_turn=\"NONE\"):\n    \"\"\"给对话 LLM 的确定性指令，不让模型自己判断状态或编造原因（继承\
          \ A-4 纪律）。\n\n    current_route_intent：**本轮 patch 里的原始 route_intent**，不是\
          \ snap[\"last_route_intent\"]。\n    后者是跨轮持久化的\"最后一次\"，只读它会让一次取消表达在之后每一轮都被误判成\"\
          还在撤销中\"。\n    patch 未通过时调用方传 None（那种轮次本来就没有可信的本轮意图）。\n\n    changed：**调用方传入的实为\
          \ _merge_patch 返回的 content_changed，不是它返回的 changed**\n    （对抗式审查发现的真实问题：早期版本直接传\
          \ changed，会把\"仅仅是某条 open_thread 被标记\n    HANDLED\"也算作\"有内容变化\"，导致用户说\"这件事不用管了\"\
