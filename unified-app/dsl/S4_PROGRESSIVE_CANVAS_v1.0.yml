          nFor every proposed task ask:\\n\\n- What unique business job does it perform?\\\
          n- What changes if it is removed?\\n- Is another task interchangeable with\
          \ it?\\n- Is production supported now?\\n- Which observation can change\
          \ the next decision?\\n\\nDelete or merge tasks that make no difference\
          \ under the frozen objective.\\n\\n## 7. Continuity obligation\\n\\nRecompute\
          \ continuity from evidence; do not persist a permanent \\u201caudience promise\
          \ state.\\u201d Evidence can include:\\n\\n- an unclosed public forward\
          \ promise;\\n- current column-specific requests or reliance;\\n- current\
          \ business paths that depend on the column.\\n\\nInsufficient alone:\\n\\\
          n- historic frequency;\\n- historic performance;\\n- operator attachment;\\\
          n- a stale comment without current relevance.\\n\\nActions:\\n\\n- **Shrink**:\
          \ reduce frequency or scope while keeping the value path intact.\\n- **Pause**:\
          \ stop temporarily and preserve recoverability; communicate only when an\
