    - data:
        code: "\"\"\"\nM1 任务上下文编译器 · 确定性状态节点\ntask_id: DIYU-V1-M1-NATURAL-CONTEXT-001\n\
          \n设计参照: decision-chain/docs/V1_M1_TASK_CONTEXT_COMPILER_DESIGN_v0.1.md\n\
          \n本文件是独立开发/测试用源码，最终以字符串形式嵌入 Dify Code 节点（code_language: python3）。\nDify\
