    - data:
        code: "\nimport json\nimport re\n\n# M4 冻结的六项能力。这份清单不是本节点的产品判断，是最终 FP Seam\
          \ 的入参约束\n# （capability 必须是六项之一），照抄。\nCAP6 = [\"MATRIX\", \"CAMPAIGN\", \"\
          CONTENT_BRIEF\", \"CREATIVE_SCRIPT\",\n        \"PRODUCTION_DIRECTOR\",\
          \ \"PUBLISHING_PACKAGING\"]\n\n# M1 把它标成 BLOCKED / NO_PHYSICAL_ENTRY_YET，那是\
          \ M1 施工当时的**环境事实**：\n# 那时候没有 M3 应用可调。现在有了（最终 FP M3）。物理入口存不存在属于路由层的\n# 事实，不属于产品语义，所以在这里由统一\
          \ Canvas 认定，不回头改 M1 源码。\nOPERATION = \"SINGLE_ACCOUNT_OPERATION\"\n\n\n\
          # 经营动作分类由 uapp_action 给出。它不产出任务上下文、不做专业判断——\n# 「本轮要做哪一类持久化动作」是路由责任，合同明写路由责任在统一\
          \ Canvas。\nWRITE_ACTIONS = (\"RECORD_PUBLISH\", \"RECORD_FEEDBACK\", \"\
          NEXT_CYCLE\", \"WITHDRAW_MATERIAL\")\n\n\ndef _salvage_action(text):\n \
          \   \"\"\"结构化输出被 <think> 之类的前言打断时，从原文里把那一个 JSON 对象捞回来。\n\n    这不是\"再判断一次\"\
          ——判断已经由模型做完了，只是载体被污染。捞不回来就返回空，\n    由调用方按 NONE 处理：宁可漏记，不可记下没发生的事。\n    \"\
          \"\"\n    t = text or \"\"\n    if \"</think>\" in t:\n        t = t.split(\"\
          </think>\")[-1]\n    i = t.find(\"{\")\n    while i != -1:\n        depth,\
          \ j, instr, esc = 0, i, False, False\n        while j < len(t):\n      \
          \      ch = t[j]\n            if instr:\n                if esc:\n     \
          \               esc = False\n                elif ch == \"\\\\\":\n    \
          \                esc = True\n                elif ch == '\"':\n        \
          \            instr = False\n            elif ch == '\"':\n             \
          \   instr = True\n            elif ch == \"{\":\n                depth +=\
          \ 1\n            elif ch == \"}\":\n                depth -= 1\n       \
          \         if depth == 0:\n                    try:\n                   \
          \     got = json.loads(t[i:j + 1])\n                        if isinstance(got,\
          \ dict) and \"action\" in got:\n                            return got\n\
          \                    except Exception:\n                        pass\n \
          \                   break\n            j += 1\n        i = t.find(\"{\"\
          , i + 1)\n    return {}\n\n\ndef main(call_intent_json, snapshot_json, user_query,\
          \ ws_id, conv_id, action_patch=None,\n         action_text=\"\"):\n    try:\n\
          \        ci = json.loads(call_intent_json or \"{}\")\n    except Exception:\n\
          \        ci = {}\n    try:\n        snap = json.loads(snapshot_json or \"\
          {}\")\n    except Exception:\n        snap = {}\n\n    needed = ci.get(\"\
          needed_capabilities\") or []\n    if not isinstance(needed, list):\n   \
          \     needed = []\n\n    # 保序取第一个落在六项之内的能力。M1 已经排好序，这里不重新排序、不加权、\n    #\
          \ 不\"挑更合适的那个\"——那是替用户做选择。\n    picked = \"\"\n    for c in needed:\n   \
          \     if c in CAP6:\n            picked = c\n            break\n\n    wants_operation\
          \ = OPERATION in needed\n\n    task_text = ((snap.get(\"current_task\")\
          \ or {}).get(\"text\")) or \"\"\n    user_request = (user_query or \"\"\
          ).strip()\n    if task_text and task_text.strip() not in user_request:\n\
          \        user_request = user_request + \"\\n\\n【本任务已登记的诉求】\" + task_text\n\
          \n    ap = action_patch if isinstance(action_patch, dict) else {}\n    action_source\
          \ = \"structured_output\"\n    if not ap.get(\"action\"):\n        ap =\
          \ _salvage_action(action_text) or ap\n        action_source = \"salvaged_from_text\"\
          \ if ap.get(\"action\") else \"none\"\n    action = ap.get(\"action\") or\
          \ \"NONE\"\n    if action not in (\"NONE\", \"ASK_STATUS\") + WRITE_ACTIONS:\n\
          \        action = \"NONE\"          # 未知取值一律退回 NONE：宁可漏记，不可记下没发生的事\n\n \
          \   # ---- 意图桥接 ----\n    # M1 的 needed_capabilities 是「用户点名了哪个」的登记表，不是意图分类器：\n\
          \    # 实测「有个账号一直没流量，怎么办」→ needed_capabilities=[]，\n    # 而同一份 per_capability\
          \ 里六项全是 reachable_if_requested=true。\n    # M1 做的正是它被接受时的设计，问题在**没人把自然语言桥到能力上**。\n\
          \    # 桥在这里搭，不回头改 M1。\n    intent = (ap.get(\"intent\") or \"\").strip().upper()\n\
          \    if intent not in CAP6 + [OPERATION, \"WRITEBACK_OR_STATUS\", \"AMBIGUOUS\"\
          , \"CHITCHAT\"]:\n        intent = \"\"\n    # 「分诊台判了闲聊」和「分诊台压根没给出东西」是两回事，不许静默混成一个。\n\
          \    # 实测截断时 structured_output 全 null，看上去和判了闲聊一模一样，\n    # 而后者是正确分类、前者是分类失败——混同会让失败面在证据里隐身。\n\
          \    triage_failed = \"true\" if (not intent and not ap.get(\"action\"))\
          \ else \"false\"\n    decisive_q = (ap.get(\"decisive_question_text\") or\
          \ \"\").strip()\n\n    # 优先级即可信度顺序：用户点了名 > 已发生的事要登记 > 分诊台判的意图 > 兜底闲聊。\n\
          \    # 用户点名永远压过分诊台——那是替用户改主意，不是路由。\n    intent_source = \"m1_named\" if\
          \ picked else \"none\"\n    if picked:\n        mode = \"CAPABILITY\"\n\
          \    elif action in WRITE_ACTIONS:\n        mode = \"WRITEBACK\"\n    elif\
          \ action == \"ASK_STATUS\":\n        mode = \"STATUS\"\n    elif intent\
          \ in CAP6:\n        picked = intent\n        mode = \"CAPABILITY\"\n   \
          \     intent_source = \"canvas_triage\"\n    elif intent == OPERATION or\
          \ wants_operation:\n        mode = \"OPERATION_ONLY\"\n        intent_source\
          \ = \"m1_named\" if wants_operation else \"canvas_triage\"\n    elif intent\
          \ == \"AMBIGUOUS\" and decisive_q:\n        # 确有能力歧义才走这条。只问一个问题，且问题由本层给出——\n\
          \        # 不交给 M1 的对话节点，那个节点实测会自行加问到三件事（TD-UAPP-03）。\n        mode = \"\
          ASK_ONE\"\n        intent_source = \"canvas_triage\"\n    else:\n      \
          \  mode = \"DIALOGUE\"\n\n    # 进业务链 = 需要读 M2 当前投影。纯聊天不进，省一整条链。\n    runs_business\
          \ = mode != \"DIALOGUE\"\n    # M3 是运营判断层：要产出、要复盘、要开下一周期时才需要它。\n    # 单纯问\"\
          系统现在记住了什么\"不需要 M3——那是 M2 的事实，不是判断。\n    # 撤回是针对某一份具体素材的持久化动作，M3 手上没有素材事实。\n\
          \    # 让它判，它会诚实地说\"查不到这份素材\"，而画布随后仍按会话变量照常撤回——\n    # 两句都不假，拼在一起却是自相矛盾的交付（WITHDRAW-01\
          \ 实测）。所以撤回轮不进 M3。\n    runs_m3 = (mode in (\"CAPABILITY\", \"OPERATION_ONLY\"\
          )\n               or (mode == \"WRITEBACK\" and action != \"WITHDRAW_MATERIAL\"\
          ))\n\n    # 会话级测试域标签。同一会话稳定，跨会话不同——测试数据因此天然按会话隔离。\n    tag = re.sub(r\"\
          [^0-9a-zA-Z]\", \"\", str(conv_id or \"\"))[:12] or \"nosession\"\n\n  \
          \  return {\n        \"tag\": tag,\n        \"action_source\": action_source,\n\
          \        \"route_mode\": mode,\n        \"action\": action,\n        \"\
          has_capability\": \"true\" if mode == \"CAPABILITY\" else \"false\",\n \
          \       \"runs_business\": \"true\" if runs_business else \"false\",\n \
          \       \"runs_m3\": \"true\" if runs_m3 else \"false\",\n        \"platform_text\"\
          : ap.get(\"platform_text\") or \"\",\n        \"external_ref_text\": ap.get(\"\
          external_ref_text\") or \"\",\n        \"feedback_text\": ap.get(\"feedback_text\"\
          ) or \"\",\n        \"withdraw_target_text\": ap.get(\"withdraw_target_text\"\
          ) or \"\",\n        \"target_capability\": picked,\n        \"intent\":\
          \ intent,\n        \"intent_source\": intent_source,\n        \"triage_failed\"\
          : triage_failed,\n        \"intent_reason\": (ap.get(\"intent_reason_text\"\
          ) or \"\")[:400],\n        \"decisive_question\": decisive_q if mode ==\
          \ \"ASK_ONE\" else \"\",\n        \"asks_one\": \"true\" if mode == \"ASK_ONE\"\
          \ else \"false\",\n        # entry 故意留空：最终 FP Seam 自带确定性充分性规则来推导入口。\n  \
          \      # 在这里再算一遍就是把「哪个入口算合法等价输入」复制成第二套真源。\n        \"entry\": \"\",\n  \
          \      \"user_request\": user_request,\n        \"needs_bootstrap\": \"\
          true\" if not (ws_id or \"\").strip() else \"false\",\n        \"route_note\"\
          : \"capability=%s；action=%s；能力来源=%s；模式=%s。\"\n                      \"用户点名优先；未点名时由本层分诊台把自然语言桥接到能力，\"\
          \n                      \"依据 Founder 裁定 UAPP-INTENT-ROUTING-001。\"\n   \
          \                   % (picked or \"（本轮无）\", action, intent_source, mode),\n\
          \    }\n"
        code_language: python3
