          \    用来防止 CANCEL 分支说出\"没有任何内容被撤销或删除\"这句话——如果用户在同一轮里既说了\n    \"算了取消\"又给出了新内容（比如\"\
          算了，改成做家居内容\"），新内容会正常覆盖旧值，\"没有\n    任何内容被撤销或删除\"在这种轮次就是假话（对抗式审查真实发现的问题）。changed=True\
          \ 时\n    跳过这句断言，只让其余分支如实描述当前状态。\n\n    cancel_effect：B-5 修复新增，_merge_patch\
          \ 算好的实际撤销结果（见该函数注释），三种取值：\n    None（本轮没有指明具体撤销分类）／{\"removed_text\": 具体内容}（真的撤销了一条）／\n\
          \    {\"removed_text\": None}（指明了分类但那个分类下当前没有可撤销的内容）。\n\n    material_present：本轮\
          \ m1_join 是否真的抽出了非空材料文本（由 main() 传入，与\n    _merge_evidence_item 核实 SOURCED_MATERIAL\
          \ 声明用的是同一个信号）。**live 验证\n    发现的真实缺口，已修复**：m1_chat_llm 的 prompt 里看不到材料原文（只有\
          \ m1_shadow\n    才看得到 {{#m1_join.material_text#}}），它判断\"有没有收到资料\"的唯一信息来源就是\n\
          \    这份 dialogue_directive；这里不说，它就只能诚实地猜\"没收到\"，跟系统内部真实收到并\n    处理了材料的事实矛盾——真实\
          \ Dify 环境里实测到这个场景。\n\n    **两次真实回归都发现的问题，已修复为直接用 material_present 而不是\"\
          本轮是否真的\n    追加了一条 evidence_bundle 条目\"**：后者会在材料被重复上传（去重跳过追加）、\n    evidence_nature\
          \ 缺失（整条证据被丢弃）、或模型把材料内容写进了 evidence_text 以外\n    的字段这三种情况下都不成立，而这三种情况下 material_present\
          \ 仍然是 True——用同一个\n    \"有没有材料\"的问题接了两种不同、可能不一致的答案，是真实的活口。改用 material_present\n\
          \    后这三种情况都能正确触发确认，且不再需要把 _merge_evidence_item 追加的具体证据文本\n    往上传：只做一句不含材料原文的事实确认（\"\
          本轮确实收到了资料\"），不复述、不引用\n    材料里的具体字句——避免把未经代码核实\"这句话真的来自材料\"的模型自称，包装成对用户\n\
          \    的确定性断言，也避免把材料原文的任意内容拼进对话 LLM 的指令通道（m1_chat_llm 的\n    prompt/system\
          \ 提示词里没有 SHADOW_SYSTEM_PROMPT 那样的抗注入条款，材料原文一旦被\n    整段引用进这里就是一个新的、没有任何缓解措施的注入面）。\n\
          \n    cta_authorization_signal_this_turn：v1.4.1 Rebase 新增（M1-AC-18），本轮 patch\
          \ 里的\n    原始 cta_authorization_signal。只用于 DECLINE 确认这一处——DECLINE 是一次性动作\n\
          \    信号，没有持久化状态可读，天然只能靠本轮值驱动。CTA 的\"无 CTA 偏好\"和\"高风险未\n    授权\"这两段提醒改读 snap[\"\
          cta_context\"] 的持久化状态、每轮无条件如实反映现状（同\n    current_task.text 的既有做法），不再用\"\
          这一轮有没有重提\"做门禁——对抗式审查发现\n    那样做会在用户恰好在同一轮要求执行、但没有重复给出分类时制造一个真空窗口，让\n   \
          \ \"不要再问、直接推进\"和\"其实还没授权\"这两个本该同时出现的信号变成只出现一个。\n    \"\"\"\n    if not patch_ok:\n\
          \        if reject_reason == SHADOW_NODE_FAILED:\n            # **与\"补丁校验未通过\"\
          是两种性质不同的失败，措辞不得混用。** 这一轮压根没有产出\n            # 一份完整候选 patch（影子节点走了 default-value\
          \ 降级路径），不是格式校验没过，\n            # 更不是落库失败。不提内部代码（CE-A2 纪律），不编造网络/系统故障之类的具体原因。\n\
          \            return (\n                \"这一轮系统内部的处理没有正常完成——不是用户表达得不清楚，也不是任务保存失败，\"\
          \n                \"就是这一步系统这边没跑通。如实把这件事告诉用户，请他把刚才想说的内容再说一遍。\"\n        \
          \        \"保持旧任务状态不变，不要推测具体是什么故障，也不要声称任何确认、授权或执行已经生效。\"\n            )\n\
          \        # **对抗式审查发现的真实缺口，已修复**：此前把原始 reject_reason（形如\n        # \"ILLEGAL_ENUM:cta_risk_tier:EXTREME_RISK\"\
          ）直接拼进这句话——这正是\n        # CAPABILITY_LABEL_ZH/BLOCK_REASON_LABEL_ZH/BUSINESS_GOAL_CATEGORY_LABEL_ZH\
