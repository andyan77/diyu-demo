    - data:
        code: "\nimport json\n\n# M3 的方法参考正文。逐字节取自仓库，构建时嵌入，sha256 记在候选 Manifest 里，\n\
          # 由确定性检查比对仓库与图内两份是否仍然一致（载体副本的同步义务）。\n_REFS = [[\"references/fashion-and-market.md\"\
          , \"# Fashion and Market Decisions\\n\\nLoad this reference only when apparel\
          \ products, inventory, try-on, seasons, stores, or external market evidence\
          \ can change the operating decision. Treat it as a decision aid, not a static\
          \ platform truth source.\\n\\n## 1. Build the product-operating picture\\\
          n\\nUse only relevant, current, sourced facts:\\n\\n- product stage: launch,\
          \ active sale, replenishment, promotion, exit, or unknown;\\n- product relationship:\
          \ hero item, supporting item, styling complement, store-only item, or another\
          \ evidenced role;\\n- regional season and climate rather than a generic\
          \ national season;\\n- color \\u00d7 size \\u00d7 channel \\u00d7 time sellability;\\\
          n- replenishment possibility and exit pressure;\\n- material, fit, craft,\
          \ care, and price facts;\\n- try-on facts and separately available try-on\
          \ media;\\n- use scenes and customer decision problems;\\n- mini-program,\
          \ inquiry, store, or other fulfillment paths;\\n- store location, hours,\
          \ current stock, service capacity, and redeemable experience.\\n\\nDo not\
          \ let an unverified industry generalization override product facts.\\n\\\
          n## 2. Define the content unit\\n\\nPrefer:\\n\\n```text\\ncustomer decision\
          \ problem\\n+ relevant product relationship\\n+ currently fulfillable path\\\
          n```\\n\\nDo not equate a content unit with one SKU or one generic product\
          \ introduction. A single task may compare products when the customer decision\
          \ requires comparison. A product may support different tasks when the decision\
          \ problem or path is materially different.\\n\\n## 3. Apply local invalidation\\\
          n\\n| Change or absence | Invalidate or constrain | Preserve |\\n|---|---|---|\\\
          n| one color/size becomes unavailable | related sellability, CTA, timing,\
          \ and affected task | material/craft facts and unrelated variants |\\n|\
          \ replenishment becomes uncertain | promise, urgency, and campaign window\
          \ | verified product facts |\\n| price or promotion expires | price/offer\
          \ claim and conversion task | non-price content whose promise remains valid\
          \ |\\n| no try-on has occurred | claims requiring on-body evidence | material,\
          \ detail, care, styling principle, flat-lay, or other supported content\
          \ |\\n| try-on occurred but media is unusable | production path requiring\
          \ that media | verified observations, if separately sourced and permitted\
          \ |\\n| store cannot fulfill current demand | store-visit CTA and store-availability\
          \ claim | non-store paths that remain valid |\\n| season/climate window\
          \ changes | scene relevance and timing | evergreen facts not dependent on\
          \ the window |\\n\\nNever turn \\u201cnot currently sellable\\u201d into\
          \ \\u201cproduct facts are false.\\u201d Never turn \\u201cno try-on media\\\
          u201d into \\u201cno apparel content can be produced.\\u201d\\n\\n## 4.\
          \ Use claim-specific evidence\\n\\nRequire evidence that matches the claim:\\\
          n\\n- body fit, drape, movement, comfort, and proportion need appropriate\
          \ on-body evidence or explicit uncertainty;\\n- composition, construction,\
          \ dimensions, care, price, and stock need current authoritative product\
          \ data;\\n- \\u201cworks for a scene\\u201d needs a defensible link between\
          \ product properties and the scene;\\n- customer preference needs observation,\
          \ not a generic fashion rule;\\n- scarcity, best-seller, flattering, premium,\
          \ and similar claims need their own support.\\n\\nWhen evidence is absent,\
          \ reduce claim strength, change the task, condition the statement, defer,\
          \ or do not publish. Do not fill gaps with conservative-sounding numbers\
          \ or familiar industry tropes.\\n\\n## 5. Distinguish GMV, leads, and store\
          \ visits\\n\\n### GMV\\n\\nFocus on purchase-decision friction, current\
          \ sellability, product proof, comparison, price/offer truth, and an actual\
          \ purchase route.\\n\\n### Leads\\n\\nFocus on a useful reason to inquire,\
          \ the information or service available after inquiry, qualification boundaries,\
          \ response capacity, and reliable lead capture. A comment or like is not\
          \ automatically a lead.\\n\\n### Store visits\\n\\nFocus on why the physical\
          \ visit creates value unavailable or weaker online, who should visit, geography\
          \ and timing, store stock/experience, service capacity, and an honest visit\
          \ path. Do not infer store readiness from online sellability.\\n\\nThese\
          \ objectives can coexist, but their tasks and observation targets are not\
          \ interchangeable.\\n\\n## 6. Discover opportunity actively\\n\\nBuild an\
          \ opportunity hypothesis from:\\n\\n- a current demand, attention, behavior,\
          \ supply, or timing signal;\\n- its platform, region, category, audience,\
          \ and time scope;\\n- evidence strength and known bias;\\n- account and\
          \ expression fit;\\n- product/operational ability to fulfill;\\n- a distinct\
          \ customer decision problem or value gap;\\n- the smallest reversible content/operating\
          \ action;\\n- expected observable response and refutation;\\n- expiry or\
          \ review condition.\\n\\nPossible decisions:\\n\\n- screen out;\\n- observe;\\\
          n- run a bounded validation;\\n- exploit within current capacity;\\n- stop\
          \ or redesign.\\n\\nDo not confuse:\\n\\n- **opportunity**: scoped signal\
          \ + fit + supply/path + reversible test;\\n- **trend chasing**: attention\
          \ signal without account or business fit;\\n- **homogeneity defense**: avoiding\
          \ crowded expression without evidence of positive demand;\\n- **unsuitable\
          \ opportunity**: market signal the account cannot credibly express or fulfill.\\\
          n\\n## 7. Layer homogeneity responsibility\\n\\n| Layer | Owner | M3 action\
          \ |\\n|---|---|---|\\n| category/track opportunity, topic saturation, content-pillar\
          \ balance, column fatigue, cycle concentration | M3 | alter the cycle mix,\
          \ timing, resource level, or decision to validate |\\n| single-content angle,\
          \ hook, narrative, and expression mechanism | Creative Tournament / Creative\
          \ Script | preserve room for real alternatives; do not prescribe the mechanism\
          \ |\\n| title, cover, entry promise, and platform packaging | Publishing\
          \ & Packaging | pass facts and constraints; do not write the package |\\\
          n\\nReliable, current, scoped external evidence may justify lightweight\
          \ reversible action without evidence of account decline. Permanent exit\
          \ or long-term repositioning requires stronger account-specific evidence;\
          \ repositioning returns to Matrix.\\n\\nIf market evidence is absent, production\
          \ may continue from internal evidence, but state that external comparison\
          \ is incomplete. Never claim platform uniqueness or scarcity without current\
          \ scoped evidence.\\n\\n## 8. Bound tools and freshness\\n\\nUse current\
          \ platform and market sources at runtime when the decision depends on them.\
          \ Do not copy volatile platform rules into this reference. Preserve source,\
          \ platform, observation time, scope, and freshness.\\n\\nDo not build an\
          \ automatic monitoring, scoring, or optimization platform for the first\
          \ slice. Add a minimal deterministic helper only when real operation demonstrates\
          \ a need for date windows, capacity arithmetic, or deduplication; prefer\
          \ the data/application layer over the professional Skill.\\n\\n\"], [\"\
          references/six-skill-methods.md\", \"# Six-Skill Method Inheritance\\n\\\
          nLoad this reference when M3 creates downstream tasks, evaluates a valid\
          \ equivalent input, or checks that commercial objectives did not erase applicable\
          \ professional value.\\n\\nThe methods below are obligations to preserve\
          \ when applicable. They do not require running every physical Skill, and\
          \ they do not authorize M3 to produce downstream artifacts.\\n\\n## 1. Matrix\\\
          n\\nPreserve:\\n\\n- account responsibility before decorative personality;\\\
          n- identifiable expression subject and source ownership;\\n- audience, follow\
          \ reason, content value, and long-term promise consistency;\\n- the difference\
          \ between confirmed fact, professional interpretation, and provisional positioning;\\\
          n- return to Matrix when the long-term identity itself may be wrong.\\n\\\
          nDo not:\\n\\n- infer a new long-term positioning from short-term performance;\\\
          n- let two accounts become interchangeable after removing names;\\n- rewrite\
          \ persona, account responsibility, or multi-account relations inside M3.\\\
          n\\nM3 handoff duty: include the currently valid positioning/voice reference\
          \ or an explicitly provisional anchor and its limits.\\n\\n## 2. Campaign\\\
          n\\nPreserve:\\n\\n- a clear validity window and one primary business/customer\
          \ change;\\n- explicit operating trade-offs and non-sacrifice conditions;\\\
          n- the minimum sufficient participating combination;\\n- the ability to\
          \ reduce, defer, cancel, or not publish;\\n- named coverage of the cycle\
          \ and a return condition.\\n\\nDo not:\\n\\n- make Campaign the only legal\
          \ upstream;\\n- narrow traffic, followers, GMV, leads, or visits into a\
          \ generic cognitive-change goal;\\n- let a temporary Campaign permanently\
          \ rewrite Matrix or the cycle baseline.\\n\\nM3 handoff duty: expose the\
          \ active overlay, occupied slots, unaffected baseline, and expiry.\\n\\\
          n## 3. Content Brief\\n\\nPreserve:\\n\\n- one primary job per content item\
          \ with limited secondary contribution;\\n- a specific audience problem,\
          \ scene, or opportunity;\\n- the desired audience change;\\n- a content\
          \ promise, core proposition, or testable hypothesis;\\n- fact, source, asset,\
          \ production, CTA, and risk boundaries;\\n- one highest-discrimination question\
          \ when the task cannot proceed safely.\\n\\nDo not:\\n\\n- force every task\
          \ through Matrix and Campaign;\\n- substitute a goal label and cadence for\
          \ the content\\u2019s business substance;\\n- ask the user to refill information\
          \ already present in natural language or valid artifacts.\\n\\nM3 handoff\
          \ duty: supply enough business meaning for Brief to begin, then stop.\\\
          n\\n## 4. Creative Tournament and Creative Script\\n\\nPreserve:\\n\\n-\
          \ real room for materially different creative directions when a genuine\
          \ choice exists;\\n- differences in mechanism, not just wording, labels,\
          \ examples, or tone;\\n- tension as an unfinished state when relevant, not\
          \ forced conflict;\\n- fact zones, expressive freedom, subjective limits,\
          \ and explicit non-promises;\\n- an identifiable human expression subject\
          \ and content-specific detail;\\n- the option to recommend one direction\
          \ directly when alternatives are artificial.\\n\\nDo not:\\n\\n- prescribe\
          \ hook, narrative structure, dialogue, or visual mechanism in M3;\\n- demand\
          \ narrative or empathy for lists, comparisons, demonstrations, product details,\
          \ or visual-mechanism content when not applicable;\\n- present unknown facts\
          \ as a finished script premise.\\n\\nM3 handoff duty: preserve the business\
          \ problem and boundaries while leaving creative mechanism open.\\n\\n##\
          \ 5. Production Director\\n\\nPreserve:\\n\\n- a distinction between planned\
          \ realization and actual captured material;\\n- production constraints early\
          \ enough to affect feasibility;\\n- resource changes altering HOW rather\
          \ than silently changing the business job;\\n- the requirement that production\
          \ guidance create executable differences;\\n- proof claims having failure\
          \ conditions.\\n\\nDo not:\\n\\n- write shots, performance direction, scenes,\
          \ or realization manifests in M3;\\n- treat \\u201cplanned to capture,\\\
          u201d \\u201cshot for a long time,\\u201d or \\u201casset exists\\u201d\
          \ as \\u201cthe content promise was realized\\u201d;\\n- demand full production\
          \ resources when a lower-resource route can fully deliver the same job.\\\
          n\\nM3 handoff duty: state actual capacity, critical proof/material needs,\
          \ and conditions that would make the task infeasible.\\n\\n## 6. Publishing\
          \ & Packaging\\n\\nPreserve:\\n\\n- publication state derived from actual\
          \ available material;\\n- packaging promise no greater than the realized\
          \ payoff;\\n- current platform, account, permission, CTA, inventory, price,\
          \ and fulfillment truth;\\n- explicit non-promises as read-only downstream\
          \ constraints;\\n- clean user delivery without rejected alternatives or\
          \ internal review debris.\\n\\nDo not:\\n\\n- write title, cover, entry\
          \ copy, or final CTA in M3;\\n- package planned, missing, or simulated material\
          \ as realized;\\n- infer high-risk expression, external diversion, discount,\
          \ stock, or purchase promise from a commercial objective.\\n\\nM3 handoff\
          \ duty: pass objective, CTA intent, authorization boundaries, current facts,\
          \ and invalidation conditions.\\n\\n## 7. Conditional applicability\\n\\\
          nUse these questions before preserving an obligation:\\n\\n1. Does the current\
          \ task type need this capability to avoid a unique failure?\\n2. Is the\
          \ necessary business semantic already present in an equivalent input?\\\
          n3. Would removing the obligation change the downstream result under the\
          \ current acceptance criteria?\\n4. Does enforcing it create a false all-capability\
          \ gate?\\n\\nIf the obligation does not change the result, omit it. If a\
          \ valid equivalent input preserves it, do not force a physical call. If\
          \ it is necessary and absent, block only the dependent branch or return\
          \ one discriminating question.\\n\\n## 8. Acceptance split\\n\\nM3 can prove\
          \ only that its decision and handoff preserve the opportunity for applicable\
          \ professional value. M3 cannot alone prove the finished item has a superior\
          \ hook, narrative, human feel, persona, shootability, conversion naturalness,\
          \ or packaging. Test finished-content gain at integration level with controlled\
          \ comparison.\\n\\nNever use model self-rating, longer output, more components,\
          \ or more rules as evidence of professional superiority.\\n\\n\"], [\"references/operations.md\"\
          , \"# Operating Decisions\\n\\nLoad this reference for account-state diagnosis,\
          \ cycle planning, daily decisions, review updates, Campaign overlays, or\
          \ Content Brief handoff.\\n\\n## 1. Decision order\\n\\nUse this order;\
          \ skip irrelevant steps:\\n\\n1. Identify the authorized objective, priorities,\
          \ non-sacrifice conditions, platform, and current scope.\\n2. Interpret\
          \ maturity separately from temporary objective overlays and health hypotheses.\\\
