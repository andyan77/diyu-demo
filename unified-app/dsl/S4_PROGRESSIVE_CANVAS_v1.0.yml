          \ and decision.lower() not in _NO_RECORD\n\n    head = \"你说的这件事我已经归到该走的那条线上了。\\\
          n\\n\"\n    if transport_down:\n        mid = (\"不过实话说，我这会儿根本没连上记录系统——不是它里面是空的，是我没读到，\"\
          \n               \"这两件事不一样，我不替它打包票。\\n\\n\")\n        state = \"unreachable\"\
          \n    elif not has_record:\n        mid = (\"我查过了：这个号目前在系统里还没有可用的经营记录。不是我没查，是确实还没有。\"\
          \n               \"所以后面任何判断都不该建立在「它其实还不错」这种假设上。\\n\\n\")\n        state\
          \ = \"reachable_no_record\"\n    else:\n        mid = (\"我已经把这个号目前在系统里记录在案的情况读出来了，后面做判断会以这些为准，\"\
          \n               \"不会替它补没发生过的事。\\n\\n\")\n        state = \"reachable_with_record\"\
          \n\n    tail = (\"但真正做判断的那部分还没接进来，所以我现在给不了你分析结论。\"\n            \"我也没有把它挂在后台跑——没跑就是没跑，不骗你等。\\\
          n\\n\"\n            \"等下一步接上，同样这句话就能直接出结果。\")\n    return {\"pending_text\"\
          : head + mid + tail,\n            \"pending_kind\": \"routed_not_wired\"\
          ,\n            \"m2_state\": state,\n            \"decision_seen\": decision,\n\
          \            \"facts_present\": \"true\" if has_record else \"false\"}\n"
