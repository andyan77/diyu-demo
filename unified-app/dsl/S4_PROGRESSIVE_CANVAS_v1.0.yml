          \n            )\n        elif cancel_effect and cancel_effect[\"removed_text\"\
          ] is None:\n            label = CANCEL_TARGET_LABEL_ZH.get(cancel_effect[\"\
          target\"], cancel_effect[\"target\"])\n            parts.append(\n     \
          \           \"用户这一轮要求撤销\" + label + \"，但当前这个分类下没有记录任何可撤销的内容。\"\n       \
          \         \"如实告知这一点，不要声称已经撤销了什么。\"\n            )\n        elif not changed:\n\
          \            # **对抗式审查发现的措辞问题，已修复**：不得断言\"用户没有指明\"——cancel_target\n    \
          \        # 是影子模型的解析结果，指明不明确既可能是用户真的说得含混，也可能是模型没\n            # 解析出来；把这个不确定性单方面归给用户是不实归因，与\n\
