          \n# 内部状态词。命中就换成大白话，不是删掉——删掉会让\"没查到\"看起来像\"没问题\"。\n_STATE_WORDS = [\n   \
          \ (r\"\\bDELIVERED_AFTER_RECOVERY\\b\", \"（已完成，中途恢复过一次）\"),\n    (r\"\\\
          bDELIVERED\\b\", \"（已完成）\"),\n    (r\"\\bINPUT_INSUFFICIENT\\b\", \"（输入还不够）\"\
          ),\n    (r\"\\bNOT_VERIFIED\\b\", \"（还没核实）\"),\n    (r\"\\bNOT_APPLICABLE\\\
          b\", \"（这一项用不上）\"),\n    (r\"\\bNOT_STARTED\\b\", \"（还没开始）\"),\n    (r\"\
          \\bIN_PROGRESS\\b\", \"（进行中）\"),\n    (r\"\\bCOMPLETED\\b\", \"（已完成）\"),\n\
          \    (r\"\\bREADY\\b\", \"（可以往下走了）\"),\n    (r\"\\bSTALE\\b\", \"（需要重新确认）\"\
          ),\n    (r\"\\bCURRENT\\b\", \"（是最新的）\"),\n    (r\"\\bBLOCKED\\b\", \"（卡住了）\"\
          ),\n    (r\"\\bPARTIAL\\b\", \"（只完成了一部分）\"),\n    (r\"\\bUNKNOWN\\b\", \"\
          （不确定）\"),\n    (r\"\\bPASS\\b\", \"（通过）\"),\n    (r\"\\bFAIL(ED)?\\b\",\
          \ \"（没通过）\"),\n]\n# 内部标识：能力枚举、入口号、节点名、UUID、内部字段名。一律不该出现在用户面前。\n_IDENTIFIERS\
          \ = [\n    r\"\\bENTRY-\\d{2}\\b\",\n    r\"\\b(MATRIX|CAMPAIGN|CONTENT_BRIEF|CREATIVE_SCRIPT|PRODUCTION_DIRECTOR|\"\
          \n    r\"PUBLISHING_PACKAGING|SINGLE_ACCOUNT_OPERATION|CREATIVE_TOURNAMENT)\\\
          b\",\n    r\"\\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\\\
          b\",\n    r\"\\b(uapp_[a-z_]+|m1_[a-z_]+|boot_[a-z_]+)\\b\",\n    r\"\\\
          b(capability_call|professional_input|business_delivery_outcome|user_delivery|\"\
          \n    r\"returns_json|binding_json|seam_trace_json|snapshot_json|call_intent_json|\"\
          \n    r\"loaded_references|account_context|operating_judgment|cycle_state_carry|\"\
          \n    r\"gate_status|extraction_gaps_text|registered_facts)\\b\",\n    #\
          \ 通用兜底：裸 snake_case 一律是内部字段名，不是中文交付正文该有的东西。\n    # 具体触发例：audience_problem\
          \ / expected_change / content_promise /\n    # expression_subject_and_boundary（TRIAGE-001\
          \ 实测泄漏）。\n    r\"\\b[a-z][a-z0-9]*(?:_[a-z0-9]+)+\\b\",\n    r\"<think>|</think>\"\
          ,\n    r\"<<REFERENCE_MANIFEST>>|<<END_REFERENCE_MANIFEST>>\",\n]\n\n_CAP_CN\
          \ = {\n    \"MATRIX\": \"账号架构与诊断\",\n    \"CAMPAIGN\": \"单次经营任务策划\",\n \
          \   \"CONTENT_BRIEF\": \"内容契约（Content Brief）\",\n    \"CREATIVE_SCRIPT\"\
          : \"创意与脚本\",\n    \"PRODUCTION_DIRECTOR\": \"拍摄与制作方案\",\n    \"PUBLISHING_PACKAGING\"\
          : \"发布包装\",\n}\n\n\ndef _scrub(text):\n    \"\"\"返回 (清洗后的文本, 命中清单)。命中清单只进内部通道，不给用户看。\"\
          \"\"\n    hits = []\n    out = text or \"\"\n    for pat, repl in _STATE_WORDS:\n\
          \        found = re.findall(pat, out)\n        if found:\n            hits.append(pat)\n\
          \            out = re.sub(pat, repl, out)\n    for pat in _IDENTIFIERS:\n\
          \        found = re.findall(pat, out)\n        if found:\n            hits.append(pat)\n\
          \            out = re.sub(pat, \"\", out)\n    # 清洗可能留下多余空白，收一下；不改动正文内容本身。\n\
          \    out = re.sub(r\"[ \\t]{2,}\", \" \", out)\n    out = re.sub(r\"\\n{3,}\"\
          , \"\\n\\n\", out)\n    return out.strip(), hits\n\n\ndef main(capability,\
          \ seam_user_delivery, seam_outcome, seam_returns_json,\n         m3_judgment,\
          \ m3_gate_status, route_mode, m2_note, hop_gaps_text,\n         account_context=\"\
          \", side_effect_text=\"\"):\n    modules = [\"M1 任务上下文\"]\n    if route_mode\
          \ in (\"CAPABILITY\", \"OPERATION_ONLY\"):\n        modules += [\"M2 当前投影\"\
          , \"M3 单账号持续运营\"]\n    if route_mode == \"CAPABILITY\":\n        modules\
          \ += [\"M5 跨能力接缝抽取\", \"M4 统一能力接缝 → \" + (_CAP_CN.get(capability) or capability)]\n\
          \n    # 组件级 Return：这一支停了，说清楚缺什么，不当成整任务失败，也不假装完成。\n    gaps = []\n    try:\n\
          \        arr = json.loads(seam_returns_json or \"[]\")\n        if isinstance(arr,\
          \ list):\n            for r in arr:\n                if isinstance(r, dict)\
          \ and r.get(\"precise_gap\"):\n                    gaps.append(str(r.get(\"\
          precise_gap\")))\n    except Exception:\n        pass\n\n    delivered =\
          \ seam_outcome in (\"DELIVERED\", \"DELIVERED_AFTER_RECOVERY\")\n    body\
          \ = (seam_user_delivery or \"\").strip()\n\n    if route_mode in (\"OPERATION_ONLY\"\
          , \"WRITEBACK\"):\n        body = (m3_judgment or \"\").strip()\n      \
          \  delivered = bool(body)\n        # 真的写进去了，就以\"实际发生了什么\"作为交付正文。\n     \
          \   # 这一轮没有 M3 正文时说\"没有产出\"，会和刚刚发生的写入互相打脸。\n        if not body and (side_effect_text\
          \ or \"\").strip():\n            body = (side_effect_text or \"\").strip()\n\
          \            delivered = True\n    elif route_mode == \"STATUS\":\n    \
          \    # 只问\"系统现在记住了什么\"：如实念 M2 的当前投影，不加判断、不加建议。\n        body = (account_context\
          \ or \"\").strip()\n        delivered = bool(body)\n\n    # user_delivery\
          \ 是能力侧唯一指定给用户看的字段。它非空就用它——本画布再写一份\n    # \"缺口说明\"，只会把能力已经组织好的自然语言换成给机器看的字段名（TRIAGE-001）。\n\
          \    if body and (delivered or gaps):\n        final = body\n    elif body:\n\
          \        # 有正文、既没交付判定也没缺口：如实说，不把「跑完了」说成「做好了」。\n        final = body + \"\
          \\n\\n（上面这部分我还没能确认已经完整完成，先给你看当前结果。）\"\n    elif gaps:\n        # 能力没写面向用户的正文，才由这里兜底。字段名一律经\
          \ _scrub 清洗后再出。\n        final = (\"这一步先停在这里，因为还差一件关键的事：\\n\\n\" + \"\\\
          n\".join(\"· \" + g for g in gaps)\n                 + \"\\n\\n补上之后我接着往下做，前面已经完成的部分不用重来。\"\
          )\n    else:\n        final = (\"这一步没有产出可以交给你的内容。原始运行记录已经保留，\"\n       \
          \          \"没有被删掉，也没有被改写成完成。\"\n                 + ((\"\\n还缺：\" + hop_gaps_text)\
          \ if (hop_gaps_text or \"\").strip() else \"\"))\n\n    # 副作用陈述永远附在最后，且不参与\
          \ _scrub 的能力枚举清洗（它本来就是大白话）。\n    se = (side_effect_text or \"\").strip()\n\
          \    if se and se not in final:\n        final = final + \"\\n\\n\" + se\n\
          \n    final, hits = _scrub(final)\n    if not final:\n        final = \"\
          这一步没有产出可以交给你的内容，原始记录已保留。\"\n\n    return {\n        \"final_text\": final,\n\
          \        \"delivered_flag\": \"true\" if delivered else \"false\",\n   \
          \     \"modules_actually_run\": json.dumps(modules, ensure_ascii=False),\n\
          \        # 内部通道：泄漏命中如实登记，不面向用户。零命中才算 AC-10 成立。\n        \"leak_hits_json\"\
          : json.dumps(hits, ensure_ascii=False),\n        \"leak_hit_count\": str(len(hits)),\n\
          \        \"m2_note\": m2_note or \"\",\n    }\n"
