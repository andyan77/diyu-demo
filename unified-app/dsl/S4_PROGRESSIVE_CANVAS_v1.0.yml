          n\\nFor each repeatable operating or expression mechanism, reason on two\
          \ separate dimensions:\\n\\n### Evidence maturity\\n\\n- no observation;\\\
          n- limited observation;\\n- repeated observation;\\n- contradicted or stale\
          \ evidence.\\n\\n### Current use decision\\n\\n- explore;\\n- maintain;\\\
          n- expand;\\n- pause;\\n- redesign;\\n- exit.\\n\\nThese are explanatory\
          \ semantics, not required database enums. Choose only distinctions that\
          \ change a decision.\\n\\nFor every exploration proposal record:\\n\\n-\
          \ the uncertainty it addresses;\\n- the smallest reversible action;\\n-\
          \ the observation that would support continuation;\\n- the observation that\
          \ would refute or redesign it;\\n- its expiry or review condition;\\n- what\
