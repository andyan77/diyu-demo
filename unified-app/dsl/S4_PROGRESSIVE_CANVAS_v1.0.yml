          , \"FRESH\")\n\n    # Dify 把 LLM 节点的 structured_output 作为原生 object 传给下游\
          \ Code 节点\n    # （非 JSON 字符串），故这里直接按 dict 校验，不做 json.loads。\n    patch =\
          \ shadow_patch if isinstance(shadow_patch, dict) else None\n\n    if patch\
          \ is None:\n        patch_ok = False\n        reject_reason = \"PATCH_NOT_OBJECT\"\
          \n    elif set(PATCH_KEYS) - set(patch.keys()):\n        # 缺任意一个必需 key（含\
          \ {} 这种全缺的降级输出）= 这一轮压根没有一份完整候选 patch，\n        # 不是\"格式校验没通过\"，所以**不再往下调用\
          \ _validate_patch**，理由见 SHADOW_NODE_FAILED。\n        patch_ok = False\n\
          \        reject_reason = SHADOW_NODE_FAILED\n    else:\n        patch_ok,\
          \ reject_reason = _validate_patch(patch)\n\n    # 本轮原始 route_intent，只在 patch\
          \ 真的可信时才取（见 _dialogue_directive 的形参说明：\n    # 不能读 snap[\"last_route_intent\"\
          ]，那是跨轮的\"最后一次\"）。\n    current_route_intent = patch.get(\"route_intent\"\
          ) if patch_ok and isinstance(patch, dict) else None\n\n    material_present\
          \ = bool((material_text or \"\").strip())\n\n    requested_capabilities\
          \ = []\n    if patch_ok:\n        snap, changed, evidence_dropped_incomplete,\
          \ evidence_provenance_downgraded, cancel_effect, content_changed = (\n \
          \           _merge_patch(snap, patch, material_present)\n        )\n   \
          \     requested_capabilities = _parse_capabilities_text(patch.get(\"requested_capabilities_text\"\
          , \"\"))\n    else:\n        changed = False\n        evidence_dropped_incomplete\
          \ = False\n        evidence_provenance_downgraded = False\n        cancel_effect\
          \ = None\n        content_changed = False\n\n    # M1-AC-17：调用方显式提供的账号锚点（当前无实际调用方，见形参说明）覆盖本轮自然语言\n\
          \    # 提取结果——真实 M2 锚点的权威性高于对话里的临时线索。放在 _merge_patch 之后，确保\n    # 不被本轮 account_anchor_text\
          \ 覆盖回去。\n    #\n    # **对抗式审查发现的真实缺口，已修复**：此前只判断 account_anchor_supplied\
          \ 这个字典\n    # 本身是否非空，一个没带 identity_text 的退化调用（比如只给了 confirmation）也会被\n \
          \   # 接受，把 source 标成 CALLER_SUPPLIED 却没有任何真实身份内容——账号锚点缺口的判据\n    # 已经改成只看\
          \ identity_text 是否有值（见 _compute_gaps），这里必须同一个口径，否则\n    # 这种退化调用会让一个其实什么都没有的账号锚点悄悄不再被追问。\n\
          \    if account_anchor_supplied and account_anchor_supplied.get(\"identity_text\"\
          ):\n        snap[\"account_anchor\"] = {\n            \"identity_text\"\
          : account_anchor_supplied.get(\"identity_text\"),\n            \"source\"\
          : \"CALLER_SUPPLIED\",\n            \"confirmation\": account_anchor_supplied.get(\"\
          confirmation\", \"SYSTEM_TENTATIVE\"),\n        }\n\n    # gaps[] 每轮整体重算并覆写。**无条件执行**（不放在\
          \ if patch_ok 分支内）：patch 被拒绝的\n    # 轮次同样重算，结果与上一轮相同，因为快照没变。这次覆写**不置 changed、不推进\
          \ revision**\n    # ——缺口清单是既有状态的派生视图，不是用户造成的状态变化。\n    # include_structural=False：只持久化随对话状态变化的动态子集（空快照上\
          \ 13 条）。9 条结构性\n    # 常量内容恒定、不携带任何本轮独有信息，逐轮写进 Dify 会话变量只会让快照白白膨胀；需要完整\n\
          \    # 22 条合规视图的调用点（project_content_task）自行以 include_structural=True 重算。\n\
          \    snap[\"gaps\"] = _compute_gaps(snap, include_structural=False)\n\n\
          \    call_intent = compute_call_intent(snap, requested_capabilities)\n \
          \   # M1-AC-18：本轮原始 cta_authorization_signal，同 current_route_intent 一样只能取本轮\n\
          \    # patch 的值（DECLINE 是一次性动作信号，理由同 _dialogue_directive 的形参说明）。\n    cta_authorization_signal_this_turn\
          \ = (\n        patch.get(\"cta_authorization_signal\", \"NONE\") if patch_ok\
          \ and isinstance(patch, dict) else \"NONE\"\n    )\n    directive = _dialogue_directive(\n\
          \        snap, patch_ok, reject_reason, call_intent, requested_capabilities,\
          \ current_route_intent,\n        content_changed, cancel_effect, material_present,\
          \ cta_authorization_signal_this_turn,\n    )\n\n    return {\n        \"\
          snapshot_json\": json.dumps(snap, ensure_ascii=False),\n        \"call_intent_json\"\
          : json.dumps(call_intent, ensure_ascii=False),\n        \"dialogue_directive\"\
          : directive,\n        \"patch_ok\": \"true\" if patch_ok else \"false\"\
          ,\n        \"reject_reason\": reject_reason,\n        \"state_changed\"\
          : \"true\" if changed else \"false\",\n        \"turn_report_json\": json.dumps(\n\
          \            {\n                \"patch_ok\": patch_ok,\n              \
          \  \"reject_reason\": reject_reason,\n                \"revision\": snap[\"\
          revision\"],\n                \"requested_capabilities\": requested_capabilities,\n\
          \                \"needed_capabilities\": call_intent[\"needed_capabilities\"\
          ],\n                \"open_threads_open_count\": len(\n                \
          \    [t for t in snap[\"open_threads\"] if t.get(\"status\") in (\"OPEN\"\
          , \"SURFACED\")]\n                ),\n                # 本轮有一条证据因维度不全（给了原话、没给性质）被丢弃。如实登记在**不面向\n\
          \                # 用户**的机器可读通道里：dialogue_directive 不变、reject_reason 不变，\n\
          \                # 不给\"内部枚举被对话 LLM 复述给用户\"（CE-A2）这个已知缺陷新增触发器。\n        \
          \        \"evidence_dropped_incomplete\": evidence_dropped_incomplete,\n\
          \                # B-3 修复：本轮是否发生了\"模型声称材料来源，但客观没有材料文本\"的降级。\n          \
          \      # 如实登记在不面向用户的通道里，供 Reviewer/后续批次判断模型是否常态化\n                # 误判来源（若这条经常为\
          \ true，说明 evidence_provenance 判据需要重新设计）。\n                \"evidence_provenance_downgraded\"\
          : evidence_provenance_downgraded,\n            },\n            ensure_ascii=False,\n\
          \        ),\n    }\n"
