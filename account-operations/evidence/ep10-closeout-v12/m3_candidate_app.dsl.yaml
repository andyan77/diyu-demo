    - data:
        code: "\"\"\"载体 v1.2 · 必填项闸门（确定性）。\n\nv1.1 的设计根基错误：整个闸门跑在\"模型自报四个触发标志\"上，而这正是缺陷一\n\
          （`missing[]` 自述不可靠）已经否定的前提。v1.2 把这条原则贯穿到底——\n\n    凡是能从输入里确定性算出来的事实，就不要问模型。\n\
          \n四条修复面：\n  A 最低实质产出硬门：零交付不得被盖合规章，且**不得进补齐节点**（补齐不许无中生有）。\n  B 触发条件：能从 account_context\
          \ 算的直接算；算不出的自报缺失或与输入冲突时 fail-closed。\n  D 内部字段不得进入用户可见正文：标签整族移出正文，进只给机器看的审计块。\n\
          \  E 裸标签/空洞标签/装饰性填空：改为\"锚定行必须逐字指回正文里一段互不重叠的实质文字\"。\n\"\"\"\nimport json\n\
          import re\n\n\n# ----------------------------------------------------------------\
          \ 常量（冻结）\n\nMIN_BODY_CHARS = 200          # 第 4 轮 70 次实测：最低非零正文 523，中位 1781，唯一\
          \ <160 的是 G6(=0)\nMIN_SENTENCES = 3\nMIN_NON_REFERENCE_CHARS = 120  # G6\
          \ 的全部交付就是一句\"参考文件未加载\"\nMIN_ANCHOR_CHARS = 12\n\nTRIGGER_ITEMS = {\n   \
          \ \"explore\": (\"探索提案\", [\"探索·不确定性\", \"探索·最小可逆动作\", \"探索·支持继续的观察\",\n\
          \                             \"探索·推翻信号\", \"探索·到期或复验\", \"探索·让位的稳定义务\"\
          ]),\n    \"anchor\": (\"暂定锚点\", [\"暂定锚点·来源\", \"暂定锚点·范围\", \"暂定锚点·不确定性\"\
          ,\n                            \"暂定锚点·复验触发\"]),\n    \"conflict\": (\"冲突反馈\"\
          , [\"冲突反馈·冲突在哪\", \"冲突反馈·各自证据身份\",\n                              \"冲突反馈·为什么保持或改变\"\
          , \"冲突反馈·还需要什么观察\"]),\n    \"notask\": (\"无内容任务\", [\"无任务·缺什么\", \"无任务·谁能补\"\
