          # 否定短语必须是**\"这一项本身没送到\"**，不能是**\"这一项的内容里没有某个话题\"**。\n# 实测事故（E07，v1.2 自己造成的）：正文写「三条反馈里没有任何一条提到上身效果或试穿」——\n\
