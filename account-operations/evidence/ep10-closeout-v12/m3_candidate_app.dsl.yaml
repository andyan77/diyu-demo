          \  r\"覆盖|到期|让位|延后|延期|推迟|改期|后移|回到|不动|保持|不变|沿用|\"\n                 r\"继续|维持|照常|仍然|复验|按原计划|无新任务\"\
          )\n\n\ndef check_continuity(base_obj, text):\n    \"\"\"投影前后一致性：基线里的关键对象，本轮要么继续、要么被点名处置，不许静默消失。\n\
          \n    这不是新要求——SKILL 自检第 7 条（\"未受影响的判断明确说保持了吗\"）、O-7 连续性义务、\n    O-11 限定影响面已经要求了。这里只是把它从\"\
          记得就写\"改成\"缺了能被机械检出\"。\n    \"\"\"\n    if not base_obj or not base_obj.get(\"\
          baseline_present\"):\n        return {\"status\": \"NO_BASELINE\", \"carried\"\
          : [], \"disposed\": [],\n                \"dropped_without_notice\": [],\
          \ \"advisory_named_dropped\": []}\n    t = text or \"\"\n    segs = _segments(t)\n\
          \    carried, disposed, dropped = [], [], []\n    for obj in list(base_obj.get(\"\
          tasks\", [])) + list(base_obj.get(\"rhythm\", [])):\n        probe = obj\
          \ if not re.search(r\"条\\s*/?\\s*周|每周\", obj) else None\n        if probe\
          \ is None:\n            hit = bool(re.search(r\"每周\\s*\\d+\\s*条|\\d+\\s*条\\\
          s*/\\s*周\", t))\n        else:\n            hit = bool(re.search(r\"(?<![A-Za-z0-9])\"\
          \ + re.escape(obj) + r\"(?![A-Za-z0-9])\", t))\n        if hit:\n      \
          \      named = [s for s in segs if (re.search(r\"每周\\s*\\d+\\s*条|\\d+\\\
          s*条\\s*/\\s*周\", s)\n                                         if probe is\
          \ None else\n                                         re.search(r\"(?<![A-Za-z0-9])\"\
          \ + re.escape(obj)\n                                                   +\
          \ r\"(?![A-Za-z0-9])\", s))]\n            if any(re.search(CONT_DISPOSED,\
          \ s) for s in named):\n                disposed.append(obj)\n          \
          \  else:\n                carried.append(obj)\n        else:\n         \
          \   dropped.append(obj)\n    adv = [n for n in base_obj.get(\"named_advisory\"\
          , []) if n not in t]\n    # 概括性延续声明（= SKILL 自检第 7 条\"未受影响的判断明确说保持了吗\"）。\n\
          \    # 有它就不必逐个点名，但投影侧必须改为\"逐字保留上一基线的相应原句\"，不能整体覆盖。\n    blanket = bool(re.search(\n\
          \        r\"(其余|其他|未涉及|未受影响|不受影响|没有涉及|以外)[^。；;\\n]{0,24}\"\n        r\"\
          (判断|任务|安排|计划|部分|内容|组合|节奏|基线)?[^。；;\\n]{0,24}\"\n        r\"(保持不变|保持|不变|沿用|继续有效|仍然有效|维持|照常)\"\
          , t))\n    # 「本轮没重述」≠「内容丢了」。O-11 要求限定影响面，一份聚焦回答本来就不该\n    # 把整份基线抄一遍；把\"\
          没重述\"判成交付失败会逼出全量重写，和产品语义相反。\n    # 真正要防的是**投影把它弄丢**——那由投影侧的逐字保留兜底，见 projection_v12.py。\n\
          \    # 因此这里只分三态，且都不阻断交付本身：\n    #   OK       全部对象要么被继续、要么被点名处置\n    #  \
          \ MERGED   有对象本轮未涉及 ⇒ 投影必须逐字保留它们的原句，不得整体覆盖\n    #   （交付侧唯一的阻断来自最低产出硬门，不来自这里）\n\
          \    status = \"OK\" if not dropped else (\"BLANKET_CARRY\" if blanket else\
          \ \"MERGED\")\n    return {\"status\": status, \"carried\": carried, \"\
          disposed\": disposed,\n            \"blanket_carry_statement\": blanket,\n\
          \            \"not_restated\": dropped,\n            \"dropped_without_notice\"\
          : [],\n            \"dropped_covered_by_blanket\": dropped if (dropped and\
          \ blanket) else [],\n            \"advisory_named_dropped\": adv}\n\n# ----------------------------------------------------------------\
          \ 入口\n\ndef main(final_text: str, manifest: str, prior_report: str,\n  \
          \       account_context: str, final_audit: str, gate_path: str) -> dict:\n\
          \    \"\"\"在**装配之后**的最终正文上重跑同一套确定性检查，并做出周期状态承载决定。\n\n    v1.1 的复检复用了模型自报的触发标志，因此第一道闸门错了它一定跟着错。\n\
          \    v1.2 复检不复用自报——触发生效值来自输入侧计算，与第一道闸门同源、可独立复算。\n    \"\"\"\n    body =\
          \ final_text or \"\"\n    body, _render, shell_fams = render_body(body)\n\
          \    try:\n        prior = json.loads(prior_report or \"{}\")\n    except\
          \ Exception:  # noqa: BLE001\n        prior = {}\n    slots = _parse_slots(account_context)\n\
          \n    eff = prior.get(\"triggers_effective\") or {}\n    if not eff:   \
          \                    # 第一道闸门的报告不可解析时不许静默放行\n        eff = {k: True for k\
          \ in TRIGGER_ITEMS}\n\n    # 独立复算：自己解析审计块，不复用第一道闸门的锚定行。\n    _self, anchors,\
          \ _mach = parse_audit(final_audit if (final_audit or \"\").strip() else\
          \ None)\n    audit_missing_after_repair = (gate_path == \"gate_repaired\"\
          \n                                  and not (final_audit or \"\").strip())\n\
          \    if audit_missing_after_repair:\n        # 补齐节点改了正文却没重发审计块。不一刀切判死：回落到首轮锚定行，\n\
          \        # 指得回新正文的仍然算数，指不回的如实计为 unanchored。\n        anchors = (prior.get(\"\
          audit_anchors\") or {})\n        _mach = {}\n    min_fails = check_min_output(body)\n\
          \    leaks = check_leaks(body)\n    contra_in, contra_in_adv = check_input_contradiction(slots,\
          \ body)\n    loaded, notloaded, contra_man, man_present, man_echo = check_manifest(manifest,\
          \ body, _mach)\n    base_obj = prior.get(\"baseline_objects\") or extract_baseline_objects(slots)\n\
          \    cont = check_continuity(base_obj, body)\n\n    # 锚定行的实质检查在最终正文上重跑一遍（引用必须仍然逐字在正文里）\n\
          \    missing, unanchored, hollow, decorative, overlap, inapplicable, mostly_na\
          \ = check_items(eff, anchors, body)\n\n    hard = []\n    if min_fails:\n\
          \        hard.append(\"MIN_OUTPUT\")\n    if str(prior.get(\"gate_status\"\
          , \"\")).startswith(\"HARD_FAIL\"):\n        hard.append(\"FIRST_PASS_\"\
          \ + str(prior.get(\"gate_status\")).replace(\"HARD_FAIL_\", \"\"))\n   \
          \ if not (final_audit or \"\").strip() and gate_path != \"hard_fail_no_repair\"\
          :\n        audit_missing_after_repair = True\n\n    gaps_closed = not (hard\
          \ or leaks or contra_in or contra_man\n                       or missing\
          \ or unanchored\n                       or hollow or decorative or overlap)\n\
          \n    reasons = []\n    if hard:\n        reasons.append(\"本轮没有产出可用的运营判断（\"\
          \ + \"；\".join(min_fails or [\"上一道闸门已判硬失败\"]) + \"）\")\n    if cont.get(\"\
          status\") == \"MERGED\":\n        reasons.append(\"上一有效基线里的 \" + \"、\".join(cont[\"\
          not_restated\"])\n                       + \" 本轮未涉及 —— 投影按连续性义务逐字保留它们，不整体覆盖\"\
          )\n    if contra_in:\n        reasons.append(\"正文与本轮输入自相矛盾：\" + \"；\".join(contra_in))\n\
          \    if leaks:\n        reasons.append(\"交付里残留内部字段：\" + \"；\".join(leaks[:4]))\n\
          \    if contra_man:\n        reasons.append(\"与本轮参考文件清单矛盾：\" + \"；\".join(contra_man[:3]))\n\
          \    if audit_missing_after_repair:\n        reasons.append(\"补齐节点改了正文却没有重发配套的审计块，已回落用首轮锚点复核\"\
          )\n    if missing or unanchored or hollow or decorative or overlap:\n  \
          \      reasons.append(\"必填项仍未落实：缺 %d 项、指不回正文 %d 项、空洞 %d 项、装饰 %d 项、引用重叠 %d\
          \ 项\"\n                       % (len(missing), len(unanchored), len(hollow),\n\
          \                          len(decorative), len(overlap)))\n\n    # 两件事分开，别混成一个：\n\
          \    #   gaps_closed —— 必填项闸门有没有完全闭合（含\"补齐后锚点还能不能复核\"）；\n    #   carry \
          \      —— 这份交付够不够格成为**当前有效周期判断**。\n    # 后者只看交付本身是不是错的或丢了东西（零产出、丢基线对象、与输入矛盾、与清单矛盾、\n\
          \    # 残留内部字段）。锚点复核不上是\"没核到\"，不是\"交付错了\"——按 A3，\n    # 让有证据不受影响的项失效同样是错。\n\
          \    carry_blocking = bool(hard or contra_in or contra_man or leaks)\n \
          \   carry = \"REJECTED_KEEP_PREVIOUS\" if carry_blocking else \"ACCEPTABLE_AS_NEW_BASELINE\"\
          \n    if carry_blocking and not reasons:\n        reasons.append(\"交付本身不合格，具体见\
          \ post_gate_report\")\n\n    # 显式失败：不静默继续，也不假装合规。用户可见的说明是自然语言，不含内部字段。\n\
          \    notice = \"\"\n    if hard:\n        if base_obj.get(\"baseline_present\"\
          ):\n            notice = (\"（系统说明）本轮没有产出可用的运营判断，上面的内容不足以作为本周期的新判断。\"\n \
          \                     \"上一轮仍然有效的周期基线保持不变，本次不替换它。\")\n        else:\n   \
          \         notice = (\"（系统说明）本轮没有产出可用的运营判断，本账号目前也还没有被接受的周期基线。\"\n       \
          \               \"请补齐所缺的输入后重新发起。\")\n    # 未重述的对象由投影逐字保留，用户不需要看到这条系统内务，正文不追加噪声。\n\
          \n    out_text = (body + (\"\\n\\n\" + notice if notice else \"\"))\n\n\
          \    report = {\n        \"post_gate_version\": \"v1.2\",\n        \"first_pass_gate_status\"\
          : prior.get(\"gate_status\"),\n        \"hard_fail_reasons\": min_fails,\n\
          \        \"still_leaks\": leaks,\n        \"still_input_contradiction\"\
          : contra_in,\n        \"still_input_contradiction_advisory\": contra_in_adv,\n\
          \        \"still_manifest_contradiction\": contra_man,\n        \"still_missing\"\
          : missing, \"still_unanchored\": unanchored,\n        \"still_hollow\":\
          \ hollow, \"still_decorative\": decorative,\n        \"still_overlapping\"\
          : overlap,\n        \"still_inapplicable\": inapplicable,\n        \"still_family_mostly_inapplicable\"\
          : mostly_na,\n        \"audit_missing_after_repair\": audit_missing_after_repair,\n\
          \        \"continuity\": cont,\n        \"triggers_effective_used\": eff,\n\
          \        \"gaps_closed\": gaps_closed,\n        \"carry_blocking\": carry_blocking,\n\
          \        \"cycle_state_carry\": carry,\n        \"carry_reject_reason\"\
          : reasons,\n        \"control_marker_leaked\": (\"<<AUDIT>>\" in body or\
          \ \"<<TRIGGERS>>\" in body),\n        \"think_leaked\": \"<think>\" in body,\n\
          \        \"body_chars\": len(_nows(body)),\n    }\n    return {\"post_gate_report\"\
          : json.dumps(report, ensure_ascii=False),\n            \"gaps_closed\":\
          \ \"yes\" if gaps_closed else \"no\",\n            \"cycle_state_carry\"\
          : carry,\n            \"carry_reject_reason\": json.dumps(reasons, ensure_ascii=False),\n\
          \            \"operating_judgment_final\": out_text}"
