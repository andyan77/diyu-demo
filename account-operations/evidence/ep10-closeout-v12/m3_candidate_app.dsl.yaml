          ]\\n]{0,24})?\\]`?\"\n    r\"\\s*[：:]?\\s*|(?<![0-9A-Za-z_])`?\\[\\s*\\\
          ]`?\\s*\")\n\n\nSHELL_FAMILY = {\"探索\": \"explore\", \"暂定锚点\": \"anchor\"\
          , \"冲突反馈\": \"conflict\",\n                \"无任务\": \"notask\", \"无内容任务\"\
          : \"notask\"}\n\n\ndef render_body(body):\n    \"\"\"把外观层的机器痕迹确定性地还原成人话。只动外观，不动任何一句判断的内容。\n\
          \n    顺带返回它剥掉了哪几族标签——审计块整体缺失时，这是关于\"模型自己认为哪些触发命中\"\n    的**结构性**证据，比正文措辞可靠。\n\
          \    \"\"\"\n    t = body or \"\"\n    applied, fams = [], set()\n    hits\
          \ = LABEL_SHELL.findall(t)\n    n = len(hits)\n    if n:\n        for m\
          \ in re.finditer(r\"\\[(探索|暂定锚点|冲突反馈|无任务|无内容任务)\", t):\n            fams.add(SHELL_FAMILY[m.group(1)])\n\
          \        t = LABEL_SHELL.sub(\"\", t)\n        applied.append(f\"剥掉方括号标签壳\
