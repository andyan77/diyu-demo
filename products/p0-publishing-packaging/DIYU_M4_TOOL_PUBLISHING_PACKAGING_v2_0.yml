                                      ✅ `BRF-SUHE-001-F02`　`BRF-SUHE-001-A01`
                                      ❌ `F02`　`A01`　`F2`　「第二条」　「商品那条」
                                      简写、自造编号、以及 `fact_refs[]` 里根本不存在的编号，
                                      **一律按没有回指处理**。

                                      **必须覆盖这六处**：
                                        1. `realized_payoff`
                                        2. `recommended_title`
                                        3. `cover`
                                        4. `final_publish_copy`
                                        5. 评论区的**预埋回答**（不只是置顶那一条）
                                        6. **任何被当成真实发生过的事**——人物的动作、人物的原话、
                                           内部的讨论／决定／试验过程

                                      第 6 类是最容易漏的：它读起来像叙述，不像"事实陈述"，
                                      但它断言了某件事发生过，**和报一个价格是同一性质**。

                                      一个事实可以对应多个 `fact_id`；**纯创意执行指令**（怎么排版、
                                      什么语气、镜头怎么切、字幕怎么断句）不强制绑定。

                                      **找不到对应 `fact_id` 时，只有一条路：不生成它。**
                                      不得改写成"可能发生过""据说""印象中"这类模糊措辞继续保留；
