                                      非视频成品单元清单。写明来源、确认状态、权限与时效，**不得只写"有"**
            realized_payoff           **FINAL 模式必填** —— 从 manifest 归纳：哪些 beat 被覆盖、哪些事实有画面支撑
            uncovered_beats[]         FINAL／MIXED 必填 —— 计划里有、实际没拍到或没拍够的。
                                      **FINAL 下每一项必须写出已完成的处置结果，不得有 OPEN 项**
            used_fact_refs[]          事实回指。逐条写三格：
                                        output_location   这句话出现在产出的哪一处
