            ## 输出

            ```
            mode                      PRE | MIXED | FINAL —— **推导得出，不是填的**：按三级判据依次判
                                      （① 没有 beat 级 manifest／还有计划素材不存在且未正式取消 ＝ PRE；
                                       ② 有 manifest 但还剩待补拍、待替换、待人工决定、处理方式不明
                                         或承诺尚未降档的缺口 ＝ MIXED；
                                       ③ 有 manifest 且所有缺口都已处置完、包装已按 realized_payoff 收敛 ＝ FINAL）。
                                      必须写出推导依据：manifest 在不在、每条 beat 的缺口处于什么状态。
                                      **「有，但不够」本身不决定 mode，缺口有没有处置完才决定**
                                      （M4：此处「manifest」＝ beat 级 realization_manifest 或合法等价兑现证据，
                                       判据不变；资产级清单仍然不算）
