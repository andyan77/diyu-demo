            本版**不复制、不新建 `references/`**，引用的是源 Skill 目录下既有的三份文件：

            - `../writing-creative-scripts/references/platforms.md` — 三平台的**结构性参数**：图片张数上限、单屏字数、竖屏安全区。**只在它改变结构时读**——「最多 18 张」直接决定这条能有几个 beat；平台包装（标题、封面、发布文案）不在这里，归 Publishing & Packaging
