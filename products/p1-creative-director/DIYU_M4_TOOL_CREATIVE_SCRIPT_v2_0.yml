          # B-02：事实核验必须由代码判定，不能由模型自报（阻断修复任务 S2）。
          # 只做"引用可解析性"这一件事：FACT_LEDGER 里的每一个 fact_id，必须能在本次
          # 输入原文（capability_call + professional_input）里找到。找不到 = Critical
          # Error = 阻断交付。做不到、也不冒充能做到的事：判断一条事实性陈述是否
          # "实际为真"——那仍然是模型的语义核验职责，本节点只堵一个可机械核验的漏洞：
          # 编号对不上号，或者压根没有登记事实核验的可回指结构。

          FL_OPEN, FL_CLOSE = "---M4_FACT_LEDGER---", "---END_M4_FACT_LEDGER---"
          U_OPEN, U_CLOSE = "---M4_USER_DELIVERY---", "---END_M4_USER_DELIVERY---"

          LEDGER_FIELDS = ["output_location", "factual_claim", "fact_id"]

          STATUS_RE = re.compile(r"fact_check_status\s*[:：]\s*(PASS|FAIL|NOT_VERIFIED)", re.IGNORECASE)


          def _between(text, a, b):
              i = text.find(a)
              if i < 0:
                  return None
              j = text.find(b, i + len(a))
              if j < 0:
                  return None
              return text[i + len(a):j].strip()


          def _replace_between(text, a, b, new_inner):
              i = text.find(a)
              j = text.find(b, i + len(a)) if i >= 0 else -1
              if i < 0 or j < 0:
                  return text
              return text[:i + len(a)] + "\n" + new_inner + "\n" + text[j:]


          def _parse_ledger(block):
              """返回 (entries, status, note)。status ∈ OK | NONE | PARSE_FAILED。
              与 returns_adapter._parse_returns 同一纪律：解析失败 != NONE。"""
              if block is None:
                  return [], "PARSE_FAILED", "缺少 FACT_LEDGER 块，无法判定是没有事实性陈述还是产出被截断"
              s = block.strip()
              if s == "":
                  return [], "PARSE_FAILED", "FACT_LEDGER 块为空。空 != NONE：没有事实性陈述时必须显式写 NONE"
              if s.upper() == "NONE":
                  return [], "NONE", "显式声明本次没有需要登记的事实性陈述"

              groups = [g for g in re.split(r"\n\s*\n", s) if g.strip()]
              out, bad = [], []
              for g in groups:
                  item = {}
                  for line in g.split("\n"):
                      m = re.match(r"^\s*([a-z_]+)\s*:\s*(.*)$", line)
                      if m:
                          item[m.group(1)] = m.group(2).strip()
                  miss = [f for f in LEDGER_FIELDS if f not in item or item[f] == ""]
                  if miss:
                      bad.append("一条 FACT_LEDGER 缺字段：%s" % ",".join(miss))
                      continue
                  item["fact_id"] = [x.strip() for x in item["fact_id"].split("|") if x.strip()]
                  if not item["fact_id"]:
                      bad.append("一条 FACT_LEDGER 的 fact_id 为空")
                      continue
                  out.append(item)

              if bad:
                  return out, "PARSE_FAILED", "；".join(bad)
              if not out:
                  return [], "PARSE_FAILED", "FACT_LEDGER 块存在内容但无法解析出任何合法条目"
              return out, "OK", "解析出 %d 条" % len(out)


          def main(raw_text, capability_call, professional_input):
              raw = raw_text or ""
              blob = (capability_call or "") + "\n" + (professional_input or "")

              ledger_block = _between(raw, FL_OPEN, FL_CLOSE)
              entries, ledger_status, ledger_note = _parse_ledger(ledger_block)

              unresolved = []
              for e in entries:
                  bad_ids = [fid for fid in e["fact_id"] if fid not in blob]
                  if bad_ids:
                      unresolved.append({
                          "output_location": e["output_location"],
                          "unresolved_fact_id": bad_ids,
                      })

              critical_error = (ledger_status == "PARSE_FAILED") or bool(unresolved)
              fact_check_status_code = "FAIL" if critical_error else "PASS"

              m = STATUS_RE.search(raw)
              self_reported = m.group(1).upper() if m else "ABSENT"
              mismatch = (
                  self_reported != "ABSENT"
                  and self_reported != fact_check_status_code
                  and not (fact_check_status_code == "PASS" and self_reported == "NOT_VERIFIED")
              )

              fact_gate_blocked = (fact_check_status_code == "FAIL")

              if fact_gate_blocked:
                  if ledger_status == "PARSE_FAILED" and not unresolved:
                      reason = "FACT_LEDGER 结构无法解析（%s），无法核验任何一条事实性陈述的引用" % ledger_note
                  else:
                      detail = "；".join(
                          "%s → %s" % (u["output_location"], "|".join(u["unresolved_fact_id"]))
                          for u in unresolved[:5]
                      )
                      reason = "有 %d 处事实性陈述的引用编号，在本次登记的事实里找不到对应项：%s" % (len(unresolved), detail)
                  override = (
                      "这一次的发布判断被系统拦下，不能直接使用。\n\n"
                      "原因：%s。按规则，找不到来源的事实性陈述不能进入可发布结果——这不是文案问题，是事实核验没过。\n\n"
                      "专业判断本身没有丢：完整记录留在内部产出里。需要的是把引用编号核对清楚，"
                      "或者把对应的事实正式登记进来，然后重新走一次。\n\n"
                      "这次不算发布就绪，请不要把它当成可以直接使用的结果。"
                  ) % reason
                  verified_text = _replace_between(raw, U_OPEN, U_CLOSE, override)
              else:
                  verified_text = raw

              return {
                  "verified_text": verified_text,
                  "fact_check_status_code": fact_check_status_code,
                  "fact_check_scope_note": (
                      "code 只核验 FACT_LEDGER 里的 fact_id 是否能在本次输入原文里找到（引用可解析性），"
                      "不核验、也无法核验事实性陈述本身是否真实——那仍然是模型语义核验的职责。PASS 在这里的准确含义是"
                      "「未发现无法解析的引用」，不是「已证实全部为真」。"
                  ),
                  "self_reported_status": self_reported,
                  "fact_check_mismatch": "true" if mismatch else "false",
                  "ledger_status": ledger_status,
                  "ledger_note": ledger_note,
                  "ledger_entries_count": len(entries),
                  "unresolved_entries": unresolved,
                  "fact_gate_blocked": "true" if fact_gate_blocked else "false",
              }
        code_language: python3
        desc: B-02：代码判定事实引用可解析性并覆写 fact_check_status；Critical Error 阻断交付（改写用户交付块），不只是记一笔。
