        desc: 按统一能力合同 §12 加载矩阵确定性投影；不由 LLM 决定加载范围；不建第二套附件库。
        selected: false
        template: |
          {%- set INDS = ["服装 / 门店零售", "餐饮 / 门店", "知识付费 / 课程", "动漫 / 原创 IP", "户外 / 露营（爱好垂类）"] -%}
          ## 参考投影 · 按 M4 统一能力合同 §12 加载矩阵确定性选出

          ### platforms.md :: 结构性参数（只取影响内容结构 / 构图的部分）

