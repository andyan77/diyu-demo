                  "ask": "这条明确**不**承诺什么？（这一项下游最容易悄悄加回来）",
                  "why": "不明确说清楚不承诺什么，下游制作和发布环节最容易把没说过的承诺悄悄加回去，变成事实上的过度承诺。",
                  "how": "补一句明确不承诺什么就够；不说的话，我只能按“只呈现已核实事实、不做任何延伸承诺”处理，偏保守。",
              },
              "cta_contract": {
                  "ask": "这条要不要引导观众做什么？如果要，做什么、谁在哪里接？",
                  "why": "不知道要不要引导、谁来接，内容可能引导了观众却没人承接，或者该引导的地方什么都没说。",
                  "how": "说清楚要不要引导、谁接就够；不说的话，我只能按“不含任何引导”给一版内容，之后你随时可以自己加。",
              },
              "asset_publish_permission": {
                  "ask": "这些素材可以公开发布吗？有没有第三方入镜或授权限制？",
                  "why": "不确认能不能公开发布，内容可能因为肖像权、授权问题发布后被迫下架或引发纠纷。",
                  "how": "确认一下发布权限就够；不确认的话，这一条我只能先按“不涉及需要额外授权的素材”这个假设给受限结论，实际发布前你需要自己核实。",
              },
          }


          def main(status, note, missing, capability_call):
              miss = missing or []
              # 只追问当前最具区分力的一项，并翻译成自然语言（不向用户暴露内部字段名）
              ask_key = miss[0] if miss else ""
              item = QUESTION_MAP.get(ask_key) if ask_key else None
              if item:
                  ask_one, why_one, how_one = item["ask"], item["why"], item["how"]
              else:
                  ask_one = "还差一项才能做判断，你能补一句说明吗？"
                  why_one = "缺了这一项，我没法确认接下来的判断站不站得住，容易给出经不起推敲的结论。"
                  how_one = "补一句具体说明就够；说不清楚的话，我只能先给一个不依赖这一项、范围更窄的受限结论。"

              ret = {
                  "source": CAPABILITY,
                  "highest_damaged_layer": LAYER,
                  "precise_gap": "；".join(miss) if miss else (note or "未指明"),
                  "affected_objects": ["仅本次 %s 调用及其真实依赖分支" % CAPABILITY],
                  "proposed_disposition": "ESCALATE",
                  "needs_user_decision": True,
                  "downstream_stale": ["仅真实依赖本次 %s 结论的下游项" % CAPABILITY],
                  "parse_status": "OK",
              }

              user_text = (
                  "这一步我还差一样东西才能往下判断：\n\n"
                  "缺什么：%s\n\n"
                  "为什么：%s\n\n"
                  "怎么补：%s\n\n"
                  "只补这一项就够了，其他已经给过的内容不用再说一遍。\n"
                  "这一轮里不依赖这一步的其他事情不受影响，可以照常继续。" % (ask_one, why_one, how_one)
              )

              # 机械自检：用户交付里不得出现任何内部字段名（AC-13 / N-23）
              leaked = [k for k in QUESTION_MAP if k in user_text]

              return {
                  "returns_json": json.dumps([ret], ensure_ascii=False),
                  "user_delivery_leaks": leaked,
                  "return_status": "COMPONENT_RETURN",
                  "branch_result": "INPUT_INSUFFICIENT",
                  "is_task_terminal_state": "false",
