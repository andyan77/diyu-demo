    - data:
        code: |2

          # B-04：无依据当前市场断言检测（阻断修复任务 S2）。
          # 模式清单外置为独立、带版本的仓库文件（不是本节点专有资产，供其余 SKU 复用）：
          #   content-production/shared/fact-and-market-guards/MARKET_CLAIM_PATTERNS_v1.0.json
          #   sha256=dbdda0ac2395aa909e5d648f78a04a55b9ae0035fae95743e987ee3a0874abbc
          # Dify code 节点沙箱不能在运行时读取仓库文件，这里嵌入的是该文件此版本号下的字节快照；
          # 更新模式清单时两处必须同步，且必须同步升版本号（见该文件 sync_discipline 字段）。
          PATTERN_SET_VERSION = "1.0"
          PATTERN_SET_SOURCE = "content-production/shared/fact-and-market-guards/MARKET_CLAIM_PATTERNS_v1.0.json"
          PATTERN_SET_SHA256 = "dbdda0ac2395aa909e5d648f78a04a55b9ae0035fae95743e987ee3a0874abbc"

          MARKET_CLAIM_PATTERNS_ZH = [
              "当前最热", "现在最热", "目前最热", "最近最热", "当下最热", "当前最火", "现在最火",
              "当前最流行", "现在最流行", "目前最流行",
              "当前最少", "现在最少", "目前最少",
              "当前最稀缺", "现在最稀缺", "目前最稀缺",
              "当前竞争最小", "现在竞争最小", "目前竞争最小", "当前竞争最少",
              "同类内容很少", "同类内容目前很少", "现在同类内容很少", "目前同类内容很少",
              "最佳发布时间", "当前最佳发布时间", "现在是最佳发布时间", "目前是最佳发布时间",
              "当前最好的发布时间", "现在最好的发布时间",
              "正当红", "现在正当红", "当下爆款", "当前爆款", "现在是爆款",
              "近期爆火", "最近很多人在搜", "最近搜索量暴涨", "目前搜索量最高", "当前搜索量最高",
              "现在的热门话题", "当下的流量密码", "当前的流量密码",
              "当前平台在推", "现在平台在推", "算法现在偏爱", "当前算法偏爱",
              "现在是风口", "当前是风口", "现在正是风口期", "目前是风口期",
              "现在同赛道很少人做", "目前同赛道很少人做", "现在这个赛道竞争小",
          ]
          MARKET_CLAIM_PATTERNS_EN = [
              "currently the most popular", "currently trending", "trending right now",
              "hottest trend right now", "the hottest topic right now",
              "right now is the best time to post", "best time to post right now",
              "currently very few similar", "very few similar posts right now",
              "low competition right now", "currently low competition", "current market",
              "right now the algorithm favors", "currently the algorithm favors",
              "this is currently the trend", "the current trend is",
          ]

          U_OPEN, U_CLOSE = "---M4_USER_DELIVERY---", "---END_M4_USER_DELIVERY---"


          def _between(text, a, b):
              i = text.find(a)
              if i < 0:
                  return None
              j = text.find(b, i + len(a))
              if j < 0:
                  return None
              return text[i + len(a):j].strip()


          def _replace_between(text, a, b, new_inner):
              i = text.find(a)
              j = text.find(b, i + len(a)) if i >= 0 else -1
              if i < 0 or j < 0:
                  return text
              return text[:i + len(a)] + "\n" + new_inner + "\n" + text[j:]


          def main(text_in):
              raw = text_in or ""
              ud = _between(raw, U_OPEN, U_CLOSE) or ""
              ud_lower = ud.lower()

              hits = [p for p in MARKET_CLAIM_PATTERNS_ZH if p in ud]
              hits += [p for p in MARKET_CLAIM_PATTERNS_EN if p.lower() in ud_lower]

              blocked = bool(hits)

              if blocked:
                  override = (
                      "这一次的发布判断被系统拦下，不能直接使用。\n\n"
                      "原因：产出里把某种当下的市场状态当成既定事实来断言了（比如哪个方向眼下最受欢迎、"
                      "同类内容眼下的多少、哪个时间点眼下最合适发布这一类判断），但这类判断没有实时市场数据支撑。"
                      "按规则，无依据的当前市场断言属于严重问题，直接阻断。\n\n"
                      "专业判断本身没有丢：不依赖这类断言的其余部分不受影响。需要的是把这类说法去掉，"
                      "改成基于平台表达机制本身的判断（不依赖\"此刻是什么状态\"这类前提），然后重新走一次。\n\n"
                      "这次不算发布就绪，请不要把它当成可以直接使用的结果。"
                  )
                  verified_text = _replace_between(raw, U_OPEN, U_CLOSE, override)
              else:
                  verified_text = raw

              return {
                  "verified_text": verified_text,
                  "market_claim_blocked": "true" if blocked else "false",
                  "market_claim_hits": hits,
                  "market_claim_pattern_version": PATTERN_SET_VERSION,
                  "market_claim_pattern_source": PATTERN_SET_SOURCE,
                  "market_claim_pattern_sha256": PATTERN_SET_SHA256,
              }
        code_language: python3
        desc: B-04：无依据当前市场断言检测（模式清单独立带版本文件，见 content-production/shared/fact-and-market-guards/）；命中即 Critical Failure，改写用户交付块阻断交付。
        outputs:
          market_claim_blocked:
            children: null
            type: string
          market_claim_hits:
            children: null
            type: array[string]
          market_claim_pattern_source:
            children: null
            type: string
          market_claim_pattern_sha256:
            children: null
            type: string
          market_claim_pattern_version:
            children: null
            type: string
          verified_text:
            children: null
            type: string
        selected: false
        title: 市场断言检测（B-04，独立模式文件，可复用单元）
        type: code
