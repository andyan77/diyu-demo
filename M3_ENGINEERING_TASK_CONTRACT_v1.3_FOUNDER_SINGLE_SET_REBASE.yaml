allowed_delta:
  - Add exactly the two approved audit-output-shape obligations to the M3 Skill
  - Remove code-fence presentation from the audit-block template so the template does not contradict the new obligation
  - Preserve audit fields and product semantics; do not add a new AC-09 synonym
  - Bind DD-5 and the Skill change as final candidate v1.5.2
  - Deploy v1.5.2 only to task App b7fb5b1a-9278-426c-bb8a-f9f288639548
  - Re-run deterministic gate replay, structural checks, prompt readback, canvas evidence, rollback and credential scans with zero model calls
  - Compile, freeze and hash one seven-input Founder Dify test package
  - After Founder supplies actual runs and a PASS or FAIL, bind the evidence and close or checkpoint without new model calls

boundary:
  authorized_after_exact_founder_instruction:
    - write only inside the existing M3 task branch/worktree and task-specific Dify candidate App
    - make the allowed v1.5.2 Skill/template/version/binding changes
    - run deterministic local checks and read-only project/Dify verification
    - publish the final candidate only in the task-specific Dify candidate/test App
    - generate Founder test instructions and evidence-ingestion tools that do not call a model
    - commit and push only the remote M3 task branch and verify its exact remote hash
    - record Founder-supplied test evidence and acceptance result after it occurs
  never_authorized:
    - any execution-side DeepSeek, Qwen or other model call through API, script, runner, Dify debug endpoint or background job
    - rerun G1-A or any behavior, fidelity, longitudinal, A/B or B-arm case
    - blind testing, blind review, 36 reviewers, unblinding or same-model A/B gain proof
    - automatic repair or a second product-test round after Founder FAIL
    - modify production Dify objects, non-task Apps, credentials, databases or business systems
    - merge or direct-push main, create or merge a PR, rewrite history or start M5
    - claim superiority to a good prompt, production readiness, M5 gain, causal lift or real business improvement
  protected_assets:
    - Matrix positioning authority and accepted/provisional account-anchor identity
    - Campaign goals, validity, constraints and overlay authority
    - M2 raw observation, provenance, persistence, version and permission authority
    - Content Brief, Creative Tournament, Script, Production Director and Publishing and Packaging responsibilities
    - six existing professional Skills, except the authorized M3 Skill delta
    - all production systems, user assets, credentials, other task histories and unknown pre-existing files

product_semantics_unchanged:
  - M3 is one continuous operating judgment capability, not a scheduler, topic picker, four-state machine or universal brain
  - an effective or explicit provisional anchor is sufficient unless the affected branch truly cannot proceed safely
  - long-term value, launch, follower growth, traffic, GMV, leads, store visits and mixed goals remain non-interchangeable
  - each content task has one primary job and limited secondary contributions
  - expected, baseline and actual capacity remain distinct and require real tradeoffs
  - stable delivery, controlled exploration, finite experiments, feedback response and justified non-change remain operational duties
  - absent external market evidence does not stop market-independent operating judgment and never licenses uniqueness claims
  - M2 owns raw observations and persistence; M3 produces only diagnosis, plan, content-task and review-update candidates
  - M3 does not alter Matrix positioning, choose single-item creative mechanisms or write scripts, production or packaging
  - NO_CONTENT_TASK remains reasoned, scoped, reversible and cannot evade available work
  - simulation and Founder testing do not prove real operating lift

final_candidate:
  version: v1.5.2
  approved_skill_delta:
    - "审计块只能出现在正文之后；正文不存在时不许单独输出审计块。"
    - "审计块不加代码围栏，前后不加任何三个反引号标记。"
  dd5_binding: M3_REBIND_007_FROZEN_v1.0.md
  model_rerun_required: false
  effect_claim_before_founder_run: INFERRED_NOT_OBSERVED

founder_single_test_set:
  set_size: 7
  runs_per_input: 1
  executor_model_calls: 0
  founder_runs_in_designated_dify_app: true
  scenarios:
    - id: S1
      purpose: provisional anchor without formal positioning must still permit bounded judgment
    - id: S2
      purpose: distinguish long-term value, GMV, leads and store visits while honoring store-visit priority
    - id: S3
      purpose: capacity drops from three tasks to one and requires an explicit real tradeoff
    - id: S4
      purpose: no external market evidence; complete all market-independent work without uniqueness claims or zero-body escape
    - id: S5
      purpose: version-bound conflicting feedback requires keep, adjust, pause or redesign without silent position loss
    - id: S6
      purpose: convert a formed topic into a Content Brief-consumable task with one primary job
    - id: S7
      purpose: refuse positioning, creative-mechanism and script takeover while still completing the in-scope M3 judgment
  freeze_rule: >-
    Exact inputs, sources, hashes, candidate binding and natural-language
    acceptance questions are frozen before Founder runs the first input and may
    not be changed after any result is seen.
  retry_rule: >-
    A content failure, empty model answer, omission, gate rejection or Founder
    dissatisfaction is not retried. One identical-input retry is allowed only
    for a recorded pure transport failure that produced no model output; both
    attempts remain preserved.

acceptance:
  deterministic_technical_gates:
    - exact task identity, branch, remote, candidate, Skill, system prompt, graph and Dify App are bound
    - v1.5.2 contains only the authorized Skill/template delta plus inherited DD-5 and necessary version/binding changes
    - zero-model replay has no new false rejection and preserves known true-rejection behavior
    - system-prompt readback equals the final Skill-derived prompt exactly
    - rendered Dify canvas and exported graph match the final candidate and contain no unauthorized node or external write
    - credential and protected-asset scans are clean
    - rollback export and restoration procedure are exercised without touching production
    - the seven-input package is complete, exact, reproducible and usable by Founder without execution-side interpretation
  founder_product_gate:
    authority: Founder
    result: PASS_OR_FAIL
    pass: all hard boundaries hold and Founder accepts the seven actual outputs as a usable M3 capability
    fail: any hard failure or Founder overall product rejection
    no_partial: true
    no_automatic_second_round: true
  hard_failures:
    - fabricated fact or permission/CTA overreach
    - GMV, leads and store visits collapsed into one generic conversion
    - long-term value rewritten as cheap traffic or short-term objective rewritten as long-term value
    - no-market-data case returns no substantive body, only asks for more input, or claims unsupported uniqueness
    - NO_CONTENT_TASK evades work that could be completed
    - Matrix positioning, creative mechanism, script, production or packaging takeover
    - output is not Content Brief-consumable or combines competing primary jobs
    - gate or repair node authors the substantive M3 deliverable for the model
    - simulation or test output is presented as real business improvement
  acceptance_mapping:
    M3-AC-00: APPLICABLE_DETERMINISTIC_BINDING
    M3-AC-01_through_M3-AC-17: APPLICABLE_VIA_DETERMINISTIC_EVIDENCE_AND_FOUNDER_SINGLE_SET
    M3-AC-18_legacy_blind_ab: NOT_APPLICABLE_BY_FOUNDER_REBASE
    M3-AC-19_legacy_blind_or_model_reviewer: NOT_APPLICABLE_BY_FOUNDER_REBASE
    M3-AC-20: APPLICABLE_REMOTE_ROLLBACK_AND_FOUNDER_ACCEPTANCE
  sufficiency_statement: >-
    Passing all applicable deterministic gates plus one Founder PASS proves only
    that the bound M3 candidate was technically intact and Founder-accepted on
    the frozen seven-input Dify set. It does not prove superiority to a good
    prompt, M5 finished-content gain, production readiness, causal lift or real
    business improvement.

evidence_reuse_policy:
  default: EXACT_BINDING_AND_DEPENDENCY_IMPACT_ONLY
  historical_model_outputs: diagnostic_history_not_final_candidate_product_acceptance
  dd1_and_dd5_deterministic_evidence: reusable_if_code_and_checker_hashes_match
  final_full_model_run_required: false
  founder_single_set_required: true
  dynamic_dify_binding_requires_refresh: true

p0_deliverables:
  - final M3 v1.5.2 Skill and task-specific Dify candidate binding
  - zero-model deterministic replay, structural, prompt, canvas, credential and rollback evidence
  - one frozen seven-input Founder Dify test package with exact instructions and hashes
  - Founder-supplied raw outputs, run identifiers and PASS or FAIL record when available
  - exact task-branch remote hash and claim-limit closeout

terminal_rules:
  evaluation_order: [INVALID, DONE, PARTIAL, BLOCKED, FAILED]
  allowed_final_states: [INVALID, DONE, BLOCKED, FAILED]
  partial_delivery_authorized: false
  done: all applicable deterministic gates pass, Founder returns PASS, remote and rollback closure pass
  failed: Founder returns FAIL or an applicable hard gate fails and no authorized correction remains before Founder run
  blocked: a required external fact, access or Founder run cannot proceed after all authorized in-scope work is complete
  invalid: task identity, authority, protected boundary or evidence integrity is irrecoverably violated
  checkpoint_is_not_terminal: true

next_stage_default: false
merge_main: NOT_AUTHORIZED
m5: NOT_STARTED_NOT_AUTHORIZED
