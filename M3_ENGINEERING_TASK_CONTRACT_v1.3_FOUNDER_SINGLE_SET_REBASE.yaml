authorization_gate: >-
  This contract and its paired Execution Prompt are planning deliverables. Work
  may resume only when Founder explicitly authorizes the exact Prompt and this
  exact contract hash. File presence, prior engineering authority and prior
  DeepSeek budgets do not authorize any new model call.

what: >-
  Continue the same M3 engineering task from the frozen v1.5/v1.5.1 evidence.
  Produce final candidate v1.5.2 by applying the approved audit-output-shape
  hardening and the already frozen DD-5 deterministic gate repair; deploy it only
  to the task-specific Dify candidate App; complete zero-model structural,
  binding, rollback and evidence checks; and deliver one frozen seven-input
  Founder Dify test package. Founder, not execution side, runs the seven inputs
  once each and returns the sole product-acceptance PASS or FAIL.

why: >-
  Finish one usable, evidence-bound single-account continuous operating capability
  without another blind-review or repeated-evaluation loop, while preserving all
  M3 product duties, technical integrity, failure history and claim limits.

